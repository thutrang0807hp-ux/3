 const r=libraryRecipes.find(r=>r.id===librarySelection);
 $('#recipeDetail').innerHTML=r?'<header><h3>'+esc(r.name)+'</h3><p><span class="recipeTag">'+esc(r.industry)+'</span> '+esc(r.videoType)+' · '+SFRecipes.duration(r)+'s · '+r.beats.length+' nhịp</p></header>'+(r.sourceName?'<div class="recipeOrigin">'+(r.sourcePoster?'<img src="'+esc(r.sourcePoster)+'" alt="">':'')+'<div>Video nguồn · '+esc(r.sourceName)+'<small>'+libraryStats(r)+'</small></div></div>':'')+SFRecipes.bar(r)+'<div class="recipeRuler"><span>0s</span><span>'+SFRecipes.duration(r)+'s</span></div><div class="recipeBeats">'+r.beats.map(b=>'<article><i style="background:'+SFRecipes.colors[b.role]+'"></i><div><strong>'+esc(b.name)+'</strong><p>'+esc(b.purpose)+'</p><span class="recipeTag">'+SFRecipes.shots[b.type]+'</span> <em>'+esc(b.example||'Lời mới sẽ được viết cho sản phẩm của bạn.')+'</em></div><small>'+b.start+'–'+b.end+'s</small></article>').join('')+'</div><p class="recipeTips"><b>Mẹo của công thức:</b> '+esc(r.tips||'Chưa có mẹo riêng.')+'</p><div class="recipeDetailActions"><button id="renameRecipe">Đổi tên</button><button id="deleteRecipe">Xóa</button><button id="useRecipe" class="primary">Dùng công thức này</button></div>':'<p class="recipeEmpty">Chọn một công thức để xem các nhịp.</p>';
 if(!r)return;
 $('#renameRecipe').onclick=()=>{const name=prompt('Tên công thức',r.name);if(name?.trim())bridge.putRecipe({...r,name:name.trim()}).then(refreshRecipes).then(drawLibrary).catch(e=>toast(e.message));};
 $('#deleteRecipe').onclick=async()=>{if(!confirm('Xóa công thức “'+r.name+'” khỏi kho? Kịch bản và timeline đã dùng được giữ.'))return;try{await bridge.removeRecipe(r.id);await refreshRecipes();librarySelection=libraryRecipes[0]?.id;drawLibrary();}catch(e){toast(e.message);}};
 $('#useRecipe').onclick=async()=>{try{await chooseRecipe(r.id);}catch(e){toast(e.message);}};
}
async function chooseRecipe(id){
 const r=libraryRecipes.find(r=>r.id===id);if(!r)return;
 if(draft.beats.some(b=>b.text.trim())&&!confirm('Đổi công thức sẽ thay các nhịp và lời hiện tại. Tiếp tục?'))return;
 await bridge.useRecipe(r.id,room.id);draft.formula=r.id;draft.formulaChosen=true;draft.recipeSnapshot=SFRecipes.strip(r);draft.beats=createBeats(recipeToFormula(r));draft.beats.forEach((b,i)=>{b.purpose=r.beats[i].purpose;});draft.plan=[];draft.missing=[];draft.scriptMode='ai';await save();$('#photoDialog').close();render();
 if(capabilities.gemini_configured&&draft.idea.trim()){
  if(pendingActions.has('write-ai'))return;pendingActions.add('write-ai');render();try{await writeAI();}finally{pendingActions.delete('write-ai');render();}
 }else toast('Đã áp khung nhịp. '+(draft.idea.trim()?'Kết nối Gemini để AI viết lời; bạn vẫn có thể tự viết.':'Điền ý chính, rồi AI viết lời hoặc bạn tự viết.'));
}
async function openRecipeLibrary(){
 await refreshRecipes();librarySelection=libraryRecipes.some(r=>r.id===draft.formula)?draft.formula:libraryRecipes[0]?.id;libraryQuery='';libraryIndustry='';librarySource='';
 modal('Kho kịch bản','<p class="recipeIntro">Kho chung cho mọi sản phẩm · khung sườn + nhịp + số giây; không lưu nguyên lời nguồn.</p><div class="recipeToolbar"><input id="recipeSearch" placeholder="⌕ Tìm công thức" aria-label="Tìm công thức"><select id="recipeIndustry" aria-label="Ngành"><option value="">Tất cả ngành</option>'+[...new Set([...SFRecipes.industries,...libraryRecipes.map(r=>r.industry)])].map(s=>'<option>'+esc(s)+'</option>').join('')+'</select><select id="recipeSourceFilter" aria-label="Nguồn"><option value="">Mọi nguồn</option><option value="reference">🎬 Từ video mẫu</option><option value="manual">✋ Bạn thêm</option></select><button id="recommendRecipes" '+(!capabilities.gemini_configured?'disabled title="Cần kết nối Gemini; chưa có đề xuất AI"':'')+'>✦ AI gợi ý</button><div class="recipeAddWrap"><button id="addRecipe" class="primary">＋ Thêm ▾</button><div id="recipeAddMenu" hidden><button id="recipeFromVideo" '+(!capabilities.gemini_configured?'disabled title="Cần Gemini để phân tích nội dung video"':'')+'>▸ Từ video bạn chọn<small>Phân tích nội dung và lưu khung sườn</small></button><button id="recipeFromManual">✎ Tự gõ<small>Nhập nhịp, thời lượng, câu ví dụ</small></button></div></div></div><div class="recipeColumns"><section id="recipeList"></section><section id="recipeDetail"></section></div><div class="recipeLegend">'+Object.entries(SFRecipes.labels).map(([k,n])=>'<span><i style="background:'+SFRecipes.colors[k]+'"></i>'+n+'</span>').join('')+'</div>');
 $('#photoDialog').classList.add('recipeDialog');drawLibrary();
 $('#recipeSearch').oninput=e=>{libraryQuery=e.target.value;drawLibrary();};$('#recipeIndustry').onchange=e=>{libraryIndustry=e.target.value;drawLibrary();};$('#recipeSourceFilter').onchange=e=>{librarySource=e.target.value;drawLibrary();};
 $('#recipeList').onclick=e=>{const b=e.target.closest('[data-recipe-select]');if(b){librarySelection=b.dataset.recipeSelect;drawLibrary();}};
 $('#addRecipe').onclick=()=>$('#recipeAddMenu').hidden=!$('#recipeAddMenu').hidden;$('#recipeFromManual').onclick=()=>editManualRecipe();
 $('#recipeFromVideo').onclick=()=>{recipeVideoInput.click();$('#recipeAddMenu').hidden=true;};
 $('#recommendRecipes').onclick=async()=>{const b=$('#recommendRecipes');b.disabled=true;try{const result=await bridge.engine('ai/recommend-recipes',{product_name:product.name,idea:draft.idea,recipes:libraryRecipes.map(r=>({id:r.id,name:r.name,industry:r.industry,up:r.up,down:r.down,beats:r.beats.map(b=>({name:b.name,purpose:b.purpose}))})),room_id:room.id,product_id:product.id});if(!Array.isArray(result.ids)||result.ids.some(id=>!libraryRecipes.some(r=>r.id===id)))throw Error('AI trả công thức không hợp lệ.');libraryRecommendation=[...new Set(result.ids)].slice(0,3);drawLibrary();}catch(e){toast(e.message);}finally{b.disabled=false;}};
}
function editManualRecipe(){
 let beats=[{name:'Hỏi',role:'question',type:'problem',seconds:4,purpose:'',example:''},{name:'Chốt',role:'close',type:'cta',seconds:4,purpose:'',example:''}];
 modal('Thêm công thức · Tự gõ','<div class="manualRecipeHeader"><label>Tên<input id="manualRecipeName" maxlength="160" placeholder="Tên công thức"></label><label>Ngành<select id="manualRecipeIndustry">'+SFRecipes.industries.map(n=>'<option>'+n+'</option>').join('')+'</select></label><label>Kiểu video<input id="manualRecipeType" value="Show sản phẩm" maxlength="80"></label></div><div id="manualRecipeBeats"></div><button id="addManualBeat">＋ Nhịp</button><label class="field">Mẹo<textarea id="manualRecipeTips" rows="2"></textarea></label><p id="manualRecipeError" class="errorBox" hidden></p>','<button id="backRecipes">Quay lại kho</button><button id="saveManualRecipe" class="primary">Lưu công thức</button>');$('#photoDialog').classList.add('recipeDialog');
 function draw(){ $('#manualRecipeBeats').innerHTML=beats.map((b,i)=>'<fieldset data-manual-beat="'+i+'"><legend>Nhịp '+(i+1)+'</legend><div class="manualBeatTop"><input data-prop="name" value="'+esc(b.name)+'" placeholder="Tên nhịp" aria-label="Tên nhịp"><select data-prop="role" aria-label="Loại nhịp">'+Object.entries(SFRecipes.labels).map(([k,n])=>'<option value="'+k+'" '+(k===b.role?'selected':'')+'>'+n+'</option>').join('')+'</select><select data-prop="type" aria-label="Kiểu cảnh">'+Object.entries(SFRecipes.shots).map(([k,n])=>'<option value="'+k+'" '+(k===b.type?'selected':'')+'>'+n+'</option>').join('')+'</select><label>Giây <input data-prop="seconds" type="number" min="0.2" max="600" step="0.1" value="'+b.seconds+'"></label><button data-remove-manual="'+i+'" title="Xóa nhịp">×</button></div><input data-prop="purpose" value="'+esc(b.purpose)+'" placeholder="Mục đích"><input data-prop="example" value="'+esc(b.example)+'" placeholder="Câu ví dụ tự viết, không chép nguyên lời nguồn"></fieldset>').join('');}
 draw();$('#manualRecipeBeats').oninput=e=>{const row=e.target.closest('[data-manual-beat]'),k=e.target.dataset.prop;if(row&&k)beats[Number(row.dataset.manualBeat)][k]=k==='seconds'?Number(e.target.value):e.target.value;};$('#manualRecipeBeats').onclick=e=>{const b=e.target.closest('[data-remove-manual]');if(b){beats.splice(Number(b.dataset.removeManual),1);draw();}};
 $('#addManualBeat').onclick=()=>{if(beats.length>=60)return toast('Tối đa 60 nhịp.');beats.push({name:'Nhịp mới',role:'benefit',type:'detail',seconds:4,purpose:'',example:''});draw();};$('#backRecipes').onclick=openRecipeLibrary;
 $('#saveManualRecipe').onclick=async()=>{try{let at=0;const r={id:uid(),name:$('#manualRecipeName').value,industry:$('#manualRecipeIndustry').value,videoType:$('#manualRecipeType').value,source:'manual',createdAt:Date.now(),tips:$('#manualRecipeTips').value,beats:beats.map(b=>{const row={...b,start:at,end:at+b.seconds};at+=b.seconds;return row;})};await bridge.putRecipe(SFRecipes.validate(r));await openRecipeLibrary();librarySelection=r.id;drawLibrary();}catch(e){$('#manualRecipeError').hidden=false;$('#manualRecipeError').textContent=e.message;}};
}
const recipeVideoInput=document.createElement('input');recipeVideoInput.type='file';recipeVideoInput.accept='video/mp4,video/webm';recipeVideoInput.hidden=true;document.body.append(recipeVideoInput);
recipeVideoInput.onchange=async()=>{const file=recipeVideoInput.files[0];recipeVideoInput.value='';if(!file)return;try{if(file.size>18*1024*1024)throw Error('Phân tích trực tiếp nhận video tối đa 18 MB; hãy cắt ngắn hoặc nén trước.');await clipInfo(file);if(!confirm('Gửi video này tới Gemini để phân tích và lưu công thức? Có sử dụng hạn mức API.'))return;toast('Đang phân tích video. Không cần gửi lại.');const bytes=new Uint8Array(await file.arrayBuffer());let data='';for(let i=0;i<bytes.length;i+=8192)data+=String.fromCharCode(...bytes.subarray(i,i+8192));const raw=await bridge.engine('ai/recipe-video',{video_data:btoa(data),mime_type:file.type||'video/mp4',source_name:file.name,room_id:room.id,product_id:product.id});const r=await bridge.putRecipe({...raw,id:uid(),source:'video',sourceName:file.name,createdAt:Date.now()});await openRecipeLibrary();librarySelection=r.id;drawLibrary();}catch(e){toast(e.message);}};
actions['open-recipes']=openRecipeLibrary;
document.addEventListener('change',e=>{if(e.target.id==='scriptRecipe'&&e.target.value)chooseRecipe(e.target.value).catch(err=>toast(err.message));});
$('#photoDialog').addEventListener('close',()=>{if(!$('#photoDialog').open)$('#photoDialog').classList.remove('recipeDialog');});
const openBeforeLibrary=window.SceneForgeWorkflow.openRoom;
window.SceneForgeWorkflow.openRoom=async function(data){await openBeforeLibrary(data);await refreshRecipes();if(!libraryRecipes.some(r=>r.id===draft.formula)&&draft.recipeSnapshot){const f=recipeToFormula(draft.recipeSnapshot);if(!formulas.some(x=>x.id===f.id))formulas.push(f);}render();};
// Send only structure and purposes to the writer; examples are never reused as narration.
const writeBeforeRecipes=writeAI;
writeAI=async function(){if(!draft.idea.trim())return toast('Nhập ý chính / thông tin sản phẩm trước.');
 if(!draft.formulaChosen&&draft.beats.every(b=>!b.text.trim())&&libraryRecipes.length){const recommendation=await bridge.engine('ai/recommend-recipes',{product_name:product.name,idea:draft.idea,recipes:libraryRecipes.slice(0,300).map(r=>({id:r.id,name:r.name,industry:r.industry,up:r.up,down:r.down})),room_id:room.id,product_id:product.id});const selected=libraryRecipes.find(r=>r.id===recommendation.ids?.[0]);if(selected){libraryRecommendation=recommendation.ids;await bridge.useRecipe(selected.id,room.id);draft.formula=selected.id;draft.recipeSnapshot=SFRecipes.strip(selected);draft.beats=createBeats(recipeToFormula(selected));draft.beats.forEach((b,i)=>b.purpose=selected.beats[i].purpose);draft.formulaChosen=true;await save();}}
 const result=await bridge.engine('ai/script',{idea:draft.idea,product_name:product.name,formula:currentRecipe()?SFRecipes.strip(currentRecipe()):null,beats:draft.beats.map(b=>({id:b.id,name:b.name,type:b.type,seconds:b.seconds,purpose:b.purpose||''})),room_id:room.id,product_id:product.id});if(!Array.isArray(result.beats)||result.beats.length!==draft.beats.length||result.beats.some(b=>typeof b.text!=='string'))throw Error('Kết quả AI không khớp các nhịp.');result.beats.forEach((b,i)=>draft.beats[i].text=b.text.slice(0,5000));draft.plan=[];await save();render();toast('Đã nhận lời mới từ AI. Kiểm tra thông tin trước khi tạo giọng.');};actions['write-ai']=()=>writeAI();

// Keep the supplied two-row diagram. Saved user positions are never reset automatically.
let selectedPhotoNode=null,photoLayoutUndo=null;
const selectBeforeDesign=selectNode;selectNode=function(n){selectedPhotoNode=n?.dataset.node||null;selectBeforeDesign(n);};
const renderBeforeDesignLayout=render;render=function(){
 renderBeforeDesignLayout();if(!loaded)return;
 const inputs=['refs','bank'].map(id=>$('[data-node='+id+']')).filter(Boolean);
 const row=Math.max(690,...inputs.map(n=>n.offsetTop+n.offsetHeight+75));
 for(const id of ['formula','script','voice'])if(!draft.positions[id]){const n=$('[data-node='+id+']');if(n)n.style.top=row+'px';}
 if(selectedPhotoNode){const n=$('[data-node='+selectedPhotoNode+']');if(n)selectBeforeDesign(n);}
 requestAnimationFrame(drawWires);
};
const arrangePhoto=document.createElement('button');arrangePhoto.id='arrangePhoto';arrangePhoto.textContent='Xếp như mẫu';arrangePhoto.title='Xếp 7 node theo ảnh thiết kế gói 4; có thể hoàn tác';$('#photoZoom').append(arrangePhoto);
const undoPhoto=document.createElement('button');undoPhoto.id='undoPhotoLayout';undoPhoto.textContent='↶';undoPhoto.title='Hoàn tác xếp node';undoPhoto.hidden=true;$('#photoZoom').append(undoPhoto);
arrangePhoto.onclick=()=>{photoLayoutUndo=structuredClone(draft.positions);draft.positions={};render();fit();scheduleSave();undoPhoto.hidden=false;};
undoPhoto.onclick=()=>{if(!photoLayoutUndo)return;draft.positions=photoLayoutUndo;photoLayoutUndo=null;render();fit();scheduleSave();undoPhoto.hidden=true;};
</script></body></html>
