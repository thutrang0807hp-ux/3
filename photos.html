const SFRecipes = (() => {
 const colors={neutral:'#858f9d',question:'#f0645a',solution:'#3cc8e0',benefit:'#a98bf5',trial:'#fa9b58',proof:'#f5b544',close:'#d4f53c'};
 const labels={neutral:'Chưa phân vai',question:'Hỏi / Vấn đề',solution:'Giải pháp',benefit:'Lợi ích',trial:'Dùng thử',proof:'Bằng chứng',close:'Chốt'};
 const shots={orbit:'Cận cảnh xoay',detail:'Chi tiết',use:'Trong bối cảnh dùng',hands:'Tay thao tác',problem:'Vấn đề',result:'Kết quả',wide:'Toàn cảnh',cta:'Kêu gọi mua'};
 const industries=['Chung','Đồ xe','Mỹ phẩm','Đồ bếp','Khác'];
 function seed(id,name,parts){let at=0;return{id,name,industry:'Chung',videoType:'Show sản phẩm',source:'starter',tips:'Thay lời theo thông tin thực tế của sản phẩm. Kiểm tra công dụng trước khi xuất.',beats:parts.map(([name,role,type,seconds,purpose])=>{const b={name,role,type,start:at,end:at+seconds,purpose,example:''};at+=seconds;return b;})};}
 const starters=[seed('problem-solution','Hỏi → Giải pháp → Lợi ích → Chốt',[
 ['Hỏi','question','problem',4,'Gợi nhu cầu của người xem'],['Giải pháp','solution','use',5,'Giới thiệu sản phẩm trong bối cảnh sử dụng'],['Lợi ích','benefit','detail',6,'Một điểm khác biệt đã được xác minh'],['Dùng thử','trial','hands',5,'Thao tác rõ ràng, đúng hướng dẫn'],['Chốt','close','cta',4,'Mời xem thêm thông tin']]),
 seed('honest-review','Review · trải nghiệm',[
 ['Mở đầu','question','wide',4,'Giới thiệu nhu cầu'],['Chi tiết','benefit','detail',5,'Chỉ rõ đặc điểm sản phẩm'],['Dùng thử','trial','hands',6,'Minh họa thao tác'],['Nhận xét','proof','result',5,'Chỉ dùng nhận xét có căn cứ'],['Kết','close','cta',4,'Lời mời tìm hiểu']]),
 seed('show-product','Show sản phẩm · không lời',[
 ['Toàn cảnh','solution','wide',4,'Giới thiệu bố cục'],['Xoay','benefit','orbit',5,'Thấy hình dáng thật'],['Chi tiết','trial','detail',5,'Xem chất liệu và nhãn'],['Kết','close','cta',4,'Chừa chỗ cho thông tin sản phẩm']])];
 function validate(raw){
  if(raw?.kind==='script'){
   if(typeof raw.body!=='string'||!raw.body.trim()||raw.body.length>120000)throw Error('Dán kịch bản không trống, tối đa 120.000 ký tự.');
   const base=raw.beats?.length?validate({...raw,kind:'formula'}):{...raw,beats:[],scriptBody:undefined};
   return{...base,kind:'script',body:raw.body,name:String(raw.name||'Kịch bản mới').trim().slice(0,160),id:String(raw.id||crypto.randomUUID()),industry:String(raw.industry||'Chung'),metrics:metrics(raw.metrics),tips:String(raw.tips||'').slice(0,3000)};
  }
  if(!raw||!String(raw.name||'').trim()||!Array.isArray(raw.beats)||!raw.beats.length||raw.beats.length>60)throw Error('Công thức cần tên và từ 1 đến 60 nhịp.');
  let at=0;const beats=raw.beats.map(b=>{const start=Number(b.start),end=Number(b.end);if(!Number.isFinite(start)||!Number.isFinite(end)||Math.abs(start-at)>.02||end-start<.2||end>600)throw Error('Mốc giây phải liên tục từ 0; mỗi nhịp ≥ 0,2s và tổng ≤ 600s.');if(!Object.hasOwn(shots,b.type)||!Object.hasOwn(colors,b.role))throw Error('Chọn kiểu cảnh và loại nhịp hợp lệ.');at=end;return{name:String(b.name||labels[b.role]).slice(0,120),role:b.role,type:b.type,start,end,purpose:String(b.purpose||'').slice(0,1000),example:String(b.example||'').slice(0,1000),angle:String(b.angle||'').slice(0,300),movement:String(b.movement||'').slice(0,300),onScreen:String(b.onScreen||'').slice(0,500)};});
  if(raw.scriptBody!==undefined&&(!Array.isArray(raw.scriptBody)||raw.scriptBody.length!==beats.length||raw.scriptBody.some(b=>!b||typeof b.text!=='string'||b.text.length>5000)))throw Error('Bản lời kịch bản không hợp lệ.');
  return{...raw,id:String(raw.id||crypto.randomUUID()),name:String(raw.name).trim().slice(0,160),industry:String(raw.industry||'Chung').slice(0,80),videoType:String(raw.videoType||'Show sản phẩm').slice(0,80),tips:String(raw.tips||'').slice(0,3000),beats,hook:String(raw.hook||'').slice(0,160),metrics:metrics(raw.metrics)};
 }
 function metrics(raw={}){const out={};for(const k of ['likes','ctr']){const n=raw?.[k];if(n===undefined||n===null||n==='')continue;const v=Number(n);if(!Number.isFinite(v)||v<0||(k==='ctr'&&v>100)||(k==='likes'&&!Number.isSafeInteger(v)))throw Error('Chỉ số phải không âm; CTR từ 0–100%, lượt thích là số nguyên.');out[k]=v;}return out;}
 function rank(r){return (Number(r.up||0)-Number(r.down||0))*100+(Math.min(100,Number(r.metrics?.ctr||0))/10)+(Math.min(10,Math.log10(1+Number(r.metrics?.likes||0))));}
 function strip(r){return{kind:r.kind||'formula',body:r.body,scriptParts:r.scriptParts,sourceScriptId:r.sourceScriptId,sourceBody:r.sourceBody,id:r.id,name:r.name,industry:r.industry,videoType:r.videoType,source:r.source,sourceName:r.sourceName,scriptBody:r.scriptBody,hook:r.hook,beats:r.beats,tips:r.tips};}

 function bar(r){return '<div class="recipeBar" aria-label="Các nhịp theo thời lượng">'+r.beats.map(b=>'<i title="'+b.start+'–'+b.end+'s" style="flex:'+(b.end-b.start)+';background:'+colors[b.role]+'"></i>').join('')+'</div>';}
 return{colors,labels,shots,industries,starters,validate,strip,duration,bar,metrics,rank};
})();

/* Lossless source slices. Stage directions stay in body; only spoken text enters TTS. */
const SFScript=(()=>{
 function units(body){const out=[];let at=0;const re=/\r?\n\s*\r?\n|\r?\n(?=\s*\[(?:Cảnh|Scene)\b)|[.!?。！？]+[”"’')]*\s+/giu;for(const m of body.matchAll(re)){const end=m.index+m[0].length;if(end>at){out.push({start:at,end,text:body.slice(at,end)});at=end;}}if(at<body.length)out.push({start:at,end:body.length,text:body.slice(at)});return out;}
 function blocks(body){const out=[];let at=0;const re=/\r?\n\s*\r?\n|\r?\n(?=\s*\[(?:Cảnh|Scene)\b)/giu;for(const m of body.matchAll(re)){const end=m.index+m[0].length;if(body.slice(at,end).trim())out.push({start:at,end});else if(out.length)out.at(-1).end=end;at=end;}if(at<body.length&&body.slice(at).trim())out.push({start:at,end:body.length});else if(out.length)out.at(-1).end=body.length;if(out.length)out[0].start=0;return out;}
 function notePattern(){return /^[ \t]*\[[^\]\r\n]*\][ \t]*$|\[(?:Cảnh|Scene|Góc máy|Hình ảnh|Bối cảnh|Nhạc|SFX)\b[^\]\r\n]*\]/gimu;}
 function spoken(text){return text.replace(notePattern(),'').trim();}
 function direction(text){return [...text.matchAll(notePattern())].map(m=>m[0].trim().replace(/^\[|\]$/g,'')).join(' · ');}
 function count(text){return (spoken(text).match(/[\p{L}\p{N}]+(?:['’][\p{L}\p{N}]+)*/gu)||[]).length;}
 function seconds(text){return Math.max(3,Math.round(count(text)/3.2*10)/10);}
 function title(text){return text.split(/\r?\n/).map(s=>s.replace(/\[[^\]]*\]/g,'').trim()).find(Boolean)?.slice(0,80)||'Kịch bản mới';}
 function parts(body,ranges=blocks(body)){return ranges.map((r,i)=>({...r,name:r.name||'Đoạn '+(i+1),role:r.role||'neutral',type:r.type||'wide',seconds:seconds(body.slice(r.start,r.end))}));}
 function validParts(body,rows){if(!Array.isArray(rows)||!rows.length||rows.length>60)throw Error('Cần 1–60 nhịp; bản gốc vẫn giữ nguyên.');let at=0;for(const r of rows){if(!Number.isInteger(r.start)||!Number.isInteger(r.end)||r.start!==at||r.end<=r.start||r.end>body.length||!Object.hasOwn(SFRecipes.colors,r.role)||!Object.hasOwn(SFRecipes.shots,r.type))throw Error('Nhịp không phủ đúng bản gốc. Chưa áp dụng.');at=r.end;}if(at!==body.length)throw Error('Nhịp thiếu phần cuối bản gốc.');return rows;}
 function production(r){let rows;if(r.scriptParts?.length)rows=validParts(r.body,r.scriptParts);else if(r.beats?.length&&r.scriptBody?.length===r.beats.length&&r.scriptBody.map(b=>b.text).join('\n\n')===r.body){let cursor=0;rows=r.beats.map((b,i)=>{const start=cursor;cursor+=r.scriptBody[i].text.length+(i<r.beats.length-1?2:0);return{start,end:cursor,name:b.name,role:b.role,type:b.type,seconds:b.end-b.start,timingSource:'saved'};});}else rows=parts(r.body);if(!rows.length||rows.length>60)throw Error('Kịch bản có quá nhiều đoạn; gộp còn tối đa 60 đoạn trước khi dùng.');let at=0;const beats=rows.map((p,i)=>{const text=r.body.slice(p.start,p.end),start=at;at+=p.timingSource==='saved'&&Number.isFinite(p.seconds)&&p.seconds>=.2?p.seconds:seconds(text);return{name:p.name||'Đoạn '+(i+1),role:p.role||'neutral',type:p.type||'wide',start,end:Math.round(at*10)/10,purpose:direction(text),example:'',angle:'',movement:'',onScreen:''};});if(at>600)throw Error('Lời ước tính dài hơn 10 phút. Kịch bản vẫn lưu đầy đủ; rút ngắn hoặc tách bản để tạo video.');return{...r,beats,scriptBody:rows.map(p=>({text:spoken(r.body.slice(p.start,p.end))})),sourceBody:r.body};}
 const fold=s=>String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/g,'d').replace(/Đ/g,'D').toLowerCase().replace(/[^a-z0-9]+/g,' ').trim();
 function matches(text,word){const w=fold(word);return !!w&&(' '+fold(text)+' ').includes(' '+w+' ');}
 return{units,blocks,spoken,direction,count,seconds,title,parts,validParts,production,fold,matches};
})();

// Shared request identity, negative receipts and tolerant JSON. No dispatch here.
(function(){
function jobWireId(job){const id=job.id||job.request_id;return job.source==='gemini_chat'&&!id?.startsWith('gchat-')?'gchat-'+id:id;}
function jobPostFailure(job,error){const d=error.detail,id=jobWireId(job);job.error=error.message;job.updatedAt=Date.now();if(d?.submitted===false&&d.request_id===id&&typeof d.store_id==='string'){job.state='not_submitted';job.store_id=d.store_id;job.negativeReceipt=structuredClone(d);}else job.state=d?.code==='INVALID_JSON'?'invalid':'unknown';}
function jobReadRecord(job,record){if(job.store_id&&record.store_id&&job.store_id!==record.store_id){job.state='unknown';throw Error('Kho dữ liệu động cơ đã đổi; chưa thể đối soát lượt cũ.');}if(record.store_id)job.store_id=record.store_id;job.state=record.state;job.updatedAt=Date.now();if(record.state==='not_submitted'&&record.submitted===false)job.negativeReceipt=structuredClone(record);}
function jobReadError(job,error){job.error=error.message;job.updatedAt=Date.now();if(error.status===404){job.state='missing';job.error='Không tìm thấy ở động cơ hiện tại. Kiểm tra đúng thư mục dữ liệu/lịch sử dịch vụ trước khi bỏ lượt; chưa kết luận là chưa gửi.';}}
function workflowJsonObject(text){if(typeof text!=='string'||text.length>500000)throw Error('JSON quá lớn hoặc không hợp lệ.');try{const data=JSON.parse(text);if(data&&typeof data==='object'&&!Array.isArray(data))return data;}catch{}const found=[];let start=-1,depth=0,quoted=false,escape=false;for(let i=0;i<text.length;i++){const c=text[i];if(start<0){if(c==='{'){start=i;depth=1;quoted=false;escape=false;}continue;}if(quoted){if(escape)escape=false;else if(c==='\\')escape=true;else if(c==='"')quoted=false;}else if(c==='"')quoted=true;else if(c==='{')depth++;else if(c==='}'&&!--depth){try{const value=JSON.parse(text.slice(start,i+1));if(value&&typeof value==='object'&&!Array.isArray(value))found.push(value);}catch{}start=-1;if(found.length>1)throw Error('Có nhiều khối JSON; chọn/sửa rõ kết quả trước khi áp dụng.');}}if(found.length!==1||start>=0)throw Error('JSON thiếu hoặc chưa hoàn chỉnh. Có thể sửa JSON đã nhận, không tự gửi lại.');return found[0];}
const pendingStates=['prepared','preparing','submitted','queued','running','downloading','unknown','missing','invalid','done'];
async function persistIntent(job,save,store){
 if(job.state!=='prepared')throw Error('Chỉ ghi ý định trước khi gửi lượt mới.');
 try{await save();if(!store?.managed)return;
  for(let attempt=0;attempt<6;attempt++){
   if(!store.state.active)throw Error('Kho máy chưa sẵn sàng; chưa gửi AI.');
   try{await store.checkpoint();if(!store.state.active)throw Error('Kho máy chưa xác nhận lưu.');if(!store.state.dirty)return;}
   catch(error){if(!error.message.includes('Dữ liệu đang thay đổi')||attempt===5)throw error;}
   if(attempt<5)await new Promise(resolve=>setTimeout(resolve,80));
  }throw Error('Dữ liệu chưa ổn định để lưu ý định; chưa gửi AI.');
 }catch(error){job.state='not_submitted';job.error=error.message;try{await save();}catch{}throw error;}
}
function chooseMusic(state,rows,mode,selected,key){
 if(mode==='off')return null;
 let song;if(mode==='random'){
  song=state.musicChoice?rows.find(r=>r[key]===state.musicChoice):rows[Math.floor(Math.random()*rows.length)];
  if(state.musicChoice&&!song)throw Error('Bài nhạc đã chốt không còn tệp. Chọn lại chế độ nhạc hoặc chọn một bài khác.');
 }else song=rows.find(r=>r[key]===selected);
 if(!song)throw Error('Chọn bài nhạc còn tệp hoặc tắt nhạc.');
 if(mode==='random')state.musicChoice=song[key];return song;
}
window.SFProviderReceipts={jobWireId,jobPostFailure,jobReadRecord,jobReadError,workflowJsonObject,pendingStates,persistIntent,chooseMusic};
})();

// Pure shared planner: timeline targets are not provider billing durations.
(function(){
function partId(index){let value='';for(let n=index+1;n>0;n=Math.floor((n-1)/26))value=String.fromCharCode(97+(n-1)%26)+value;return value;}
function textTimeline(text,seconds){
 text=String(text||'');
 const graphemes=typeof Intl.Segmenter==='function'?[...new Intl.Segmenter(undefined,{granularity:'grapheme'}).segment(text)].map(s=>({text:s.segment,offset:s.index+s.segment.length})):(()=>{let at=0;return Array.from(text,c=>({text:c,offset:at+=c.length}));})();
 const wordEnds=new Set(typeof Intl.Segmenter==='function'?[...new Intl.Segmenter(undefined,{granularity:'word'}).segment(text)].filter(s=>s.isWordLike).map(s=>s.index+s.segment.length):[]);
 const total=graphemes.reduce((n,g)=>n+(/\s/u.test(g.text)?0:1),0);let weight=0;
 const breaks=[{offset:0,at:0,kind:'sentence'}],ends=[];
 for(let i=0;i<graphemes.length;i++){
  const g=graphemes[i],next=graphemes[i+1]?.text||'';if(!/\s/u.test(g.text))weight++;
  const sentence=/[.!?。！？\n]/u.test(g.text)&&!/[.!?。！？\n]/u.test(next);
  const kind=sentence?'sentence':/[,;:，、；：]/u.test(g.text)?'clause':wordEnds.has(g.offset)||/\s/u.test(g.text)||/[\p{Script=Han}\p{Script=Hiragana}\p{Script=Katakana}\p{Script=Hangul}]/u.test(g.text)?'word':null;
  if(kind){const point={offset:g.offset,at:total?seconds*weight/total:0,kind};breaks.push(point);if(sentence)ends.push(point);}
 }
 if(breaks.at(-1).offset!==text.length)breaks.push({offset:text.length,at:seconds,kind:'sentence'});
 else breaks.at(-1).at=seconds;
 if(ends.at(-1)?.offset!==text.length)ends.push({offset:text.length,at:seconds,kind:'sentence'});
 let from=0,start=0;const lines=ends.map(end=>{const row={start,end:end.at,text:text.slice(from,end.offset),from,to:end.offset};from=end.offset;start=end.at;return row;}).filter(l=>l.text.trim());
 return {text,breaks,lines};
}
function assignText(text,seconds,parts){
 const timeline=textTimeline(text,seconds);let from=0;

 if(draft.beats.some(b=>b.text.trim())&&!confirm('Đổi công thức sẽ thay các nhịp và lời hiện tại. Tiếp tục?'))return;

// Photo production uses the same bounded duration planner and durable provider/storage APIs.
// A storyboard remains ONE planning image. Per-scene generated frames are optional.
const photoPendingStates=new Set(['prepared','preparing','submitted','running','queued','unknown','done']);
let photoApprovalBusy=false;
function photoLatest(b,part='a'){const p=photoParts(b).find(p=>p.id===part);return p?(b.clips||[]).filter(c=>(c.part||'a')===part&&photoContentMatches(b,p,c)).sort((a,b)=>photoOrder(a)-photoOrder(b)).at(-1)||null:null;}
function photoLatestFrame(b){return(b.frames||[]).at(-1)||null;}
function photoBeatLocked(b){return !!(b.clips?.length||draft.flowJobs?.some(j=>j.beatId===b.id)||b.partText&&Object.keys(b.partText).length);}
function photoTextTimeline(b){return SFClipPlanning.textTimeline(b.text,b.seconds);}
function photoSentenceCues(b){return photoTextTimeline(b).lines;}
function photoPlanParts(b,options=b.clipPlanning||{}){const timeline=photoTextTimeline(b);return SFClipPlanning.plan({start:0,end:b.seconds},{...options,textBreaks:timeline.breaks},timeline.lines);}

function photoParts(b){
 if(b.clipPlan?.seconds===b.seconds)return b.clipPlan.parts;
 // Keep the old one-prompt layout of existing projects. Do not remap their files.
 if(photoBeatLocked(b)&&!b.clipPlan)return[{id:'a',start:0,end:b.seconds,duration:b.seconds,generationDuration:b.seconds,legacy:true}];
 return photoPlanParts(b);
}
function photoFreezeParts(b){b.clipPlan??={seconds:b.seconds,parts:structuredClone(photoParts(b))};}
function photoLegacyText(b,p){
 // Preserve the actual wording of pre-update generations; never reinterpret their speech.
 for(const item of [...(b.clips||[]),...(draft.flowJobs||[]).filter(j=>j.beatId===b.id)].reverse()){
  if((item.part||'a')!==p.id||!item.signature)continue;
  try{const old=JSON.parse(item.signature);if(Array.isArray(old)&&old.length===7&&old[0]===photoSignatureBeforeFlow(b)&&old[6]?.id===p.id&&typeof old[6].text==='string')return old[6].text;}catch{}
 }
 return null;
}
function photoPartText(b,p){
 if(Object.hasOwn(b.partText||{},p.id))return b.partText[p.id];
 const legacy=photoLegacyText(b,p);if(legacy!==null)return legacy;
 return SFClipPlanning.assignText(b.text,b.seconds,photoParts(b)).find(row=>row.id===p.id)?.text||'';
}
const photoSignatureBeforeFlow=photoSceneSignature;
photoSceneSignature=function(b,p=null){
 if(!p)return JSON.stringify(photoParts(b).map(part=>photoSceneSignature(b,part)));
 // Fingerprint only inputs used to generate this clip. Storyboard is a writing input.
 return JSON.stringify({version:2,room:room.id,beat:b.id,part:p.id,start:p.start,end:p.end,generationDuration:p.generationDuration||p.duration,prompt:photoPartPrompt(b,p),frameId:b.approvedFrame||null,refs:photoRefsFor(b).map(r=>({role:r.role,images:r.images.map(i=>i.key||i.image)}))});
};
function photoContentMatches(b,p,item){
 if(item.stale)return false;
 if(!item.signature||item.signature===photoSceneSignature(b,p))return true;
 try{const old=JSON.parse(item.signature);return Array.isArray(old)&&old.length===7&&old[0]===photoSignatureBeforeFlow(b)&&old[3]===(b.approvedFrame||null)&&JSON.stringify(old[4])===JSON.stringify(b.clipPlan||null)&&JSON.stringify(old[5])===JSON.stringify(b.clipPlanning||null)&&JSON.stringify(old[6])===JSON.stringify({id:p.id,text:photoPartText(b,p),prompt:b.partPrompts?.[p.id]||null})&&(!item.prompt||item.prompt===photoPartPrompt(b,p));}catch{return false;}
}
function photoOrder(item){return item.generationOrder||item.version||0;}
function photoNextOrder(b,part){return 1+Math.max(0,...[...(b.clips||[]),...(b.staleClips||[]),...(draft.flowJobs||[]).filter(j=>j.beatId===b.id)].filter(c=>(c.part||'a')===part).map(photoOrder));}

function photoSlotJob(b,p){return draft.flowJobs?.filter(j=>j.beatId===b.id&&(j.part||'a')===p.id&&photoPendingStates.has(j.state)).at(-1);}
function photoClipValid(b,p,c=photoLatest(b,p.id),chain=true){
 if(!c||!Number.isFinite(c.duration)||c.reviewDecision?.status!=='accepted'||c.duration+.025<(p.generationDuration||p.duration))return false;
 if(!photoContentMatches(b,p,c)||c.frameId&&c.frameId!==b.approvedFrame)return false;
 if(c.slotStart!=null&&(Math.abs(c.slotStart-p.start)>.002||Math.abs(c.slotEnd-p.end)>.002))return false;
 if(b.clipPlan&&b.clipPlan.seconds!==b.seconds)return false;
 if(photoSlotJob(b,p))return false;

}
function photoChainReady(b,p,current=null){

 const parts=photoParts(b),idx=parts.findIndex(x=>x.id===p.id);let prev=null;
 for(let i=0;i<idx;i++){
  const c=photoLatest(b,parts[i].id);
  if(!photoClipValid(b,parts[i],c,false)||!c.tail||prev&&c.continuityFrom!==prev.id)return false;
  prev=c;
 }
