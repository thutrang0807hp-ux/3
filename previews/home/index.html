function overviewHTML(list){const attention=list.filter(p=>p.status==='attention'),running=list.filter(p=>p.status==='running'),drafts=list.filter(p=>p.status==='preparing'),done=list.filter(p=>p.status==='exported');return '<div class="overviewIntro"><div><h2>Hôm nay cần làm gì?</h2><p>Việc cần bạn ở một chỗ. Mở từng video để tiếp tục đúng quy trình.</p></div><div class="overviewSummary"><span><b>'+list.length+'</b> video</span><span>'+dot('attention')+'<b>'+attention.length+'</b> cần bạn</span><span>'+dot('running')+'<b>'+running.length+'</b> đang chạy</span><span>'+dot('exported')+'<b>'+done.length+'</b> đã xuất</span></div></div><div class="overviewGrid"><section class="panel"><header class="panelHeading"><div><h3>'+dot('attention')+'Cần bạn <span class="count">'+attention.length+'</span></h3><p>Hiện đúng việc tiếp theo của từng video.</p></div><span class="quiet">Hai cách làm</span></header><div class="taskList">'+(attention.length?attention.map(attentionRow).join(''):'<p class="footnote" style="padding:0 10px 16px">Không có việc đang chờ bạn.</p>')+'</div></section><div class="overviewAside"><section class="panel"><header class="panelHeading"><div><h3>'+dot('running')+'Đang xử lý <span style="font-size:10px;color:#7c8fa0">'+running.length+'</span></h3><p>Tiến độ từ tác vụ đang chạy.</p></div></header><div class="runningList">'+running.map(p=>'<article class="runningItem"><div class="runningTop"><b>'+esc(p.name)+'</b>'+badge(p)+'</div><p>'+dot('running')+esc(p.task)+'</p><div class="progressTrack"><i style="--progress:'+p.progress+'%"></i></div><footer><span>'+esc(p.reason)+'</span><button class="textAction" data-open="'+p.id+'">Chi tiết ↗</button></footer></article>').join('')+(!running.length?'<p class="footnote" style="padding-bottom:15px">Chưa có tác vụ đang chạy.</p>':'')+'</div></section>'+(drafts.length?'<section class="draftStrip"><h3>'+dot('preparing')+'Đang chuẩn bị <small>'+drafts.length+'</small></h3>'+drafts.map(p=>'<div class="prepItem"><div><b>'+esc(p.name)+'</b>'+dot('preparing')+' Bản nháp · chưa chạy AI</div><button class="textAction" data-open="'+p.id+'">Tiếp tục ↗</button></div>').join('')+'</section>':'')+'<div class="commonStrip">'+icon('editor')+'<div><b>Hai cách làm, chung bước Dựng & xuất</b>Video mẫu giữ nhịp nguồn. Từ ảnh bắt đầu bằng ý tưởng. Mỗi video có bản dựng riêng.</div></div></div></div><section class="recentSection"><header class="sectionHeading"><h3>Quay lại gần đây</h3><span>Giữ đúng nơi bạn đang làm</span></header><div class="recentGrid">'+[...list.filter(p=>p.status==='exported'),...list.filter(p=>p.status!=='exported')].slice(0,3).map(p=>'<button class="recentCard" data-open="'+p.id+'">'+thumb(p)+'<div>'+badge(p)+'<b>'+esc(p.name)+'</b><small>'+esc(p.task)+' · '+esc(p.updated)+'</small></div></button>').join('')+'</div></section><p class="footnote">Bộ ảnh và Bộ cảnh thuộc sản phẩm; khi dùng trong dự án, nội dung được chọn riêng cho video đó.</p>';}
function routeHTML(list){const route=routes[view],all=list.filter(p=>p.mode===view),rows=all.filter(p=>stageFilter===null||p.step===stageFilter);return '<div class="routeIntro"><div><h2>'+route.title+'</h2><p>'+route.description+'</p></div><span>'+icon('check')+'Quy trình riêng · dự án riêng</span></div><nav class="pipeline" aria-label="Các bước của '+route.title+'">'+route.steps.map((s,i)=>'<button class="stage '+(stageFilter===i?'active':'')+'" data-stage="'+i+'" aria-pressed="'+(stageFilter===i)+'"><div class="stageTop"><span class="stageIndex">0'+(i+1)+'</span><b class="stageCount">'+all.filter(p=>p.step===i).length+'</b></div><span class="stageLabel">'+s+'</span></button>').join('')+'</nav><div class="routeListHeader"><h3>'+(stageFilter===null?'Tất cả video của hướng này':route.steps[stageFilter])+'<small>'+rows.length+' video</small></h3>'+(stageFilter!==null?'<button id="clearStage">Xem tất cả bước</button>':'<span style="font-size:10px;color:#62758b">Bấm một bước để lọc</span>')+'</div>'+(rows.length?'<div class="routeList">'+rows.map(p=>'<article class="routeRow" data-project="'+p.id+'"><div class="routeIdentity">'+thumb(p)+'<div><b>'+esc(p.name)+'</b><small>'+esc(products.find(x=>x.id===p.product)?.name||'')+' · '+(p.mode==='reference'?'Video tham khảo riêng':'Ảnh & kịch bản riêng')+'</small></div></div><div class="routeStatus">'+dot(p.status)+esc(p.task)+'<small>Bước '+(p.step+1)+'/'+route.steps.length+' · '+route.steps[p.step]+'</small></div><span class="routeUpdated">'+esc(p.updated)+'</span><button class="routeAction '+(p.error?'error':p.status==='attention'?'amber':'')+'" data-open="'+p.id+'">'+esc(p.action)+'</button></article>').join('')+'</div>':'<div class="empty"><h2>Chưa có video ở bước này</h2><p>Các dự án còn lại vẫn nằm trong quy trình này.</p><button id="clearStage">Xem tất cả bước</button></div>')+'<div class="routeNote">'+icon(view==='reference'?'audio':'spark')+'<div>'+route.note+'</div></div>';}
function render(){const area=$('#contentArea'),top=area.scrollTop;renderSidebar();const selected=products.find(p=>p.id===product),name=selected?.name||'Tất cả sản phẩm';$('#productTitle').textContent=name;$('#projectSearch').placeholder='Tìm trong '+(selected?.name||'các sản phẩm')+'…';$('#referenceCount').textContent=scoped().filter(p=>p.mode==='reference').length;$('#photosCount').textContent=scoped().filter(p=>p.mode==='photos').length;$$('[data-view]').forEach(b=>{b.classList.toggle('active',b.dataset.view===view);if(b.dataset.view===view)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')});const list=filtered().filter(p=>view==='overview'||p.mode===view);$('#viewContent').innerHTML=(query?'<p class="queryResult">'+list.length+' kết quả trong sản phẩm đang xem</p>':'')+(!list.length?empty(query?'Không tìm thấy video':view==='overview'?'Chưa có video trong sản phẩm này':view==='reference'?'Chưa có video từ video mẫu':'Chưa có video từ ảnh & ý tưởng',query?'Thử tên khác hoặc xóa nội dung tìm kiếm.':'Tạo từ video mẫu hoặc bắt đầu bằng ảnh và ý tưởng của bạn.'):view==='overview'?overviewHTML(list):routeHTML(list));area.scrollTop=top;}
function switchView(next){scrollPositions.set(product+':'+view,$('#contentArea').scrollTop);view=next;stageFilter=null;render();$('#contentArea').scrollTop=scrollPositions.get(product+':'+view)||0;history.replaceState(null,'','#'+view)}
$('#productList').onclick=e=>{const b=e.target.closest('[data-product]');if(!b)return;product=b.dataset.product;query='';$('#projectSearch').value='';stageFilter=null;view='overview';render();$('#contentArea').scrollTop=0};
$$('[data-view]').forEach(b=>b.onclick=()=>switchView(b.dataset.view));$('#homeLink').onclick=e=>{e.preventDefault();switchView('overview')};$('#projectSearch').oninput=e=>{query=e.target.value;render()};
function openProject(id){const p=projects.find(p=>p.id===id);if(!p)return;const route=routes[p.mode];let special='';if(p.id==='r1')special='<div class="sceneChips"><span>Cảnh 1 · đã duyệt</span><span class="waiting">Cảnh 2 · chờ duyệt</span><span class="waiting">Cảnh 3 · chờ duyệt</span></div>';if(p.step===route.steps.indexOf('Dựng')||p.status==='exported')special='<div class="miniTimeline"><span>Cảnh 1</span><span>Cảnh 2</span><span>Cảnh 3</span></div><p>Ghép clip, chỉnh âm thanh, phụ đề và xuất MP4 trong trình Dựng dùng chung.</p>';const advance=p.id==='r1'&&p.status==='attention'||p.id==='p1'&&p.status==='attention';dialog(p.task,'<div class="detailHero">'+thumb(p)+'<div>'+badge(p)+'<h3>'+esc(p.name)+'</h3><small>'+esc(products.find(x=>x.id===p.product)?.name||'')+' · '+route.steps[p.step]+' · bước '+(p.step+1)+'/'+route.steps.length+'</small></div></div><div class="detailTask '+(p.error?'error':'')+'"><h4>'+esc(p.task)+'</h4><p>'+esc(p.detail)+'</p></div>'+special+'<p>'+route.note+'</p><p class="dialogNote">Đây là minh họa màn quản lý. Tiến độ và nội dung đều là dữ liệu mẫu; không kết nối AI hoặc tạo clip thật.</p>','<button data-dialog-close>Đóng</button>'+(advance?'<button class="primary" id="advanceSample">'+(p.id==='r1'?'Duyệt khung · mô phỏng':'Duyệt kịch bản · mô phỏng')+'</button>':''));if(advance)$('#advanceSample').onclick=()=>{p.step++;p.status='preparing';p.task=p.mode==='reference'?'Chờ tạo clip':'Chuẩn bị cảnh';p.action='Tiếp tục';p.reason='Đã duyệt · chưa gửi yêu cầu tạo.';p.detail='Bước trước đã được duyệt trong mô phỏng. Dự án đang chờ bước tiếp theo; chưa gửi yêu cầu AI.';p.updated='Vừa cập nhật';$('#detailDialog').close();render();notify('Đã chuyển đúng bước trong quy trình '+(p.mode==='reference'?'video mẫu':'từ ảnh')+' · mô phỏng.')}}
$('#viewContent').onclick=e=>{const open=e.target.closest('[data-open]'),stage=e.target.closest('[data-stage]');if(open)return openProject(open.dataset.open);if(stage){stageFilter=stageFilter===+stage.dataset.stage?null:+stage.dataset.stage;render()}if(e.target.closest('#clearStage')){stageFilter=null;render()}if(e.target.closest('#emptyCreate'))newVideo()};
function newVideo(){dialog('Bạn muốn bắt đầu từ đâu?','<div class="choiceGrid"><button class="workflowChoice" data-new-mode="reference">'+icon('reference')+'<b>Từ video mẫu</b><small>Phân tích video tham khảo, thay nội dung và duyệt khung từng cảnh.</small></button><button class="workflowChoice" data-new-mode="photos">'+icon('photos')+'<b>Từ ảnh & ý tưởng</b><small>Chọn ảnh, duyệt kịch bản rồi chuẩn bị hoặc tạo cảnh cho video.</small></button></div><p class="dialogNote">Cả hai đều nằm trong sản phẩm '+esc(products.find(p=>p.id===product)?.name||'bạn chọn')+'. Mỗi dự án theo một quy trình riêng.</p>');$$('[data-new-mode]').forEach(b=>b.onclick=()=>createDraft(b.dataset.newMode))}
function createDraft(mode){const target=products.find(p=>p.id===product)||products[0];dialog(mode==='reference'?'Video mới từ video mẫu':'Video mới từ ảnh & ý tưởng','<span class="modeBadge '+mode+'">'+icon(mode)+modeLabel(mode)+'</span><p>Sản phẩm: <b>'+esc(target.name)+'</b>. Bản nháp sẽ nằm trong đúng mục '+(mode==='reference'?'Từ video mẫu':'Từ ảnh & ý tưởng')+'.</p><label class="projectField">Tên video<input id="draftName" maxlength="100" placeholder="Đặt tên để dễ tìm lại…" value="'+esc(target.name+(mode==='reference'?' · video mẫu mới':' · ý tưởng mới'))+'"></label><p class="dialogNote">Chỉ tạo thẻ nháp để xem cách quản lý; chưa tải tư liệu hoặc gửi yêu cầu AI.</p>','<button id="backToChoice">Quay lại</button><button class="primary" id="createDraft">Tạo bản nháp</button>');$('#backToChoice').onclick=newVideo;$('#createDraft').onclick=()=>{const name=$('#draftName').value.trim();if(!name){$('#draftName').focus();return}projects.unshift({id:'draft-'+Date.now(),name,product:target.id,mode,step:0,status:'preparing',task:mode==='reference'?'Chờ thêm video mẫu':'Thêm ảnh & ý tưởng',reason:'Bản nháp · chưa chạy AI.',action:mode==='reference'?'Thêm video mẫu':'Thêm ý tưởng',updated:'Vừa tạo',tone:target.tone,lip:'#a54865',detail:mode==='reference'?'Bắt đầu bằng việc tải video nguồn. Sau đó mới phân tích, duyệt khung và tạo clip.':'Bắt đầu bằng ảnh sản phẩm và ý tưởng. Sau đó chuẩn bị kịch bản và cảnh.'});product=target.id;query='';$('#projectSearch').value='';$('#detailDialog').close();switchView(mode);notify('Đã tạo bản nháp mẫu trong '+modeLabel(mode)+'.')};$('#draftName').focus();$('#draftName').select()}
$('#newVideo').onclick=newVideo;$('#railCreate').onclick=e=>{e.preventDefault();newVideo()};
function showAssets(kind){const name=products.find(p=>p.id===product)?.name||'sản phẩm';if(kind==='costs'){dialog('Chi phí · '+name,'<div class="costEmpty"><b>Chưa có chi phí thật</b><span>Không dùng số dư hoặc giá giả trong mô phỏng.</span></div><p>Khi có nhật ký thật, chi phí được gom theo sản phẩm và có thể xem riêng Video mẫu / Từ ảnh & ý tưởng.</p>');return}const bank=kind==='bank',cards=bank?[['Cận cảnh xoay','reference'],['Chi tiết','product'],['Trong bối cảnh dùng','photos'],['Tay thao tác','person'],['Vấn đề','photos'],['Kết quả','spark'],['Toàn cảnh','photos'],['Kêu gọi mua','product']]:[['Người','person'],['Trang phục','shirt'],['Sản phẩm','product'],['Bối cảnh','photos']];dialog((bank?'Bộ cảnh chung':'Bộ ảnh chung')+' · '+name,'<div class="assetGrid">'+cards.map(([label,k],i)=>'<article class="assetCard"><div class="assetVisual" style="--color:'+['#78616d','#596e77','#8a7866','#52746d'][i%4]+'">'+icon(k)+'</div><b>'+label+'</b><small>'+(bank?'1 clip mẫu':'Ảnh minh họa')+'</small></article>').join('')+'</div><p>'+(bank?'Bộ cảnh thuộc sản phẩm và có thể dùng lại cho nhiều video từ ảnh. Mỗi dự án chọn clip riêng; không bắt hướng video mẫu phải đi qua Bộ cảnh.':'Ảnh gốc được quản lý theo sản phẩm. Khi đưa vào dự án, dùng một bản sao riêng để chỉnh mà không làm thay đổi các video đang làm.')+'</p><p class="dialogNote">Kho minh họa cho sản phẩm; chưa tải hoặc tạo tư liệu thật.</p>')}
$('#openReferences').onclick=()=>showAssets('refs');$('#openBank').onclick=()=>showAssets('bank');$('#openCosts').onclick=()=>showAssets('costs');
$('#newProduct').onclick=()=>dialog('Thêm sản phẩm','<p>Trong ứng dụng, mỗi sản phẩm là một ngăn chung cho video mẫu, video từ ảnh, Bộ ảnh và Bộ cảnh. Bản mô phỏng này dùng năm sản phẩm có sẵn; bạn có thể bấm sản phẩm khác để xem trạng thái trống.</p>');
$('#resetDemo').onclick=()=>{projects=fixtures();product='son';query='';view='overview';stageFilter=null;scrollPositions.clear();$('#projectSearch').value='';$('#detailDialog').close();render();$('#contentArea').scrollTop=0;notify('Đã đặt lại dữ liệu mẫu.')};
const initial=location.hash.slice(1);if(['overview','reference','photos'].includes(initial))view=initial;render();
</script></body></html>
