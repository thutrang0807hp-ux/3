// One library across products, stored independently of room cleanup/deletion.
let recipeCache=null,recipeLoading=null;
async function recipeLibrary(){
 if(recipeCache)return recipeCache;
 if(!recipeLoading)recipeLoading=(async()=>{const saved=await io('prefs','readonly','recipe-library');recipeCache=saved||{version:1,items:structuredClone(SFRecipes.starters),deleted:[],sources:{}};return recipeCache;})();
 return recipeLoading;
}
async function saveRecipeLibrary(){await io('prefs','readwrite','recipe-library',recipeCache);}
async function listRecipes(){const lib=await recipeLibrary();return lib.items.map(r=>{
 const usedRooms=rooms.filter(v=>v.photoDraft?.formula===r.id),uses=new Set([...usedRooms.map(v=>v.id),...Object.values(lib.usage||{}).filter(v=>v.formula===r.id).map(v=>v.roomId)]),feedback=Object.values(lib.feedback||{}).filter(v=>v.formula===r.id);for(const v of usedRooms.filter(v=>v.stage==='exported'&&v.recipeVote&&!lib.feedback?.[v.id]))feedback.push({vote:v.recipeVote});
 return{...clone(r),uses:uses.size,up:feedback.filter(v=>v.vote===1).length,down:feedback.filter(v=>v.vote===-1).length};
}).sort((a,b)=>b.up-a.up||a.down-b.down||a.name.localeCompare(b.name,'vi'));}
async function putRecipe(raw){const r=SFRecipes.validate(raw),lib=await recipeLibrary(),old=lib.items.find(x=>x.id===r.id);if(old)lib.items[lib.items.indexOf(old)]=r;else lib.items.push(r);await saveRecipeLibrary();return clone(r);}
async function removeRecipe(id){const lib=await recipeLibrary();lib.items=lib.items.filter(r=>r.id!==id);if(!lib.deleted.includes(id))lib.deleted.push(id);await saveRecipeLibrary();}

// A terminal/unknown extraction is never submitted again automatically.
const recipeWork=new Set();
async function extractReferenceRecipe(roomId){
 if(recipeWork.has(roomId))return;recipeWork.add(roomId);
 try{
  const r=roomFor(roomId);if(!r||r.mode==='photos')return;
  const lib=await recipeLibrary();if(lib.sources[roomId]?.state&&['done','unknown','failed'].includes(lib.sources[roomId].state))return;
  const w=await workflowRecord(roomId);if(!w?.scenes?.length||w.analysis?.status!=='done')return;
  if(['submitted','unknown'].includes(w.analysis.aiRequest?.state))return;
  // A live analysis may include a reusable recipe in the same response. Never
  // silently issue a second provider request just because the new transcript arrived.
  if(w.analysis.semantic?.provider==='Gemini'){
   const raw=w.analysis.semantic.recipe,id='source:'+roomId;
   if(raw){if(!lib.deleted.includes(id))await putRecipe({...raw,id,source:'reference',sourceRoomId:roomId,sourceName:r.name,sourcePoster:r.poster,createdAt:Date.now()});lib.sources[roomId]={state:'done',note:'Dùng công thức trong cùng lượt phân tích; không gọi thêm AI.'};}
   else lib.sources[roomId]={state:'needs-recipe',note:'Phân tích chưa có công thức hợp lệ. Không tự gửi thêm lượt AI.'};
   await saveRecipeLibrary();return;
  }
  const lines=(w.script||[]).map(b=>({start:b.start,end:b.end,text:b.original||b.newText||''})).filter(b=>b.text.trim());
  if(!lines.length){lib.sources[roomId]={state:'needs-text',note:'Đã dò hình; chưa có phân tích nội dung / lời thoại để rút công thức.'};await saveRecipeLibrary();return;}
  let info;try{info=await engineRequest('status');}catch{return;}
  if(!info.gemini_configured)return;
  lib.sources[roomId]={state:'unknown',note:'Đã gửi rút công thức; không tự gửi lại khi mất kết nối.'};await saveRecipeLibrary();
  const raw=await engineRequest('ai/recipe',{room_id:roomId,product_id:r.productId,source_name:r.name,lines});
  const id='source:'+roomId;
  if(!lib.deleted.includes(id))await putRecipe({...raw,id,source:'reference',sourceRoomId:roomId,sourceName:r.name,sourcePoster:r.poster,createdAt:Date.now()});
  lib.sources[roomId]={state:'done'};await saveRecipeLibrary();
 }catch(e){const lib=await recipeLibrary();lib.sources[roomId]={state:'failed',note:e.message};await saveRecipeLibrary();}
 finally{recipeWork.delete(roomId);}
}

 if(!['reference','photos'].includes(mode)||changingWorkflow)return;
 if(currentRoom?.mode===mode&&currentView==='analysis')return;
 changingWorkflow=true;renderWorkflowModes();
 try{
  await flushFrames();const product=productFor(currentRoom?.productId)||productFor(prefs.product)||products[0];
  if(!product)throw Error('Tạo sản phẩm trước khi mở không gian.');
  const remembered=roomFor(prefs.modeRooms?.[product.id]?.[mode]);
  let target=remembered&&remembered.productId===product.id&&remembered.mode===mode&&!archivedRoom(remembered)?remembered:rooms.filter(r=>r.productId===product.id&&(r.mode||'reference')===mode&&!archivedRoom(r)).sort((a,b)=>(b.updatedAt||b.createdAt)-(a.updatedAt||a.createdAt))[0];
  if(!target)target=await createWorkflowRoom(mode,product);
  await openRoom(target.id,'analysis');
 }catch(e){fail(e);}finally{changingWorkflow=false;renderWorkflowModes();}
}

async function g5ScanStorage(){const el=$('#g5StorageResult'),button=$('#g5ScanRoot');button.disabled=true;el.textContent='Đang quét thư mục…';try{await ensureRootPermission();async function scan(handle){let bytes=0,count=0;for await(const h of handle.values()){if(h.kind==='directory'){const r=await scan(h);bytes+=r.bytes;count+=r.count;}else{bytes+=(await h.getFile()).size;count++;}}return{bytes,count};}let total=0,count=0,rows=[];for await(const h of prefs.root.values()){const r=h.kind==='directory'?await scan(h):{bytes:(await h.getFile()).size,count:1};total+=r.bytes;count+=r.count;rows.push('<li>'+esc(h.name)+' · '+(r.bytes/1024**2).toFixed(2)+' MB · '+r.count+' tệp</li>');}el.innerHTML='<h4>'+(total/1024**2).toFixed(2)+' MB · '+count+' tệp thực tế</h4><ul>'+rows.join('')+'</ul>';}catch(e){el.textContent=e.message;}finally{button.disabled=false;}}
function g5PlayTone(){try{const AC=window.AudioContext||window.webkitAudioContext,c=new AC();c.resume();const o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);const tone=g5Config().tone;o.frequency.setValueAtTime(tone==='bell'?880:660,c.currentTime);o.frequency.exponentialRampToValueAtTime(440,c.currentTime+.18);g.gain.setValueAtTime(.09,c.currentTime);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.3);o.start();o.stop(c.currentTime+.32);o.onended=()=>c.close();}catch{}}
function g5Level(text){return /lỗi|thiếu|chờ.*duyệt|cần.*duyệt|hết.*(credit|lượt)|xác minh|ghép xong/i.test(text)?'attention':/đã xuất|xuất xong|phân tích xong|bộ cảnh.*xong/i.test(text)?'done':'info';}
function g5NotificationType(text){return /đã xuất|xuất xong/i.test(text)?'export':/lỗi/i.test(text)?'error':/khung|duyệt/i.test(text)?'frames':/phân tích/i.test(text)?'analysis':/ghép xong/i.test(text)?'assembly':'message';}
const g5NotifyBefore=notify;
notify=async function(text,roomId=null,options={}){const level=options.level||g5Level(text),kind=options.kind||g5NotificationType(text),now=Date.now();if(!g5Config()[level])return;let n=notifications.find(n=>n.kind===kind&&n.level===level&&!n.read&&now-n.at<180000&&kind!=='message');if(n){n.count=(n.count||1)+1;n.text=text;n.roomIds=[...new Set([...(n.roomIds||[n.roomId]),roomId].filter(Boolean))];n.roomId=roomId;n.at=now;}else{n={id:uid(),text,roomId,roomIds:roomId?[roomId]:[],at:now,read:false,level,kind,count:1};notifications.unshift(n);}await io('notifications','readwrite',n.id,n);await g5Prune();renderNotifications();if(level==='attention'&&g5Config().sound)g5PlayTone();if(level==='done')toast(text+(kind==='export'?' · Khi đăng TikTok nhớ tick “Nội dung do AI tạo”.':''));if(g5Config().desktop&&(level==='attention'||kind==='export')&&window.Notification?.permission==='granted'){try{const desktop=new Notification('SceneForge',{body:text,tag:n.id});desktop.onclick=()=>{window.focus();if(roomId)openRoom(roomId,kind==='export'?'editor':'analysis').catch(fail);desktop.close();};}catch{}}};
async function g5Prune(){const stale=notifications.filter(n=>n.at<Date.now()-30*86400000);notifications=notifications.filter(n=>!stale.includes(n));await Promise.all(stale.map(n=>io('notifications','readwrite',n.id)));}
renderNotifications=function(){const count=notifications.filter(n=>!n.read&&(n.level||g5Level(n.text))==='attention'&&n.at>=Date.now()-30*86400000).length;$('#notificationCount').textContent=count;$('#notificationCount').hidden=!count;};
function g5Bell(){modal('Thông báo','<div class="g5Bell"><div class="g5BellFilters">'+[['all','Tất cả'],['attention','Cần bạn'],['done','Xong việc']].map(([k,v])=>'<button data-g5-filter="'+k+'" class="'+(g5BellFilter===k?'active':'')+'">'+v+'</button>').join('')+'</div><div class="g5NoticeList">'+(notifications.filter(n=>n.at>=Date.now()-30*86400000&&(g5BellFilter==='all'||(n.level||g5Level(n.text))===g5BellFilter)).map(n=>'<article class="g5Notice '+(n.level||g5Level(n.text))+' '+(!n.read?'unread':'')+'"><i></i><div><b>'+esc(n.text)+'</b><small>'+age(n.at)+(n.count>1?' · '+n.count+' thông báo gộp ở '+(n.roomIds?.length||1)+' video':'')+'</small>'+(n.kind==='export'?'<small>Khi đăng TikTok nhớ tick “Nội dung do AI tạo”.</small>':'')+((n.roomIds||[n.roomId]).filter(id=>roomFor(id)).map(id=>'<button data-g5-notice="'+n.id+'" data-room="'+id+'">'+esc(roomFor(id).name)+' →</button>').join(''))+'<button data-g5-read="'+n.id+'">'+(n.read?'Đã xem':'Đánh dấu đã xem')+'</button></div></article>').join('')||'<p class="g5Muted">Chưa có thông báo trong nhóm này.</p>')+'</div></div>','<button id="g5ReadAll">Đánh dấu đã xem hết</button>');$('#shellDialog').classList.add('g5BellDialog');$$('[data-g5-filter]').forEach(b=>b.onclick=()=>{g5BellFilter=b.dataset.g5Filter;g5Bell();});const mark=async id=>{const n=notifications.find(n=>n.id===id);if(n){n.read=true;await io('notifications','readwrite',n.id,n);}renderNotifications();};$$('[data-g5-read]').forEach(b=>b.onclick=async()=>{await mark(b.dataset.g5Read);g5Bell();});$$('[data-g5-notice]').forEach(b=>b.onclick=async()=>{const n=notifications.find(n=>n.id===b.dataset.g5Notice);await mark(n.id);$('#shellDialog').close();openRoom(b.dataset.room,n.kind==='export'?'editor':'analysis').catch(fail);});$('#g5ReadAll').onclick=async()=>{for(const n of notifications)await mark(n.id);g5Bell();};}

async function runCheckFont(){const button=$('#runFontCheck');button.disabled=true;try{const response=await fetch('./fonts/SceneForgeSans.ttf');if(!response.ok)throw Error('Chưa tải được font nhúng.');const bytes=await response.arrayBuffer(),hash=[...new Uint8Array(await crypto.subtle.digest('SHA-256',bytes))].map(b=>b.toString(16).padStart(2,'0')).join('');if(hash!==checkFont.sha256)throw Error('Font không khớp bản được kiểm tra dấu tiếng Việt.');const face=await new FontFace('SceneForgeCheckFont',bytes).load();document.fonts.add(face);await document.fonts.load('32px SceneForgeCheckFont',checkFont.sample);if(!checkFont.coverage||!document.fonts.check('32px SceneForgeCheckFont',checkFont.sample))throw Error('Chưa xác nhận được font có đủ mẫu dấu.');checkState.font={state:'passed',at:Date.now()/1000,sha256:hash,note:'Font nhúng tải đúng SHA-256, có ký tự mẫu trong cmap và được trình duyệt nạp. Chưa chứng nhận các font thay thế trên máy khác.'};}catch(e){checkState.font={state:'failed',at:Date.now()/1000,note:e.message};}finally{await saveCheckState();if($('#checksRoot'))paintMachineChecks();}}
async function runNotificationCheck(){if(notificationTestTimer)return;if(!window.Notification){toast('Trình duyệt không hỗ trợ Notification API.');return;}let ctx;try{const permission=await Notification.requestPermission();if(permission!=='granted'){toast('Chưa được cấp quyền thông báo; chưa chạy phép thử.');return;}const AC=window.AudioContext||window.webkitAudioContext;if(AC){ctx=new AC();await ctx.resume();}const scheduled=Date.now();notificationTestTimer=setTimeout(async()=>{notificationTestTimer=null;let created=false,sound=false,message='';try{const n=new Notification('SceneForge · thử thông báo',{body:'Bạn có thấy thông báo và nghe tiếng không? Quay lại app để ghi kết quả D4.',tag:'sceneforge-machine-check'});n.onclick=()=>{window.focus();n.close();};created=true;if(ctx?.state==='running'){const o=ctx.createOscillator(),gain=ctx.createGain();o.connect(gain);gain.connect(ctx.destination);o.frequency.value=660;gain.gain.setValueAtTime(.1,ctx.currentTime);gain.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+.4);o.start();o.stop(ctx.currentTime+.42);o.onended=()=>ctx.close();sound=true;}else if(ctx){await ctx.close();}}catch(e){message=e.message;await ctx?.close();}checkState.notification={at:Date.now()/1000,created,soundStarted:sound,documentHidden:document.hidden,elapsed_seconds:(Date.now()-scheduled)/1000,note:message||('Lúc thử: '+(document.hidden?'tab ở nền':'tab còn hiện')+'. API gọi '+(created?'thành công':'chưa thành công')+'; vẫn cần bạn xác nhận đã nhìn/nghe thấy ở D4.')};await saveCheckState();if($('#checksRoot'))paintMachineChecks();},8000);paintMachineChecks();toast('Hãy thu nhỏ trình duyệt, chờ khoảng 8 giây rồi quay lại ghi kết quả D4.');}catch(e){await ctx?.close();toast(e.message);}}
function openCheckCase(id){const c=checkSheet.rows.find(c=>c.id===id);if(!c)return;const result=checkState.manual[id];modal(c.id+' · '+c.title,'<div class="checkCaseDetail"><p><b>Cách thử</b><br>'+esc(c.how)+'</p><p><b>Đạt khi</b><br>'+esc(c.acceptance)+'</p><p><b>Nếu không đạt</b><br>'+esc(c.fallback)+'</p><p class="g5Muted">Kết quả dưới đây do bạn tự ghi nhận sau khi thử. App không xác minh mặt/nhãn, số credit hoặc cảm nhận giọng nói thay bạn.</p><label class="field">Kết quả<select id="manualCheckStatus"><option value="untried">Chưa thử</option><option value="pass">Đạt</option><option value="fail">Không đạt</option></select></label><label class="field">Số đo / bằng chứng<textarea id="manualCheckNote" rows="4" maxlength="4000" placeholder="Ví dụ: máy thử, thời gian, số credit trước/sau, lỗi nhìn thấy…">'+esc(result?.note||'')+'</textarea></label><p id="manualCheckError" role="alert"></p></div>','<button id="backToChecks">Quay lại</button><button id="saveManualCheck" class="primary">Lưu kết quả tự ghi nhận</button>');$('#shellDialog').classList.add('checksDialog');$('#manualCheckStatus').value=result?.status||'untried';$('#backToChecks').onclick=paintMachineChecks;$('#saveManualCheck').onclick=async()=>{const status=$('#manualCheckStatus').value,note=$('#manualCheckNote').value.trim();if(status!=='untried'&&note.length<10){$('#manualCheckError').textContent='Thêm số đo hoặc bằng chứng ít nhất 10 ký tự trước khi ghi Đạt/Không đạt.';return;}const safe=note.replace(/AIza[\w-]{15,}/g,'[ẨN KEY]').replace(/(Bearer\s+)[^\s]+/gi,'$1[ẨN]').replace(/((?:cookie|api[_-]?key|password|token)\s*[:=]\s*)[^\n]+/gi,'$1[ẨN]');checkState.manual[id]={status,note:safe,at:Date.now()/1000,source:'user-reported',verified_by_app:false};await saveCheckState();paintMachineChecks();};}

function paintAccounts(){const ctx=accountDashboard;if(!ctx)return;const rows=accountRows(),status=ctx.status,service=activeAccountService,demo=ctx.demo,rotation=!!status.rotation?.[service],stats=[['all',rows.length,'tài khoản'],['active',rows.filter(a=>accountState(a)==='active').length,'đang dùng'],['cooldown',rows.filter(a=>a.enabled&&a.state==='cooldown').length,'đang nghỉ'],['verification',rows.filter(a=>a.state==='verification').length,'đợi xác minh'],['exhausted',rows.filter(a=>a.state==='exhausted').length,'hết credit'],['blocked',rows.filter(a=>a.state==='blocked').length,'bị khóa'],['expiry',rows.filter(a=>a.cookie_expires_at>Date.now()/1000&&a.cookie_expires_at-Date.now()/1000<3600).length,'cookie sắp hết hạn']],engine=service==='flow'?'flow2api':'muse2api';modal('Tài khoản','<div class="acctDashboard"><div class="acctHeading"><div><small>Cài đặt</small><div class="acctTitle"><h2>Tài khoản</h2><nav class="acctTabs" aria-label="Dịch vụ tài khoản"><button data-account-service="flow" aria-pressed="'+(service==='flow')+'">Flow · Veo</button><button data-account-service="muse" aria-pressed="'+(service==='muse')+'">Muse</button></nav></div></div><span class="acctEngineMeta">Động cơ: <b>'+engine+'</b> · trên máy · xoay vòng: <strong>'+ (rotation?'BẬT':'TẮT')+'</strong></span></div><div class="acctStatusLine"><div class="acctStats">'+stats.map(([k,n,label])=>'<span><i class="'+k+'"></i><b>'+(ctx.error?'—':n)+'</b> '+label+'</span>').join('')+'</div><small class="acctLock">'+(demo?'Dữ liệu minh họa · không phải tài khoản thật':'🔒 Phiên đăng nhập mã hóa trên máy')+'</small></div>'+(ctx.error?'<div class="acctConnection">'+esc(ctx.error)+' <a href="./downloads/">Mở hướng dẫn bản cục bộ ↗</a></div>':'')+(service==='muse'?'<p class="acctServiceNote">Động cơ hiện dùng muse.ai; chưa xác minh là Meta AI.</p>':'')+'<div class="acctTopGrid"><section class="acctPanel"><header class="acctPanelTitle"><div><h3>Luồng kết nối</h3><small>'+(demo?'Bố cục minh họa các trạng thái tài khoản':'Tài khoản được chọn và trạng thái từ companion')+'</small></div><span class="acctLive '+(demo?'demo':'')+'"><i></i>'+(demo?'MINH HỌA':ctx.error?'CHƯA KẾT NỐI':'ĐÃ ĐỌC')+'</span></header>'+accountGraph(rows)+'</section><section class="acctPanel acctRequests"><header class="acctPanelTitle"><div><h3>Yêu cầu gần đây</h3><small>3 yêu cầu mới nhất · chỉ dịch vụ đang xem</small></div><div><button id="clearRequestLog" '+(ctx.error?'disabled':'')+'>Xóa nhật ký</button><button id="refreshAccounts">Làm mới</button></div></header><div class="acctRequestList">'+accountRequestList()+'</div></section></div><section class="acctPanel acctAccounts"><header class="acctPanelTitle"><div><h3>Danh sách tài khoản '+(service==='flow'?'Flow':'Muse')+'</h3><small>'+(demo?'Tên, trạng thái và credit đều là ví dụ để xem thiết kế.':'Giữ số dư cũ khi chưa đọc được; không suy lỗi mạng là hết phiên.')+'</small></div><div class="acctTableTools"><label class="acctRotation"><input id="rotateAccounts" type="checkbox" '+(rotation?'checked':'')+' '+(ctx.error||!status.engines?.[service]?.generation?'disabled':'')+'><span><b>Tự chuyển khi hết credit</b><small>Mặc định tắt · xác minh thì dừng</small></span></label><button id="connectAccount" class="primary" '+(ctx.error||demo?'disabled':'')+'>＋ Kết nối tài khoản</button></div></header>'+accountTable(rows)+'</section><section class="acctPanel acctCosts"><header class="acctPanelTitle"><div><h3>Chi phí credit '+(service==='flow'?'Flow':'Muse')+'</h3><small>'+(demo?'Số liệu minh họa để xem biểu đồ':'Tính từ nhật ký đã ghi nhận, không phải số dư dịch vụ')+'</small></div><nav class="acctTabs" aria-label="Khoảng ngày chi phí">'+[7,30].map(n=>'<button data-account-range="'+n+'" aria-pressed="'+(accountRange===n)+'">'+n+' ngày</button>').join('')+'</nav></header>'+accountCosts()+'</section></div>','');$('#shellDialog').classList.add('acctDialog');bindAccounts();}
async function accountAction(path,body,simulation){const context=accountDashboard;try{if(context.demo){simulation?.();const saved=await io('prefs','readonly','accounts-demo-dashboard')||{};saved[context.service]=context.status;await io('prefs','readwrite','accounts-demo-dashboard',saved);if(accountDashboard===context&&$('#shellDialog').open&&($('#dialogBody .acctDashboard')||$('#accountEditName')))paintAccounts();return;}const result=await engineRequest(path,body);if(result.message)toast(result.message);await accountScreen(activeAccountService);}catch(e){toast(e.message);}}
async function moveAccount(id,target){const list=accountRows(),from=list.findIndex(a=>a.id===id);if(from<0||target<0||target>=list.length)return;const[a]=list.splice(from,1);list.splice(target,0,a);await accountAction('accounts/order',{service:activeAccountService,ids:list.map(a=>a.id)},()=>list.forEach((a,i)=>a.priority=i));}
function accountEdit(id){const a=accountRows().find(a=>a.id===id);if(!a)return;modal('Tùy chọn · '+a.name,'<label class="field">Tên tài khoản<input id="accountEditName" maxlength="80" value="'+esc(a.name)+'"></label><label class="field">Ghi chú<textarea id="accountEditNote" maxlength="500" rows="3">'+esc(a.note||'')+'</textarea></label><p>'+(accountDashboard.demo?'Chỉ sửa dữ liệu minh họa của phiên xem.':'Thay tên và ghi chú không đổi phiên đăng nhập hoặc credit.')+'</p>','<button id="accountEditBack">Quay lại</button><button id="accountRemove">Gỡ tài khoản</button><button id="accountEditSave" class="primary">Lưu</button>');$('#accountEditBack').onclick=paintAccounts;$('#accountEditSave').onclick=()=>{const name=$('#accountEditName').value.trim(),note=$('#accountEditNote').value;if(!name)return toast('Nhập tên tài khoản.');accountAction('accounts/update',{id,name,note},()=>Object.assign(a,{name,note}));};$('#accountRemove').onclick=()=>{if(confirm('Gỡ tài khoản khỏi app và xóa phiên mã hóa đã lưu?'))accountAction('accounts/remove',{id},()=>accountDashboard.status.accounts=accountDashboard.status.accounts.filter(a=>a.id!==id));};}
function bindAccounts(){$$('[data-account-service]').forEach(b=>b.onclick=()=>accountScreen(b.dataset.accountService));$$('[data-account-range]').forEach(b=>b.onclick=()=>{accountRange=Number(b.dataset.accountRange);paintAccounts();});$('#refreshAccounts').onclick=()=>accountScreen(activeAccountService);$('#connectAccount').onclick=()=>accountAction('accounts/connect',{service:activeAccountService});$('#clearRequestLog').onclick=()=>{if(confirm('Xóa nhật ký và dữ liệu biểu đồ chi phí của dịch vụ đang xem? Không thay đổi số dư dịch vụ.'))accountAction('logs/clear-service',{service:activeAccountService},()=>accountDashboard.status.logs=[]);};$('#rotateAccounts').onchange=e=>{const enabled=e.target.checked;if(enabled&&!confirm('Bật tự chuyển có thể khiến nhiều tài khoản cùng bị khóa. Tiếp tục?')){e.target.checked=false;return;}accountAction('rotation',{service:activeAccountService,enabled},()=>accountDashboard.status.rotation[activeAccountService]=enabled);};$$('[data-use-account]').forEach(b=>b.onclick=()=>accountAction('accounts/use',{id:b.dataset.useAccount},()=>{const chosen=accountRows().find(a=>a.id===b.dataset.useAccount);if(chosen?.enabled&&['ready','active'].includes(chosen.state))for(const a of accountRows()){a.active=a===chosen;if(a.state==='active'&&a!==chosen)a.state='ready';}}));$$('[data-check-account]').forEach(b=>b.onclick=()=>{if(accountDashboard.demo)return toast('Minh họa: chưa thực hiện kiểm tra dịch vụ thật.');accountAction('accounts/check',{id:b.dataset.checkAccount});});$$('[data-confirm-login]').forEach(b=>b.onclick=()=>accountAction('accounts/save-login',{id:b.dataset.confirmLogin}));$$('[data-account-enable]').forEach(b=>b.onclick=()=>{const a=accountRows().find(a=>a.id===b.dataset.accountEnable);accountAction('accounts/update',{id:a.id,enabled:!a.enabled},()=>{a.enabled=!a.enabled;if(!a.enabled)a.active=false;});});$$('[data-account-edit]').forEach(b=>b.onclick=()=>accountEdit(b.dataset.accountEdit));$$('[data-graph-account]').forEach(b=>b.onclick=()=>{const row=$('[data-account-row="'+b.dataset.graphAccount+'"]');row?.scrollIntoView({behavior:'smooth',block:'center'});row?.classList.add('spotlight');setTimeout(()=>row?.classList.remove('spotlight'),1500);});$$('[data-account-move]').forEach(b=>b.onclick=()=>{const index=accountRows().findIndex(a=>a.id===b.dataset.accountMove);moveAccount(b.dataset.accountMove,index+Number(b.dataset.direction));});$$('[data-account-drag]').forEach(h=>{h.ondragstart=e=>{accountDrag=h.dataset.accountDrag;e.dataTransfer.setData('text/plain',accountDrag);e.dataTransfer.effectAllowed='move';};h.ondragend=()=>{accountDrag=null;$$('[data-account-row]').forEach(r=>r.classList.remove('dropTarget'));};});$$('[data-account-row]').forEach(row=>{row.ondragover=e=>{if(!accountDrag)return;e.preventDefault();row.classList.add('dropTarget');};row.ondragleave=()=>row.classList.remove('dropTarget');row.ondrop=e=>{e.preventDefault();row.classList.remove('dropTarget');if(accountDrag)moveAccount(accountDrag,accountRows().findIndex(a=>a.id===row.dataset.accountRow));accountDrag=null;};});}
const modalBeforeAccounts=modal;modal=function(...args){$('#shellDialog').classList.remove('acctDialog');return modalBeforeAccounts(...args);};$('#shellDialog').addEventListener('close',()=>{if(!$('#shellDialog').open)$('#shellDialog').classList.remove('acctDialog');});
window.SceneForgeApp.accounts={open:accountScreen};
const requestedAccount=new URLSearchParams(location.search).get('accounts');if(['flow','muse'].includes(requestedAccount)){const openAccountTimer=setInterval(()=>{if(db&&rooms.length){clearInterval(openAccountTimer);accountScreen(requestedAccount);}},200);setTimeout(()=>clearInterval(openAccountTimer),30000);}
const settingsBindBeforeAccountDashboard=g5BindSettings;g5BindSettings=function(){settingsBindBeforeAccountDashboard();const tab=$('[data-g5-tab="accounts"]');if(tab)tab.onclick=()=>accountScreen(activeAccountService||'flow');};
const settingsOpenBeforeAccountDashboard=g5OpenSettings;g5OpenSettings=async function(tab='ai'){if(tab==='accounts')return accountScreen(activeAccountService||'flow');return settingsOpenBeforeAccountDashboard(tab);};window.SceneForgeApp.settings.open=g5OpenSettings;

const aiSettingsBeforeV3=g5AI;g5AI=function(){return aiSettingsBeforeV3().replace('Dùng để xem video mẫu, chép lời, viết kịch bản và đề xuất cách ghép.','CPU chép lời; Gemini nhận ảnh + bản chữ để hiểu cảnh và viết prompt. App tự chọn model hỗ trợ từ danh sách của key.')+'<h4>OpenAI dự phòng · có phí</h4><p class="g5Muted">Chỉ gửi sau khi bạn xác nhận chuyển nguồn. Không tự chuyển khi Gemini lỗi hoặc hết quota.</p><div class="g5KeyRow"><input id="v3OpenAIKey" type="password" autocomplete="new-password" placeholder="Key OpenAI · lưu mã hóa trên máy" '+(!g5Local()?'disabled':'')+'><button id="v3SaveOpenAI" '+(!g5Local()?'disabled':'')+'>Lưu key</button><button id="v3CheckOpenAI" '+(!g5Local()?'disabled':'')+'>Kiểm tra model</button></div><p id="v3OpenAIResult" role="status"></p><p class="g5Muted">Kiểm tra model chỉ đọc danh sách, chưa xác minh quota, giá hay chất lượng phân tích.</p>';};
const settingsBindBeforeV3=g5BindSettings;g5BindSettings=function(){settingsBindBeforeV3();const check=async(provider,target,button)=>{button.disabled=true;target.textContent='Đang đọc danh sách model…';try{const r=await engineRequest('ai/providers/check',{provider});target.textContent=r.note;}catch(e){target.textContent=e.message;}finally{button.disabled=!g5Local();}};const gemini=$('#g5CheckKey');if(gemini)gemini.onclick=()=>check('gemini',$('#g5KeyResult'),gemini);const save=$('#v3SaveOpenAI'),probe=$('#v3CheckOpenAI');if(save)save.onclick=async()=>{const input=$('#v3OpenAIKey');try{const value=input.value.trim();if(!value)return;await engineRequest('settings/secret',{name:'openai',value});input.value='';$('#v3OpenAIResult').textContent='Đã lưu mã hóa. Chưa gửi yêu cầu phân tích.';}catch(e){$('#v3OpenAIResult').textContent=e.message;}};if(probe)probe.onclick=()=>check('openai',$('#v3OpenAIResult'),probe);};
