/* The Settings frame owns size, title, navigation and vertical scrolling. */
#settingsAccounts{container-type:inline-size;min-width:0}
#settingsAccounts .acctDashboard{padding:0;font-size:12px}
#settingsAccounts .acctHeading{align-items:center;flex-wrap:wrap;padding:0;gap:12px}
#settingsAccounts .acctStatusLine{align-items:flex-start;flex-direction:column}
#settingsAccounts .acctTopGrid{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
#settingsAccounts .acctGraph{height:350px}
#settingsAccounts .acctGraphNode{width:120px}
#settingsAccounts .acctGraphNode>small{font-size:9px}
#settingsAccounts .acctEngine{width:108px;height:98px}
#settingsAccounts .acctPanelTitle{flex-wrap:wrap}
#settingsAccounts .acctTableTools{flex-wrap:wrap;justify-content:flex-start}
#settingsAccounts .acctAccounts>.acctPanelTitle{flex-direction:column}
#settingsAccounts .acctPanelTitle small{font-size:10px}
#settingsAccounts .acctTabs{flex-direction:row;border:0;padding:3px;background:#1b1f26}
#settingsAccounts .acctTabs button{display:block;padding:7px 11px;color:#88919d;text-align:center}
#settingsAccounts .acctTabs button[aria-pressed=true]{color:#e5e9ee;background:#2a303a}
#settingsAccounts .acctEdit{max-width:650px}
#settingsAccounts .acctEditActions{display:flex;flex-wrap:wrap;gap:8px;margin-top:20px}
@container (max-width:780px){

}

}

window.SceneForgeStorage=(()=>{

 function observeWindow(w){if(!enabled||w.IDBObjectStore.prototype.__sfStorage)return;const proto=w.IDBObjectStore.prototype;Object.defineProperty(proto,'__sfStorage',{value:true});for(const method of ['put','add','delete','clear']){const old=proto[method];proto[method]=function(...args){const tx=this.transaction,d=tx.db.name,s=this.name;if(!schemas[d]?.includes(s))return old.apply(this,args);const req=old.apply(this,args),key=method==='delete'?args[0]:undefined;tx.addEventListener('complete',()=>change(d,s,method==='clear'?null:method==='delete'?key:req.result),{once:true});return req;};}}
 function open(name){return new Promise((ok,no)=>{const req=indexedDB.open(name,1);req.onupgradeneeded=()=>(schemas[name]||schemas['sceneforge-app-shell']).forEach(s=>req.result.createObjectStore(s,name==='sceneforge-workflows'?{keyPath:'id'}:undefined));req.onsuccess=()=>ok(req.result);req.onerror=()=>no(req.error);});}

 async function equalBlob(a,b){if(a===b)return true;if(a.size!==b.size||a.type!==b.type)return false;for(let at=0;at<a.size;at+=1024*1024){const x=new Uint8Array(await a.slice(at,at+1024*1024).arrayBuffer()),y=new Uint8Array(await b.slice(at,at+1024*1024).arrayBuffer());for(let i=0;i<x.length;i++)if(x[i]!==y[i])return false;}return true;}
 function cachePut(cache,key,value){cache.delete(key);cache.set(key,value);const url=cache===urlCache,limit=url?32:128,budget=(url?16:128)*1024*1024;let bytes=[...cache.entries()].reduce((n,[k,v])=>n+(url?k.length*2:v.blob?.size||0),0);while(cache.size>limit||bytes>budget){const oldest=cache.keys().next().value;if(oldest===undefined)break;bytes-=url?oldest.length*2:cache.get(oldest).blob?.size||0;cache.delete(oldest);}}

 async function encode(value,path=''){

let recipeCache=null,recipeLoading=null;
async function recipeLibrary(){

}
async function saveRecipeLibrary(){await io('prefs','readwrite','recipe-library',recipeCache);}
async function listRecipes(){const lib=await recipeLibrary();return lib.items.map(r=>{
 const usedRooms=rooms.filter(v=>v.photoDraft?.formula===r.id),uses=new Set([...usedRooms.map(v=>v.id),...Object.values(lib.usage||{}).filter(v=>v.formula===r.id).map(v=>v.roomId)]),feedback=Object.values(lib.feedback||{}).filter(v=>v.formula===r.id);for(const v of usedRooms.filter(v=>v.stage==='exported'&&v.recipeVote&&!lib.feedback?.[v.id]))feedback.push({vote:v.recipeVote});
 return{...clone(r),uses:uses.size,up:feedback.filter(v=>v.vote===1).length,down:feedback.filter(v=>v.vote===-1).length};
}).sort((a,b)=>SFRecipes.rank(b)-SFRecipes.rank(a)||a.name.localeCompare(b.name,'vi'));}

// A terminal/unknown extraction is never submitted again automatically.
const recipeWork=new Set();
async function extractReferenceRecipe(roomId){
 if(recipeWork.has(roomId))return;recipeWork.add(roomId);
 try{
  const r=roomFor(roomId);if(!r||r.mode==='photos')return;
  const lib=await recipeLibrary();if(lib.sources[roomId]?.state&&['done','unknown','failed'].includes(lib.sources[roomId].state))return;
  const w=await workflowRecord(roomId);if(!w?.scenes?.length||w.analysis?.status!=='done')return;
  if(['submitted','unknown'].includes(w.analysis.aiRequest?.state))return;
  // A live analysis may include a reusable recipe in the same response. Never
  // silently issue a second provider request just because the new transcript arrived.
  if(w.analysis.semantic?.provider==='Gemini'){
   const raw=w.analysis.semantic.recipe,id='source:'+roomId;
   if(raw){if(!lib.deleted.includes(id))await putRecipe({...raw,id,source:'reference',sourceRoomId:roomId,sourceName:r.name,sourcePoster:r.poster,createdAt:Date.now()});lib.sources[roomId]={state:'done',note:'Dùng công thức trong cùng lượt phân tích; không gọi thêm AI.'};}
   else lib.sources[roomId]={state:'needs-recipe',note:'Phân tích chưa có công thức hợp lệ. Không tự gửi thêm lượt AI.'};
   await saveRecipeLibrary();return;
  }
  const lines=(w.script||[]).map(b=>({start:b.start,end:b.end,text:b.original||b.newText||''})).filter(b=>b.text.trim());
  if(!lines.length){lib.sources[roomId]={state:'needs-text',note:'Đã dò hình; chưa có phân tích nội dung / lời thoại để rút công thức.'};await saveRecipeLibrary();return;}
  let info;try{info=await engineRequest('status');}catch{return;}
  if(!info.gemini_configured)return;
  lib.sources[roomId]={state:'unknown',note:'Đã gửi rút công thức; không tự gửi lại khi mất kết nối.'};await saveRecipeLibrary();
  const raw=await engineRequest('ai/recipe',{room_id:roomId,product_id:r.productId,source_name:r.name,lines});
  const id='source:'+roomId;
  if(!lib.deleted.includes(id))await putRecipe({...raw,id,source:'reference',sourceRoomId:roomId,sourceName:r.name,sourcePoster:r.poster,createdAt:Date.now()});
  lib.sources[roomId]={state:'done'};await saveRecipeLibrary();
 }catch(e){const lib=await recipeLibrary();lib.sources[roomId]={state:'failed',note:e.message};await saveRecipeLibrary();}
 finally{recipeWork.delete(roomId);}
}

let changingWorkflow=false;
async function createWorkflowRoom(mode,product){
 const r={id:uid(),name:(mode==='photos'?'Video từ ảnh':'Video mẫu mới')+' · '+product.name,productId:product.id,mode,stage:mode==='photos'?'review':'new',createdAt:Date.now(),updatedAt:Date.now(),refs:clone(product.refs),sceneStates:[]};
 r.slug=uniqueSlug(r.name,rooms.filter(r=>r.productId===product.id));rooms.push(r);await persistRoom(r);return r;
}
async function switchWorkflow(mode){
 if(!['reference','photos'].includes(mode)||changingWorkflow)return;
 if(currentRoom?.mode===mode&&currentView==='analysis')return;
 changingWorkflow=true;renderWorkflowModes();
 try{
  await flushFrames();const product=productFor(currentRoom?.productId)||productFor(prefs.product)||products[0];
  if(!product)throw Error('Tạo sản phẩm trước khi mở không gian.');
  const remembered=roomFor(prefs.modeRooms?.[product.id]?.[mode]);
  let target=remembered&&remembered.productId===product.id&&remembered.mode===mode&&!archivedRoom(remembered)?remembered:rooms.filter(r=>r.productId===product.id&&(r.mode||'reference')===mode&&!archivedRoom(r)).sort((a,b)=>(b.updatedAt||b.createdAt)-(a.updatedAt||a.createdAt))[0];
  if(!target)target=await createWorkflowRoom(mode,product);
  await openRoom(target.id,'analysis');
 }catch(e){fail(e);}finally{changingWorkflow=false;renderWorkflowModes();}
}
function renderWorkflowModes(){
 workflowModes.hidden=currentView!=='analysis';workflowModes.setAttribute('aria-busy',String(changingWorkflow));const r=currentRoom;
 for(const b of workflowModes.querySelectorAll('[data-workflow-mode]')){const active=b.dataset.workflowMode===(r?.mode||'reference');b.classList.toggle('selected',active);b.setAttribute('aria-current',active?'page':'false');b.setAttribute('aria-pressed',String(active));b.disabled=changingWorkflow;}
 $('#workflowModeHint').textContent=changingWorkflow?'Đang lưu và đổi phòng…':r?.mode==='photos'?(r.photoWorkspace==='storyboard'?'Kịch bản theo cảnh · dự án cũ được giữ':'Bộ cảnh sản phẩm + kịch bản + giọng đọc + đạo diễn'):'Bám cấu trúc và nhịp video tham khảo';
 const toggle=$('#photoWorkspaceToggle');toggle.hidden=!(r?.mode==='photos'&&r.legacyPhotoAvailable);toggle.textContent=r?.photoWorkspace==='storyboard'?'Mở Bộ cảnh & đạo diễn →':'Mở kịch bản theo cảnh cũ →';
}
workflowModes.addEventListener('click',e=>{const b=e.target.closest('[data-workflow-mode]');if(b)switchWorkflow(b.dataset.workflowMode);});
$('#photoWorkspaceToggle').onclick=async()=>{const r=currentRoom;if(!r||changingWorkflow)return;try{await flushFrames();r.photoWorkspace=r.photoWorkspace==='storyboard'?'bank':'storyboard';await io('rooms','readwrite',r.id,r);$('#roomFrames').replaceChildren();frameRoom=null;await openRoom(r.id,'analysis');}catch(e){fail(e);}};
const renderBeforeNavigation=render;render=function(){renderBeforeNavigation();renderWorkflowModes();};
const openBeforeNavigation=openRoom;openRoom=async function(id,view=null){await openBeforeNavigation(id,view);const r=roomFor(id);if(currentRoom?.id===id&&r){prefs.modeRooms??={};prefs.modeRooms[r.productId]??={};prefs.modeRooms[r.productId][r.mode||'reference']=id;await savePrefs();}renderWorkflowModes();};
window.SceneForgeApp.openRoom=(...args)=>openRoom(...args);window.SceneForgeApp.switchWorkflow=switchWorkflow;
window.addEventListener('message',e=>{
 const frame=$('#workflowFrame');if(e.origin!==location.origin||e.source!==frame?.contentWindow)return;
 if(e.data?.type==='sceneforge:switch-workflow')switchWorkflow(e.data.mode);
 if(e.data?.type==='sceneforge:room-source-attached'){
  const r=roomFor(e.data.roomId);if(!r||r.id!==currentRoom?.id||r.mode==='photos'||!(e.data.file instanceof Blob))return;
  (async()=>{await io('files','readwrite',r.id+':source',e.data.file);r.sourceName=e.data.name;r.sourceSize=e.data.file.size;r.poster=e.data.poster||r.poster;await persistRoom(r);})().catch(fail);
 }
});
const payloadBeforeNavigation=roomPayload;roomPayload=async function(r){return{...await payloadBeforeNavigation(r),hostNavigation:true};};
async function restoreLegacyPhotoWorkspaces(){
 for(const r of rooms.filter(r=>r.mode==='photos')){
  const old=await workflowRecord(r.id);if(!old?.storyboard||!old.scenes?.length)continue;
  r.legacyPhotoAvailable=true;
  // Keep both stored versions. A migration must not silently hide the old frames/clips.
  if(!r.photoWorkspace)r.photoWorkspace=!r.photoDraft||r.photoDraft.migrationNotice?'storyboard':'bank';
  await io('rooms','readwrite',r.id,r);
 }
}

function roomAttention(room){
 if(room.stage==='exported')return null;
 const uncertain=jobs.find(j=>j.roomId===room.id&&['unknown','submitted'].includes(j.status));
 if(uncertain)return {kind:'queue',label:'Chưa rõ kết quả · kiểm tra hàng chờ'};
 if(room.error)return null; // Preserve the existing error dialog and copy-details action.
 const recent=localRecovery.jobs.filter(j=>j.room_id===room.id).sort((a,b)=>(b.at||b.created||0)-(a.at||a.created||0)),active=recent.find(j=>['uploading','queued','running'].includes(j.state));
 if(active)return {kind:'local',label:active.state==='queued'?'Đang xếp lượt trên máy · xem tiến độ':'Máy đang xử lý · xem tiến độ',column:'running'};
 const done=recent.find(j=>j.state==='done'&&j.lane!=='analysis'&&(j.created||0)*1000>(room.exportedAt||0));
 if(done)return {kind:'local',label:'MP4 đã xong · tải lại kết quả',column:'attention'};
 const latest=recent.filter((j,i)=>recent.findIndex(x=>x.lane===j.lane)===i);
 const paused=latest.find(j=>j.lane==='analysis'&&j.state==='paused');if(paused)return{kind:'local',label:'CPU tạm dừng · tiếp tục phần còn thiếu',column:'attention'};
 const interrupted=latest.find(j=>j.recovered&&j.state==='error'&&(j.at||j.created||0)*1000>(room.localRecoverySeenAt||0));
 if(interrupted)return {kind:'local',label:'Lượt trên máy bị ngắt · xem chi tiết',column:'attention'};
 if(room.stage==='editing')return {kind:'editor',label:'Mở Dựng & xuất'};
 if(jobs.some(j=>j.roomId===room.id&&j.status==='running'))return null;
 if(Number.isFinite(room.pendingFrames)&&room.pendingFrames>0)return {kind:'frames',label:'Rà '+room.pendingFrames+' khung chưa duyệt',column:'attention'};
 if(room.stage==='generating'&&Number.isFinite(room.sceneCount)&&room.sceneCount>0&&Number.isFinite(room.readyScenes)){
  const missing=Math.max(0,room.sceneCount-room.readyScenes);
  return missing?{kind:'clips',label:'Còn '+missing+' cảnh chưa đủ clip · mở kiểm tra',column:'attention'}:{kind:'editor',label:'Đủ clip · mở Dựng',column:'attention'};
 }
 return null;
}

async function storageJobsDialog(id){try{const info=await SceneForgeStorage.api('lifecycle/status'+(id?'?room_id='+encodeURIComponent(id):''));modal('Công việc của dự án',info.jobs.map((job,i)=>'<section><b>'+esc(job.provider)+' · '+esc(job.state)+' · '+esc(job.room_id||'chưa gán dự án')+'</b><p>'+esc(job.id)+'</p>'+(!['imported','discarded','failed','not_submitted'].includes(job.state)?'<button data-discard-storage-job="'+i+'">Đã đối soát · bỏ kết quả</button>':'')+'</section>').join('')||'<p>Chưa có công việc.</p>','<button id="storageBack">Quay lại dọn</button>');$('#storageBack').onclick=()=>id?storageCleanupDialog(id):$('#shellDialog').close();$$('[data-discard-storage-job]').forEach(b=>b.onclick=async()=>{if(!confirm('Bạn đã kiểm tra lịch sử dịch vụ? Bỏ kết quả không hủy tác vụ và không hoàn credit. Không tự tạo lại.'))return;try{await SceneForgeStorage.api('lifecycle/discard',{request_id:info.jobs[Number(b.dataset.discardStorageJob)].id,confirm:true});storageJobsDialog(id);}catch(e){toast(e.message);}});}catch(e){toast(e.message);}}

const storageContextBefore=contextRoom;contextRoom=async function(room,x,y){await storageContextBefore(room,x,y);if(!SceneForgeStorage.managed)return;const menu=$('#contextMenu'),remove=menu.querySelector('[data-context-action="delete"]');if(remove){remove.textContent='Xóa hẳn dự án…';remove.onclick=()=>{hideContext();storageCleanupDialog(room.id,'delete');};}const cleanup=document.createElement('button');cleanup.textContent='Dọn bản không dùng…';cleanup.onclick=()=>{hideContext();storageCleanupDialog(room.id,'unused');};menu.append(cleanup);};
const managedCompactBefore=archivePerformCompact;archivePerformCompact=async function(plan,automatic=false){if(!SceneForgeStorage.managed)return managedCompactBefore(plan,automatic);await SceneForgeStorage.flush();const backend=await SceneForgeStorage.api('lifecycle/plan',{room_id:plan.id,mode:'compact',days:0,revision:SceneForgeStorage.state.revision});if(automatic){const r=roomFor(plan.id);if(!r.archivePolicy?.automatic||r.archivePolicy.pinned||r.archivePolicy.paused||r.archiveVerified?.hash!==plan.verified.hash)throw Error('Lịch thu gọn chưa được xác nhận.');}return storageApplyPlan(backend);};
const lastCleanup=sessionStorage.getItem('sceneforge-last-cleanup');if(lastCleanup){sessionStorage.removeItem('sceneforge-last-cleanup');setTimeout(()=>{try{const r=JSON.parse(lastCleanup);toast('Đã xóa file trong kho: '+archiveFormat(r.freed_bytes)+' · chờ: '+r.waiting_files+' · được bảo vệ: '+r.protected_files+(r.errors?.length?' · còn lỗi, có thể thử lại':''));}catch{}},1800);}

// Approval itself is the user's consent to retire earlier generations in these slots.
// Flush all writers before the backend changes canonical records, then replace caches.
SceneForgeStorageActions.approveVersions=async function(id,targets){
 if(storageMutationBusy)throw Error('Đợi lượt lưu/dọn hiện tại.');
 if(!SceneForgeStorage.managed||!SceneForgeStorage.state.active)throw Error('Cần kho máy đang kết nối để xóa file cũ.');
 if(currentRoom?.id!==id||activeWorkers.size||pendingVersionImports.has(id))throw Error('Đợi việc nhập/phân tích hiện tại xong.');
 storageMutationBusy=true;const wasInert=document.body.inert;document.body.inert=true;let sent=false;
 try{
  await flushFrames();
  for(let attempt=0;attempt<6;attempt++){
   await new Promise(resolve=>setTimeout(resolve,80));
   try{await SceneForgeStorage.checkpoint();break;}catch(error){if(attempt===5||!error.message.includes('Dữ liệu đang thay đổi'))throw error;}
  }
  // A hidden editor must not later write its stale library of alternative versions back.
  $('#standaloneEditorDemo')?.remove();
  const result=await SceneForgeStorage.edit(async()=>{
   const revision=SceneForgeStorage.state.revision;
   const mutationId=crypto.randomUUID();await SceneForgeStorage.markMutation(mutationId);sent=true;
   return SceneForgeStorage.api('lifecycle/approve',{room_id:id,targets,revision,confirm:true,mutation_id:mutationId});
  });
  const decoded=await SceneForgeStorage.hydrate(result.snapshot);
  SceneForgeStorage.clearMediaCache();
  const workflow=decoded.find(r=>r.db==='sceneforge-workflows'&&r.key===id)?.value;
  const photoDraft=decoded.find(r=>r.db==='sceneforge-app-shell'&&r.store==='rooms'&&r.key===id)?.value?.photoDraft;
  if(!workflow&&!photoDraft)throw Error('Chưa nạp lại được bản duyệt; mở lại phòng.');
  if(photoDraft&&roomFor(id))roomFor(id).photoDraft=structuredClone(photoDraft);
  return {...result,workflow,photoDraft};
 }catch(error){
  if(sent&&error.status===409&&error.message.startsWith('Đang có tác vụ')){localStorage.removeItem('sceneforge-library-intent');sent=false;}
  if(sent){SceneForgeStorage.pause();error.message+=' Mở lại app để nạp trạng thái kho máy; không ghi đè dữ liệu cũ.';}
  throw error;
 }finally{document.body.inert=wasInert;storageMutationBusy=false;}
};

archiveHash=async function(blob){if(SceneForgeStorage.managed)return SceneForgeStorage.hashBlob(blob,'archive-export');return (await SceneForgePortable.fingerprintWorker(blob)).hash;};
const storageOperations=document.createElement('button');storageOperations.textContent='Lượt dọn / lấy lại';$('.archiveToolbar').append(storageOperations);

const storageBulk=document.createElement('button');storageBulk.textContent='Dọn / xóa các dự án đã chọn';$('.archiveToolbar').append(storageBulk);
storageBulk.onclick=async()=>{try{const ids=[...archiveSelection].filter(id=>roomFor(id));if(!ids.length)return toast('Chọn các dự án trong danh sách trước.');await storageCloseRoom(ids[0]);modal('Dọn / xóa '+ids.length+' dự án',ids.map(id=>'<p>'+esc(roomFor(id).name)+'</p>').join('')+'<label>Thao tác<select id="storageBulkMode"><option value="unused">Dọn bản không dùng</option><option value="compact">Chốt và dọn tư liệu</option><option value="delete">Xóa hẳn dự án</option></select></label><label>Giữ file trước khi xóa<select id="storageBulkDays"><option value="7">7 ngày</option><option value="0">Xóa ngay · không khôi phục</option><option value="30">30 ngày</option></select></label><p>Giữ tài nguyên dùng chung và bản xuất đã chép ra thư mục ngoài. Xử lý từng dự án; dừng nếu có lỗi, không tự gửi lại.</p><label><input type="checkbox" id="storageBulkAccept"> Tôi xác nhận phạm vi các dự án đã chọn</label><p id="storageBulkError"></p>','<button id="storageBulkPreview">Xem dữ liệu sẽ xét dọn</button>');$('#storageBulkPreview').onclick=async()=>{try{if(!$('#storageBulkAccept').checked)throw Error('Cần xác nhận danh sách dự án.');await SceneForgeStorage.flush();const mode=$('#storageBulkMode').value,days=Number($('#storageBulkDays').value),revision=SceneForgeStorage.state.revision,plans=[];for(const id of ids)plans.push(await SceneForgeStorage.api('lifecycle/plan',{room_id:id,mode,days,revision}));modal('Xác nhận '+plans.length+' dự án',plans.map(p=>'<p>'+esc(roomFor(p.room_id).name)+' · '+archiveFormat(p.candidate_bytes)+' media xét dọn</p>').join('')+'<p>Ước tính có thể trùng file giữa dự án. Chỉ báo dung lượng đã xóa sau khi thực hiện. '+(days?'File chờ '+days+' ngày.':'File đủ điều kiện được xóa ngay, không khôi phục được.')+'</p>','<button id="storageBulkExecute">Chốt các dự án này</button>');$('#storageBulkExecute').onclick=async()=>{const button=$('#storageBulkExecute');button.disabled=true;let completed=0,last=null,needsRecovery=false;try{if(SceneForgeStorage.state.dirty||SceneForgeStorage.state.revision!==revision)throw Error('Có thay đổi mới; xem lại kế hoạch.');await SceneForgeStorage.edit(async()=>{let current=revision;for(const id of ids){const plan=await SceneForgeStorage.api('lifecycle/plan',{room_id:id,mode,days,revision:current});await SceneForgeStorage.markMutation(plan.token);last=await SceneForgeStorage.api('lifecycle/execute',{mutation_id:plan.token,room_id:id,mode,days,revision:current,token:plan.token,confirm:true});current=last.snapshot.revision;completed++;button.textContent='Đã xử lý '+completed+'/'+ids.length;}});}catch(error){needsRecovery=!error.status||error.status>=500;alert('Đã xử lý '+completed+'/'+ids.length+'. Dừng: '+error.message);}finally{if(needsRecovery){SceneForgeStorage.pause();location.reload();}else if(last){SceneForgeStorage.pause();await SceneForgeStorage.hydrate(last.snapshot);location.reload();}else button.disabled=false;}};}catch(error){$('#storageBulkError').textContent=error.message;}};}catch(error){toast(error.message);}};

const storageLimitsContentBefore=g5Content;g5Content=function(tab){const html=storageLimitsContentBefore(tab);if(tab!=='storage'||!SceneForgeStorage.managed)return html;return html.replace('</section>','<h4>Giới hạn dung lượng trước khi nhận việc mới</h4><label>Giữ trống ít nhất (MB)<input type="number" id="storageMinFree" min="128" max="1048576" value="256"></label><label>Tối đa media trung gian trong kho (MB; 0 = không đặt trần)<input type="number" id="storageTempBudget" min="0" max="104857600" value="0"></label><p id="storageBudgetStatus">Đang đọc…</p><button id="saveStorageLimits">Lưu giới hạn</button></section>');};
