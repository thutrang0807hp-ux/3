<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SceneForge · Bản mô phỏng</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:Arial,sans-serif;background:#171719;color:#eee}body{display:flex;flex-direction:column}header{display:flex;gap:12px;align-items:center;padding:9px 14px;flex-shrink:0;border-bottom:1px solid #36363d;font-size:11px}strong{color:#46c6f4}span{color:#aaa;flex:1}button{border:1px solid #484850;border-radius:6px;padding:7px 12px;color:#ccc;background:#28282e;cursor:pointer}button[aria-pressed=true]{color:#7cdeff;background:#184656;border-color:#29718a}iframe{width:100%;flex:1;min-height:0;border:0}noscript{padding:12px}@media(max-width:650px){header{flex-wrap:wrap}span{flex-basis:100%}}</style></head><body><header><strong>SceneForge Studio</strong><span>Bản mô phỏng · Video 9:16 · Không gọi API</span><button id="editor" aria-pressed="true">Dựng video</button><button id="studio" aria-pressed="false">Toàn bộ ứng dụng</button></header><noscript>Hãy bật JavaScript trong trình duyệt để thử các thao tác.</noscript><iframe id="workspace" src="./editor.html" title="Không gian SceneForge" allow="autoplay; fullscreen"></iframe><script>(()=>{const frame=document.getElementById('workspace');const frames={editor:frame};let active='editor';['editor','studio'].forEach(name=>{document.getElementById(name).onclick=()=>{if(name===active)return;if(!frames[name]){const next=document.createElement('iframe');next.src='./'+name+'.html';next.title='Toàn bộ ứng dụng SceneForge';next.allow='autoplay; fullscreen';document.body.append(next);frames[name]=next;}frames[active].hidden=true;frames[name].hidden=false;active=name;['editor','studio'].forEach(id=>document.getElementById(id).setAttribute('aria-pressed',String(id===name)));};});})();</script></body></html>
