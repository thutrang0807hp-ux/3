// New Flow versions are staged separately, then appended to the room's library.
const pendingVersionImports=new Set();
async function importPendingVersions(room,frame){if(pendingVersionImports.has(room.id))return;const pending=await io('files','readonly',room.id+':pending');if(!pending?.length)return;pendingVersionImports.add(room.id);try{const api=await waitAPI(frame,'SceneForgeEditor');await api.roomReady;const id=uid();await new Promise((resolve,reject)=>{const timer=setTimeout(()=>{window.removeEventListener('message',ack);reject(Error('Chưa thêm được bản mới vào Kho.'));},30000);function ack(e){if(e.source!==frame.contentWindow||e.origin!==location.origin||e.data?.type!=='sceneforge:workflow-import-ack'||e.data.id!==id)return;clearTimeout(timer);window.removeEventListener('message',ack);e.data.error?reject(Error(e.data.error)):resolve();}window.addEventListener('message',ack);frame.contentWindow.postMessage({type:'sceneforge:workflow-import',id,payload:{roomId:room.id,placement:'library',appendOnly:true,clips:pending,alternatives:[],audio:[]}},location.origin);});await api.flushRoom();const latest=await io('files','readonly',room.id+':pending')||[],done=new Set(pending.map(c=>c.key)),remaining=latest.filter(c=>!done.has(c.key));if(remaining.length)await io('files','readwrite',room.id+':pending',remaining);else await io('files','readwrite',room.id+':pending');}finally{pendingVersionImports.delete(room.id);}}
window.addEventListener('message',async e=>{if(e.origin!==location.origin||e.source!==$('#workflowFrame')?.contentWindow||e.data?.type!=='sceneforge:room-new-versions')return;const room=roomFor(e.data.roomId);if(!room?.editorInitialized)return;try{const previous=await io('files','readonly',room.id+':pending')||[];await io('files','readwrite',room.id+':pending',[...previous,...e.data.clips]);if(frameRoom===room.id&&$('#standaloneEditorDemo'))await importPendingVersions(room,$('#standaloneEditorDemo'));toast('Bản clip mới đã vào Kho; timeline được giữ nguyên.');}catch(err){fail(err);}});

async function writeImmutableFile(dir,name,data){try{const handle=await dir.getFileHandle(name),file=await handle.getFile();if(file.size===data.size)return;}catch(e){if(e.name!=='NotFoundError')throw e;}await writeFile(dir,name,data);}
async function mirrorProduct(root,product){const dir=await root.getDirectoryHandle(product.slug,{create:true}),refs=await dir.getDirectoryHandle('bo-anh',{create:true});for(const[key,ref]of Object.entries(product.refs))for(const image of ref.images||[])await writeImmutableFile(refs,key+'-'+slug(image.id)+'.jpg',await(await fetch(image.image)).blob());await writeFile(refs,'bo-anh.json',JSON.stringify(product,null,2));}
async function deleteRoomState(id){for(const[name,store]of [['sceneforge-workflows','projects'],['sceneforge-editor-local','drafts']])await new Promise((resolve,reject)=>{const r=indexedDB.open(name,1);r.onsuccess=()=>{const d=r.result,tx=d.transaction(store,'readwrite');tx.objectStore(store).delete(id);tx.oncomplete=()=>{d.close();resolve();};tx.onerror=()=>{d.close();reject(tx.error);};};r.onerror=()=>reject(r.error);});localStorage.removeItem('sceneforge-editor-draft-v2:'+id);}
window.addEventListener('message',e=>{if(e.origin!==location.origin||e.source!==$('#workflowFrame')?.contentWindow||e.data?.type!=='sceneforge:room-new-source')return;const room=roomFor(e.data.roomId),product=productFor(room?.productId);if(product&&e.data.file instanceof Blob)importVideos([e.data.file],product);});
</script></body></html>
