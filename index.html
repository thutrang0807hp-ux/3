async function videoInfo(file){if(!file.type.startsWith('video/')&&!/\.(mp4|webm|mov|m4v)$/i.test(file.name))throw Error(file.name+': không phải tệp video.');if(file.size>500*1024*1024)throw Error(file.name+': video tối đa 500 MB.');const url=URL.createObjectURL(file),v=document.createElement('video');v.muted=true;v.preload='auto';try{await new Promise((resolve,reject)=>{const timer=setTimeout(()=>reject(Error('Không đọc được '+file.name)),18000);v.onloadeddata=()=>{clearTimeout(timer);resolve();};v.onerror=()=>{clearTimeout(timer);reject(Error('Không giải mã được '+file.name));};v.src=url;});if(Math.abs(v.videoWidth/v.videoHeight-9/16)>.025)throw Error(file.name+': chỉ nhận video dọc 9:16.');if(!Number.isFinite(v.duration)||v.duration<=0||v.duration>600)throw Error(file.name+': thời lượng tối đa 10 phút.');const c=document.createElement('canvas');c.width=240;c.height=427;c.getContext('2d').drawImage(v,0,0,240,427);return{duration:v.duration,poster:c.toDataURL('image/jpeg',.8)};}finally{v.removeAttribute('src');v.load();URL.revokeObjectURL(url);}}

const reuseBeforeG4=reuseRoom;reuseRoom=async function(id){const old=roomFor(id);if(old?.mode!=='photos')return reuseBeforeG4(id);await flushFrames();if(!old.photoDraft)await roomPayload(old);chooseProduct('Dùng công thức với bộ ảnh nào?',async p=>{const draft=old.photoDraft?clone(old.photoDraft):null,room={id:uid(),name:old.name+' · mẫu mới',productId:p.id,poster:p.refs.product.images[0]?.image,mode:'photos',stage:'review',createdAt:Date.now(),updatedAt:Date.now(),refs:clone(p.refs),sceneStates:[]};room.slug=uniqueSlug(room.name,rooms.filter(r=>r.productId===p.id));if(draft){draft.refs=clone(p.refs);draft.plan=[];draft.missing=[];draft.positions={};}if(draft?.voice?.key){const file=await io('files','readonly',draft.voice.key);if(file){const key='voice:'+room.id+':'+uid();await io('files','readwrite',key,file);draft.voice.key=key;}else draft.voice.key=null;}room.photoDraft=draft;rooms.push(room);await persistRoom(room);await openRoom(room.id,'analysis');});};
const photoPayloadBeforeMigration=roomPayload;roomPayload=async function(room){const data=await photoPayloadBeforeMigration(room);if(room.mode!=='photos'||data.photoDraft)return data;const old=await workflowRecord(room.id);if(!old?.scenes?.length)return data;const draft={version:1,formula:'legacy',scriptMode:'manual',idea:old.brief?.idea||'',beats:old.scenes.map(s=>({id:s.id,name:'Cảnh cũ '+(s.index+1),type:'wide',seconds:s.end-s.start,text:(old.script||[]).filter(l=>l.start<s.end&&l.end>s.start).map(l=>l.newText||l.original||'').join(' '),fallbackType:null})),voice:{mode:'none',key:null,duration:0,wave:[]},plan:[],missing:[],positions:{},variant:0,placement:'library',migrationNotice:'Đã giữ lời và mốc cảnh cũ. Kiểu cảnh cần bạn rà lại; bản cũ vẫn được lưu.'};data.photoDraft=draft;room.photoDraft=clone(draft);await io('rooms','readwrite',room.id,room);return data;};
