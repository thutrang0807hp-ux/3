/* The Settings frame owns size, title, navigation and vertical scrolling. */
#settingsAccounts{container-type:inline-size;min-width:0}
#settingsAccounts .acctDashboard{padding:0;font-size:12px}
#settingsAccounts .acctHeading{align-items:center;flex-wrap:wrap;padding:0;gap:12px}
#settingsAccounts .acctStatusLine{align-items:flex-start;flex-direction:column}
#settingsAccounts .acctTopGrid{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
#settingsAccounts .acctGraph{height:350px}
#settingsAccounts .acctGraphNode{width:120px}
#settingsAccounts .acctGraphNode>small{font-size:9px}
#settingsAccounts .acctEngine{width:108px;height:98px}
#settingsAccounts .acctPanelTitle{flex-wrap:wrap}
#settingsAccounts .acctTableTools{flex-wrap:wrap;justify-content:flex-start}
#settingsAccounts .acctAccounts>.acctPanelTitle{flex-direction:column}
#settingsAccounts .acctPanelTitle small{font-size:10px}
#settingsAccounts .acctTabs{flex-direction:row;border:0;padding:3px;background:#1b1f26}
#settingsAccounts .acctTabs button{display:block;padding:7px 11px;color:#88919d;text-align:center}
#settingsAccounts .acctTabs button[aria-pressed=true]{color:#e5e9ee;background:#2a303a}
#settingsAccounts .acctEdit{max-width:650px}
#settingsAccounts .acctEditActions{display:flex;flex-wrap:wrap;gap:8px;margin-top:20px}
@container (max-width:780px){

}

}

const SFRecipes = (() => {
 const colors={neutral:'#858f9d',question:'#f0645a',solution:'#3cc8e0',benefit:'#a98bf5',trial:'#fa9b58',proof:'#f5b544',close:'#d4f53c'};
 const labels={neutral:'Chưa phân vai',question:'Hỏi / Vấn đề',solution:'Giải pháp',benefit:'Lợi ích',trial:'Dùng thử',proof:'Bằng chứng',close:'Chốt'};
 const shots={orbit:'Cận cảnh xoay',detail:'Chi tiết',use:'Trong bối cảnh dùng',hands:'Tay thao tác',problem:'Vấn đề',result:'Kết quả',wide:'Toàn cảnh',cta:'Kêu gọi mua'};
 const industries=['Chung','Đồ xe','Mỹ phẩm','Đồ bếp','Khác'];
 function seed(id,name,parts){let at=0;return{id,name,industry:'Chung',videoType:'Show sản phẩm',source:'starter',tips:'Thay lời theo thông tin thực tế của sản phẩm. Kiểm tra công dụng trước khi xuất.',beats:parts.map(([name,role,type,seconds,purpose])=>{const b={name,role,type,start:at,end:at+seconds,purpose,example:''};at+=seconds;return b;})};}
 const starters=[seed('problem-solution','Hỏi → Giải pháp → Lợi ích → Chốt',[
 ['Hỏi','question','problem',4,'Gợi nhu cầu của người xem'],['Giải pháp','solution','use',5,'Giới thiệu sản phẩm trong bối cảnh sử dụng'],['Lợi ích','benefit','detail',6,'Một điểm khác biệt đã được xác minh'],['Dùng thử','trial','hands',5,'Thao tác rõ ràng, đúng hướng dẫn'],['Chốt','close','cta',4,'Mời xem thêm thông tin']]),
 seed('honest-review','Review · trải nghiệm',[
 ['Mở đầu','question','wide',4,'Giới thiệu nhu cầu'],['Chi tiết','benefit','detail',5,'Chỉ rõ đặc điểm sản phẩm'],['Dùng thử','trial','hands',6,'Minh họa thao tác'],['Nhận xét','proof','result',5,'Chỉ dùng nhận xét có căn cứ'],['Kết','close','cta',4,'Lời mời tìm hiểu']]),
 seed('show-product','Show sản phẩm · không lời',[
 ['Toàn cảnh','solution','wide',4,'Giới thiệu bố cục'],['Xoay','benefit','orbit',5,'Thấy hình dáng thật'],['Chi tiết','trial','detail',5,'Xem chất liệu và nhãn'],['Kết','close','cta',4,'Chừa chỗ cho thông tin sản phẩm']])];
 function validate(raw){
  if(raw?.kind==='script'){
   if(typeof raw.body!=='string'||!raw.body.trim()||raw.body.length>120000)throw Error('Dán kịch bản không trống, tối đa 120.000 ký tự.');
   const base=raw.beats?.length?validate({...raw,kind:'formula'}):{...raw,beats:[],scriptBody:undefined};
   return{...base,kind:'script',body:raw.body,name:String(raw.name||'Kịch bản mới').trim().slice(0,160),id:String(raw.id||crypto.randomUUID()),industry:String(raw.industry||'Chung'),metrics:metrics(raw.metrics),tips:String(raw.tips||'').slice(0,3000)};
  }
  if(!raw||!String(raw.name||'').trim()||!Array.isArray(raw.beats)||!raw.beats.length||raw.beats.length>60)throw Error('Công thức cần tên và từ 1 đến 60 nhịp.');
  let at=0;const beats=raw.beats.map(b=>{const start=Number(b.start),end=Number(b.end);if(!Number.isFinite(start)||!Number.isFinite(end)||Math.abs(start-at)>.02||end-start<.2||end>600)throw Error('Mốc giây phải liên tục từ 0; mỗi nhịp ≥ 0,2s và tổng ≤ 600s.');if(!Object.hasOwn(shots,b.type)||!Object.hasOwn(colors,b.role))throw Error('Chọn kiểu cảnh và loại nhịp hợp lệ.');at=end;return{name:String(b.name||labels[b.role]).slice(0,120),role:b.role,type:b.type,start,end,purpose:String(b.purpose||'').slice(0,1000),example:String(b.example||'').slice(0,1000),angle:String(b.angle||'').slice(0,300),movement:String(b.movement||'').slice(0,300),onScreen:String(b.onScreen||'').slice(0,500)};});
  if(raw.scriptBody!==undefined&&(!Array.isArray(raw.scriptBody)||raw.scriptBody.length!==beats.length||raw.scriptBody.some(b=>!b||typeof b.text!=='string'||b.text.length>5000)))throw Error('Bản lời kịch bản không hợp lệ.');
  return{...raw,id:String(raw.id||crypto.randomUUID()),name:String(raw.name).trim().slice(0,160),industry:String(raw.industry||'Chung').slice(0,80),videoType:String(raw.videoType||'Show sản phẩm').slice(0,80),tips:String(raw.tips||'').slice(0,3000),beats,hook:String(raw.hook||'').slice(0,160),metrics:metrics(raw.metrics)};
 }
 function metrics(raw={}){const out={};for(const k of ['likes','ctr']){const n=raw?.[k];if(n===undefined||n===null||n==='')continue;const v=Number(n);if(!Number.isFinite(v)||v<0||(k==='ctr'&&v>100)||(k==='likes'&&!Number.isSafeInteger(v)))throw Error('Chỉ số phải không âm; CTR từ 0–100%, lượt thích là số nguyên.');out[k]=v;}return out;}
 function rank(r){return (Number(r.up||0)-Number(r.down||0))*100+(Math.min(100,Number(r.metrics?.ctr||0))/10)+(Math.min(10,Math.log10(1+Number(r.metrics?.likes||0))));}
 function strip(r){return{kind:r.kind||'formula',body:r.body,scriptParts:r.scriptParts,sourceScriptId:r.sourceScriptId,sourceBody:r.sourceBody,id:r.id,name:r.name,industry:r.industry,videoType:r.videoType,source:r.source,sourceName:r.sourceName,scriptBody:r.scriptBody,hook:r.hook,beats:r.beats,tips:r.tips};}

 return{colors,labels,shots,industries,starters,validate,strip,duration,bar,metrics,rank};
})();

// Shared request identity, negative receipts and tolerant JSON. No dispatch here.
(function(){
function jobWireId(job){const id=job.id||job.request_id;return job.source==='gemini_chat'&&!id?.startsWith('gchat-')?'gchat-'+id:id;}
function jobPostFailure(job,error){const d=error.detail,id=jobWireId(job);job.error=error.message;job.updatedAt=Date.now();if(d?.submitted===false&&d.request_id===id&&typeof d.store_id==='string'){job.state='not_submitted';job.store_id=d.store_id;job.negativeReceipt=structuredClone(d);}else job.state=d?.code==='INVALID_JSON'?'invalid':'unknown';}
function jobReadRecord(job,record){if(job.store_id&&record.store_id&&job.store_id!==record.store_id){job.state='unknown';throw Error('Kho dữ liệu động cơ đã đổi; chưa thể đối soát lượt cũ.');}if(record.store_id)job.store_id=record.store_id;job.state=record.state;job.updatedAt=Date.now();if(record.state==='not_submitted'&&record.submitted===false)job.negativeReceipt=structuredClone(record);}
function jobReadError(job,error){job.error=error.message;job.updatedAt=Date.now();if(error.status===404){job.state='missing';job.error='Không tìm thấy ở động cơ hiện tại. Kiểm tra đúng thư mục dữ liệu/lịch sử dịch vụ trước khi bỏ lượt; chưa kết luận là chưa gửi.';}}
function workflowJsonObject(text){if(typeof text!=='string'||text.length>500000)throw Error('JSON quá lớn hoặc không hợp lệ.');try{const data=JSON.parse(text);if(data&&typeof data==='object'&&!Array.isArray(data))return data;}catch{}const found=[];let start=-1,depth=0,quoted=false,escape=false;for(let i=0;i<text.length;i++){const c=text[i];if(start<0){if(c==='{'){start=i;depth=1;quoted=false;escape=false;}continue;}if(quoted){if(escape)escape=false;else if(c==='\\')escape=true;else if(c==='"')quoted=false;}else if(c==='"')quoted=true;else if(c==='{')depth++;else if(c==='}'&&!--depth){try{const value=JSON.parse(text.slice(start,i+1));if(value&&typeof value==='object'&&!Array.isArray(value))found.push(value);}catch{}start=-1;if(found.length>1)throw Error('Có nhiều khối JSON; chọn/sửa rõ kết quả trước khi áp dụng.');}}if(found.length!==1||start>=0)throw Error('JSON thiếu hoặc chưa hoàn chỉnh. Có thể sửa JSON đã nhận, không tự gửi lại.');return found[0];}
const pendingStates=['prepared','preparing','submitted','queued','running','downloading','unknown','missing','invalid','done'];
async function persistIntent(job,save,store){
 if(job.state!=='prepared')throw Error('Chỉ ghi ý định trước khi gửi lượt mới.');
 try{await save();if(!store?.managed)return;
  for(let attempt=0;attempt<6;attempt++){
   if(!store.state.active)throw Error('Kho máy chưa sẵn sàng; chưa gửi AI.');
   try{await store.checkpoint();if(!store.state.active)throw Error('Kho máy chưa xác nhận lưu.');if(!store.state.dirty)return;}
   catch(error){if(!error.message.includes('Dữ liệu đang thay đổi')||attempt===5)throw error;}
   if(attempt<5)await new Promise(resolve=>setTimeout(resolve,80));
  }throw Error('Dữ liệu chưa ổn định để lưu ý định; chưa gửi AI.');
 }catch(error){job.state='not_submitted';job.error=error.message;try{await save();}catch{}throw error;}
}
function chooseMusic(state,rows,mode,selected,key){
 if(mode==='off')return null;
 let song;if(mode==='random'){
  song=state.musicChoice?rows.find(r=>r[key]===state.musicChoice):rows[Math.floor(Math.random()*rows.length)];
  if(state.musicChoice&&!song)throw Error('Bài nhạc đã chốt không còn tệp. Chọn lại chế độ nhạc hoặc chọn một bài khác.');
 }else song=rows.find(r=>r[key]===selected);
 if(!song)throw Error('Chọn bài nhạc còn tệp hoặc tắt nhạc.');
 if(mode==='random')state.musicChoice=song[key];return song;
}
window.SFProviderReceipts={jobWireId,jobPostFailure,jobReadRecord,jobReadError,workflowJsonObject,pendingStates,persistIntent,chooseMusic};
})();

// IndexedDB remains a recoverable working cache. Verified SQLite checkpoints own the durable library.
window.SceneForgeStorage=(()=>{
 const enabled=['localhost','127.0.0.1'].includes(location.hostname)&&new URLSearchParams(location.search).get('demo')!=='1';
 const schemas={'sceneforge-app-shell':['products','rooms','jobs','files','prefs','notifications'],'sceneforge-workflows':['projects'],'sceneforge-editor-local':['drafts']};
 let lease=null,editing=false;
 let diskRoot='',libraryId='',comparing=false;
 let managed=false,revision=0,epoch=0,suppress=0,busy=null,timer=null,active=false,error='',lastSaved=0;
 const records=new Map(),dirty=new Set(),blobCache=new Map(),urlCache=new Map();let fullScan=true;
 const identity=(d,s,k)=>JSON.stringify([d,s,k]);
 function announce(){dispatchEvent(new CustomEvent('sceneforge:storage-status'));}
 async function api(path,body,method){const res=await fetch('/local-api/library/'+path,{method:method||(body===undefined?'GET':'POST'),headers:body===undefined?{}:{'Content-Type':'application/json','X-SceneForge-Local':'1'},body:body===undefined?undefined:JSON.stringify(body)});if(!res.ok){let data;try{data=await res.json();}catch{}const e=Error(data?.detail||'Không đọc được kho trên máy.');e.status=res.status;throw e;}return res.json();}
 function change(d,s,k){if(suppress||!schemas[d]?.includes(s))return;dirty.add(identity(d,s,k));epoch++;localStorage.setItem('sceneforge-library-dirty','1');if(active){clearTimeout(timer);timer=setTimeout(()=>checkpoint().catch(()=>{}),1800);}}

async function extractReferenceRecipe(roomId){if(recipeWork.has(roomId)){g6RecipeReplay.add(roomId);return;}recipeWork.add(roomId);try{const room=roomFor(roomId);if(!room||room.mode==='photos'||room.trashedAt)return;const w=await workflowRecord(roomId);if(!w?.scenes?.length||w.analysis?.pipeline6?.running||w.analysis?.status==='scanning')return;const lib=await recipeLibrary(),id='source:'+roomId,existing=lib.items.find(r=>r.id===id),signature=JSON.stringify([w.scenes.map(s=>[s.start,s.end]),w.analysis.semantic?.recipe||null]);if(lib.deleted.includes(id)||existing?.userEdited||lib.sources[roomId]?.signature===signature)return;
 let raw=w.analysis.semantic?.recipe;if(!raw){const scenes=w.scenes.slice(0,60);let at=0;raw={name:room.name+' · khung sườn',industry:'Chung',videoType:'Từ video mẫu',tips:'Khung nhịp rút từ mốc cảnh trên máy, chưa suy ra công dụng hay lời quảng cáo. Thay lời theo sản phẩm thực tế.',beats:scenes.map((s,i)=>{const seconds=s.end-s.start,role=i===0?'question':i===scenes.length-1?'close':'benefit',b={name:'Cảnh '+(i+1),role,type:s.hasPerson?'use':'detail',start:at,end:at+seconds,purpose:i===0?'Nhịp mở đầu':i===scenes.length-1?'Nhịp kết':'Nhịp nội dung',example:''};at+=seconds;return b;})};}
 await putRecipe({...raw,metrics:existing?.metrics||{},id,source:'reference',sourceRoomId:roomId,sourceName:room.name,sourcePoster:room.poster,createdAt:existing?.createdAt||Date.now()});lib.sources[roomId]={state:'done',signature,note:'Lưu khung sườn từ mốc đã có, không gọi thêm AI.'};await saveRecipeLibrary();room.referenceRecipeId=id;await io('rooms','readwrite',room.id,room);
 }catch(e){const lib=await recipeLibrary();lib.sources[roomId]={state:'failed',note:e.message};await saveRecipeLibrary();}finally{recipeWork.delete(roomId);if(g6RecipeReplay.delete(roomId))queueMicrotask(()=>extractReferenceRecipe(roomId));}}
const workflowBeforeRecipes=onWorkflowState;
onWorkflowState=async function(data){await workflowBeforeRecipes(data);if(data.mode!=='photos'&&!data.scanning)extractReferenceRecipe(data.roomId).catch(()=>{});};

const cardBeforeRecipes=card;
card=function(room,compact=false){
 const t=document.createElement('template');t.innerHTML=cardBeforeRecipes(room,compact);
 if(!compact){
  const cover=t.content.querySelector('.cover'),info=t.content.querySelector('.cardInfo');if(cover&&info)cover.append(info);const hook=t.content.querySelector('.coverTitle');if(hook&&room.hook)hook.textContent=room.hook;
  if(room.stage==='review'){const bottom=t.content.querySelector('.cardBottom');if(bottom?.querySelector('button')){for(const node of [...bottom.childNodes])if(node.nodeType===Node.TEXT_NODE)node.remove();}}
  const running=jobs.find(j=>j.roomId===room.id&&j.status==='running');
  if(running&&cover){const badge=document.createElement('span');badge.className='runningBadge';badge.textContent=(laneOf(running)==='muse'?'Muse':'Flow')+' đang chạy';cover.prepend(badge);}
 }
 if(room.stage==='exported'&&room.mode==='photos'&&room.photoDraft?.formula){
  const target=t.content.querySelector('.cardBottom,.compactCard>div'),row=document.createElement('div');row.className='recipeVotes';row.innerHTML=[['1','👍 Ra đơn'],['-1','👎 Không ăn thua']].map(([v,n])=>'<button data-recipe-vote="'+room.id+':'+v+'" aria-pressed="'+(room.recipeVote===Number(v))+'">'+n+'</button>').join('');target?.append(row);
 }
 return t.innerHTML;
};
$('#board').addEventListener('click',async e=>{
 const b=e.target.closest('[data-recipe-vote]');if(!b)return;
 e.stopPropagation();const[id,v]=b.dataset.recipeVote.split(':'),r=roomFor(id);if(!r)return;
 r.recipeVote=r.recipeVote===Number(v)?null:Number(v);const lib=await recipeLibrary();lib.feedback??={};lib.feedback[r.id]={formula:r.photoDraft.formula,vote:r.recipeVote};await saveRecipeLibrary();await persistRoom(r);toast('Đã lưu đánh giá cho công thức của video này.');
},true);

// Source words are read only on demand for similarity checks, never copied into a recipe/draft.
window.SceneForgeApp.photoBridge.recipeSourceText=async id=>{const lib=await recipeLibrary(),r=lib.items.find(x=>x.id===id);if(!r?.sourceRoomId)return '';const w=await workflowRecord(r.sourceRoomId);return (w?.script||[]).map(b=>b.original||'').join(' ').slice(0,100000);};

async function runCheckFont(){const button=$('#runFontCheck');button.disabled=true;try{const response=await fetch('./fonts/SceneForgeSans.ttf');if(!response.ok)throw Error('Chưa tải được font nhúng.');const bytes=await response.arrayBuffer(),hash=[...new Uint8Array(await crypto.subtle.digest('SHA-256',bytes))].map(b=>b.toString(16).padStart(2,'0')).join('');if(hash!==checkFont.sha256)throw Error('Font không khớp bản được kiểm tra dấu tiếng Việt.');const face=await new FontFace('SceneForgeCheckFont',bytes).load();document.fonts.add(face);await document.fonts.load('32px SceneForgeCheckFont',checkFont.sample);if(!checkFont.coverage||!document.fonts.check('32px SceneForgeCheckFont',checkFont.sample))throw Error('Chưa xác nhận được font có đủ mẫu dấu.');checkState.font={state:'passed',at:Date.now()/1000,sha256:hash,note:'Font nhúng tải đúng SHA-256, có ký tự mẫu trong cmap và được trình duyệt nạp. Chưa chứng nhận các font thay thế trên máy khác.'};}catch(e){checkState.font={state:'failed',at:Date.now()/1000,note:e.message};}finally{await saveCheckState();if($('#checksRoot'))paintMachineChecks();}}
async function runNotificationCheck(){if(notificationTestTimer)return;if(!window.Notification){toast('Trình duyệt không hỗ trợ Notification API.');return;}let ctx;try{const permission=await Notification.requestPermission();if(permission!=='granted'){toast('Chưa được cấp quyền thông báo; chưa chạy phép thử.');return;}const AC=window.AudioContext||window.webkitAudioContext;if(AC){ctx=new AC();await ctx.resume();}const scheduled=Date.now();notificationTestTimer=setTimeout(async()=>{notificationTestTimer=null;let created=false,sound=false,message='';try{const n=new Notification('SceneForge · thử thông báo',{body:'Bạn có thấy thông báo và nghe tiếng không? Quay lại app để ghi kết quả D4.',tag:'sceneforge-machine-check'});n.onclick=()=>{window.focus();n.close();};created=true;if(ctx?.state==='running'){const o=ctx.createOscillator(),gain=ctx.createGain();o.connect(gain);gain.connect(ctx.destination);o.frequency.value=660;gain.gain.setValueAtTime(.1,ctx.currentTime);gain.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+.4);o.start();o.stop(ctx.currentTime+.42);o.onended=()=>ctx.close();sound=true;}else if(ctx){await ctx.close();}}catch(e){message=e.message;await ctx?.close();}checkState.notification={at:Date.now()/1000,created,soundStarted:sound,documentHidden:document.hidden,elapsed_seconds:(Date.now()-scheduled)/1000,note:message||('Lúc thử: '+(document.hidden?'tab ở nền':'tab còn hiện')+'. API gọi '+(created?'thành công':'chưa thành công')+'; vẫn cần bạn xác nhận đã nhìn/nghe thấy ở D4.')};await saveCheckState();if($('#checksRoot'))paintMachineChecks();},8000);paintMachineChecks();toast('Hãy thu nhỏ trình duyệt, chờ khoảng 8 giây rồi quay lại ghi kết quả D4.');}catch(e){await ctx?.close();toast(e.message);}}
function openCheckCase(id){const c=checkSheet.rows.find(c=>c.id===id);if(!c)return;const result=checkState.manual[id];modal(c.id+' · '+c.title,'<div class="checkCaseDetail"><p><b>Cách thử</b><br>'+esc(c.how)+'</p><p><b>Đạt khi</b><br>'+esc(c.acceptance)+'</p><p><b>Nếu không đạt</b><br>'+esc(c.fallback)+'</p><p class="g5Muted">Kết quả dưới đây do bạn tự ghi nhận sau khi thử. App không xác minh mặt/nhãn, số credit hoặc cảm nhận giọng nói thay bạn.</p><label class="field">Kết quả<select id="manualCheckStatus"><option value="untried">Chưa thử</option><option value="pass">Đạt</option><option value="fail">Không đạt</option></select></label><label class="field">Số đo / bằng chứng<textarea id="manualCheckNote" rows="4" maxlength="4000" placeholder="Ví dụ: máy thử, thời gian, số credit trước/sau, lỗi nhìn thấy…">'+esc(result?.note||'')+'</textarea></label><p id="manualCheckError" role="alert"></p></div>','<button id="backToChecks">Quay lại</button><button id="saveManualCheck" class="primary">Lưu kết quả tự ghi nhận</button>');$('#shellDialog').classList.add('checksDialog');$('#manualCheckStatus').value=result?.status||'untried';$('#backToChecks').onclick=paintMachineChecks;$('#saveManualCheck').onclick=async()=>{const status=$('#manualCheckStatus').value,note=$('#manualCheckNote').value.trim();if(status!=='untried'&&note.length<10){$('#manualCheckError').textContent='Thêm số đo hoặc bằng chứng ít nhất 10 ký tự trước khi ghi Đạt/Không đạt.';return;}const safe=note.replace(/AIza[\w-]{15,}/g,'[ẨN KEY]').replace(/(Bearer\s+)[^\s]+/gi,'$1[ẨN]').replace(/((?:cookie|api[_-]?key|password|token)\s*[:=]\s*)[^\n]+/gi,'$1[ẨN]');checkState.manual[id]={status,note:safe,at:Date.now()/1000,source:'user-reported',verified_by_app:false};await saveCheckState();paintMachineChecks();};}

// Approval itself is the user's consent to retire earlier generations in these slots.
// Flush all writers before the backend changes canonical records, then replace caches.
SceneForgeStorageActions.approveVersions=async function(id,targets){
 if(storageMutationBusy)throw Error('Đợi lượt lưu/dọn hiện tại.');
 if(!SceneForgeStorage.managed||!SceneForgeStorage.state.active)throw Error('Cần kho máy đang kết nối để xóa file cũ.');
 if(currentRoom?.id!==id||activeWorkers.size||pendingVersionImports.has(id))throw Error('Đợi việc nhập/phân tích hiện tại xong.');
 storageMutationBusy=true;const wasInert=document.body.inert;document.body.inert=true;let sent=false;
 try{
  await flushFrames();
  for(let attempt=0;attempt<6;attempt++){
   await new Promise(resolve=>setTimeout(resolve,80));
   try{await SceneForgeStorage.checkpoint();break;}catch(error){if(attempt===5||!error.message.includes('Dữ liệu đang thay đổi'))throw error;}
  }
  // A hidden editor must not later write its stale library of alternative versions back.
  $('#standaloneEditorDemo')?.remove();
  const result=await SceneForgeStorage.edit(async()=>{
   const revision=SceneForgeStorage.state.revision;
   const mutationId=crypto.randomUUID();await SceneForgeStorage.markMutation(mutationId);sent=true;
   return SceneForgeStorage.api('lifecycle/approve',{room_id:id,targets,revision,confirm:true,mutation_id:mutationId});
  });
  const decoded=await SceneForgeStorage.hydrate(result.snapshot);
  SceneForgeStorage.clearMediaCache();
  const workflow=decoded.find(r=>r.db==='sceneforge-workflows'&&r.key===id)?.value;
  const photoDraft=decoded.find(r=>r.db==='sceneforge-app-shell'&&r.store==='rooms'&&r.key===id)?.value?.photoDraft;
  if(!workflow&&!photoDraft)throw Error('Chưa nạp lại được bản duyệt; mở lại phòng.');
  if(photoDraft&&roomFor(id))roomFor(id).photoDraft=structuredClone(photoDraft);
  return {...result,workflow,photoDraft};
 }catch(error){
  if(sent&&error.status===409&&error.message.startsWith('Đang có tác vụ')){localStorage.removeItem('sceneforge-library-intent');sent=false;}
  if(sent){SceneForgeStorage.pause();error.message+=' Mở lại app để nạp trạng thái kho máy; không ghi đè dữ liệu cũ.';}
  throw error;
 }finally{document.body.inert=wasInert;storageMutationBusy=false;}
};

async function homeWriteRooms(ids,kind,target){
 if(homeMutation)throw Error('Đợi thao tác hiện tại hoàn tất.');homeMutation=true;
 try{if(SceneForgeStorage.managed&&!SceneForgeStorage.state.active)throw Error('Kho dữ liệu chưa sẵn sàng; xử lý đồng bộ kho trước.');await flushFrames();const list=ids.map(id=>roomFor(id));if(list.some(r=>!r))throw Error('Danh sách video đã đổi. Chọn lại.');
 if(kind!=='restore'){
  const pending=new Set(['running','submitted','queued','unknown','preparing','downloading']);
  for(const r of list){if(activeWorkers.has(r.id)||jobs.some(j=>j.roomId===r.id&&!['done','error','failed','cancelled'].includes(j.status)))throw Error('Video còn việc đang chạy/chờ hoặc chưa rõ kết quả. Xử lý hàng chờ trước.');const w=await workflowRecord(r.id);for(const data of [w,r.photoDraft])for(const key of ['cloudJobs','flowJobs','museJobs','geminiJobs','referencePromptJobs'])if(data?.[key]?.some(j=>pending.has(j.state||j.status)))throw Error('Video còn lượt AI đang xử lý/chưa rõ kết quả. Kiểm tra lượt đã gửi trước.');}
  if(SceneForgeStorage.managed){const info=await SceneForgeStorage.api('lifecycle/status');if(info.jobs?.some(j=>ids.includes(j.room_id)&&pending.has(j.state)))throw Error('Bộ chạy còn công việc đang xử lý cho video đã chọn.');}
  if(currentView==='overview'&&currentRoom&&ids.includes(currentRoom.id)){$('#roomFrames').replaceChildren();frameRoom=null;currentRoom=null;}
 }
 for(const r of list){if(kind!=='restore')archiveTaskGuard(r);else if(!r.homeTrashedAt||!r.trashedAt||productFor(r.productId)?.trashedAt)throw Error('Khôi phục sản phẩm trước.');}
 if(kind==='move'&&(!target||target.archived||target.trashedAt))throw Error('Chọn sản phẩm đang hoạt động.');
 if(frameRoom&&ids.includes(frameRoom)){$('#roomFrames').replaceChildren();frameRoom=null;currentRoom=null;}
 const at=Date.now(),next=list.map(r=>{const n=clone(r);n.updatedAt=at;if(kind==='move'){n.folderProductId??=n.productId;n.folderProductSlug??=productFor(n.productId)?.slug;n.productId=target.id;}if(kind==='archive'){n.archived=true;n.archivedAt=at;}if(kind==='trash'){n.trashedAt=at;n.homeTrashedAt=at;}if(kind==='restore'){delete n.trashedAt;delete n.homeTrashedAt;}return n;});
 await new Promise((resolve,reject)=>{const tx=db.transaction('rooms','readwrite');for(const r of next)tx.objectStore('rooms').put(r,r.id);tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error);tx.onabort=()=>reject(tx.error||Error('Chưa lưu thay đổi.'));});for(const n of next)Object.assign(roomFor(n.id),n);if(kind==='restore')for(const n of next){delete roomFor(n.id).trashedAt;delete roomFor(n.id).homeTrashedAt;}
 if(ids.includes(prefs.lastRoom)&&['trash','archive'].includes(kind))prefs.lastRoom=rooms.find(r=>!r.trashedAt&&!archivedRoom(r)&&!productFor(r.productId)?.trashedAt)?.id||null;

function monitorExport(rows){const cell=value=>{let s=String(value??'');if(/^[\s]*[=+@-]/.test(s)||/^[\t\r]/.test(s))s="'"+s;return '"'+s.replaceAll('"','""')+'"';};const data=[['Thời gian','Nguồn','Công việc','Video','Cảnh','Tài khoản','Trạng thái','Chi phí','Đơn vị','Tạo lại'],...rows.map(r=>[new Date(r.at*1000).toISOString(),monitorLabels[r.source]||r.source,r.kind,r.room_name,r.scene_id,r.account_name,r.state,r.cost,r.cost_unit,r.is_regeneration?'Có':'Chưa xác định'])].map(row=>row.map(cell).join(',')).join('\r\n');download('SceneForge-ChiPhi-'+new Date().toISOString().slice(0,10)+'.csv',new Blob(['\ufeff'+data],{type:'text/csv;charset=utf-8'}));}

document.addEventListener('click',async e=>{if(!e.target.closest('.kvShell'))return;if(v4Saving){e.preventDefault();e.stopImmediatePropagation();return;}const action=e.target.closest('[data-v4]'),kind=e.target.closest('[data-v4-kind]'),tab=e.target.closest('[data-v4-tab]'),product=e.target.closest('[data-v4-product]');if(!action&&!kind&&!tab&&!product){if(v4Editing&&e.target.closest('[data-kv-filter],[data-g6-recipe],[data-kv-tab],[data-kv]')){v4DraftChanged();v4Editing=null;}return;}e.preventDefault();e.stopImmediatePropagation();try{if(product){product.classList.toggle('selected');v4Editing.productRejected??=[];if(!product.classList.contains('selected'))v4Editing.productRejected.push(product.dataset.v4Product);else v4Editing.productRejected=v4Editing.productRejected.filter(id=>id!==product.dataset.v4Product);v4DraftChanged();return;}if(kind){v4State().kind=kind.dataset.v4Kind;v4Editing=null;kv.selected=null;await savePrefs();return kvDraw();}if(tab){kv.tab=tab.dataset.v4Tab;return kvDraw();}const a=action.dataset.v4;if(['new-script','new-formula','drafts'].includes(a))g6RecipePage.querySelector('.kvAdd').open=false;const lib=await recipeLibrary(),r=lib.items.find(x=>x.id===(action.dataset.id||kv.selected));if(a==='drafts'){modal('Bản nháp trên máy',Object.values(prefs.recipeScriptDrafts||{}).map(d=>'<button class="choice" data-v4-resume="'+esc(d.id)+'">'+esc(d.name||SFScript.title(d.body))+'</button>').join(''));for(const b of $$('[data-v4-resume]'))b.onclick=()=>{v4Editing=clone(prefs.recipeScriptDrafts[b.dataset.v4Resume]);$('#shellDialog').close();v4RenderEditor();};return;}if(a==='new-script')return v4StartEdit();if(a==='edit-script')return v4StartEdit(r);if(a==='save-script')return v4Save();if(a==='close-editor'){v4DraftChanged();v4Editing=null;return kvDraw();}if(a==='overview'){kv.selected=null;return kvDraw();}if(a==='new-formula'){v4Editing=null;krEdit({id:uid(),kind:'formula',name:'Công thức mới',source:'manual',industry:'Chung',productIds:[],beats:[{name:'Nhịp 1',role:'neutral',type:'wide',start:0,end:4,purpose:'',example:''}]});return;}if(a==='split-local')return await v4Split(r);if(a==='split-ai')return await v4Split(r,true);if(a==='extract')return await v4Extract(r);if(a==='use-script')return await kvUse(r);if(a==='keywords')return await v4Keywords();if(a==='accept-topic')return await v4Accept([r.id]);if(a==='accept-topics')return await v4Accept(lib.items.filter(r=>kvMatch(lib,r)).map(r=>r.id));if(a==='ai-topics')return await v4AITopics();}catch(error){toast(error.message);}},true);

</script><script id="reference-design-bridge">if(window.SceneForgeApp?.recipes)SceneForgeApp.recipes.referenceStatus=async roomId=>{const lib=await recipeLibrary();return {roomId,...lib.sources?.[roomId]};};if(window.SceneForgeApp)SceneForgeApp.recentPeople=async roomId=>{const found=[],seen=new Set();for(const room of rooms.filter(r=>r.id!==roomId&&!r.trashedAt).slice(-20).reverse()){const w=await workflowRecord(room.id);for(const image of w?.refs?.person?.images||[]){if(found.length>=6)break;if(!image.image||seen.has(image.image))continue;seen.add(image.image);found.push({image:image.image,name:image.name||room.name});}}return found;};</script><script id="photo-input-bridge">/* Room reference imports are copies. Library writes merge; they never replace. */
Object.assign(SceneForgeApp.photoBridge,{
 flushScriptState:async()=>v4Flush(),
 listScriptLibrary:async()=>{const lib=await recipeLibrary();return lib.items.filter(r=>r.status!=='retired').map(r=>{const votes=Object.values(lib.feedback||{}).filter(v=>v.formula===r.id);return{...clone(r),up:votes.filter(v=>v.vote===1).length,down:votes.filter(v=>v.vote===-1).length};});},
 readProductRefs:async id=>{const p=productFor(id);if(!p)throw Error('Sản phẩm không còn tồn tại.');return clone(p.refs||{});},
 mergeProductRefs:async(id,refs)=>{
  const p=productFor(id);if(!p)throw Error('Sản phẩm không còn tồn tại.');
  const next=clone(p.refs||{});let added=0;
  for(const k of ['product','person','background']){
   next[k]??={images:[],description:''};next[k].images??=[];
   if(k==='person'){next[k].people??=[];for(const person of refs[k]?.people||[])if(!next[k].people.some(x=>x.id===person.id))next[k].people.push(clone(person));}
   for(const image of refs[k]?.images||[]){
    if(next[k].images.some(x=>(x.hash&&image.hash&&x.hash===image.hash)||(x.key&&x.key===image.key)||(x.image&&x.image===image.image)))continue;
    next[k].images.push(clone(image));added++;
   }
  }
  await io('products','readwrite',p.id,{...p,refs:next});p.refs=next;render();return{added};
 },
 recordScriptUse:async(id,roomId,snapshot)=>{
  const lib=await recipeLibrary(),r=lib.items.find(r=>r.id===id),v=roomFor(roomId);
  if(!r||!v)throw Error('Kịch bản hoặc phòng không còn tồn tại.');
  lib.usage??={};lib.usage[roomId+':'+id]={roomId,formula:id,at:Date.now(),sourceSnapshot:clone(snapshot)};await saveRecipeLibrary();
 }
