function mediaUrl(key){if(!key)return'';if(key==='demo')return SAMPLE.video;if(urls.has(key))return urls.get(key);const blob=assets.get(key);if(!blob)return'';const url=URL.createObjectURL(blob);urls.set(key,url);return url;}

async function uploadSource(file){if(!file)return;if(busy){toast('Dừng lượt phân tích hiện tại trước khi thay video.');return;}if(file.size>500*1024*1024){toast('Video tối đa 500 MB.');return;}const temporary=URL.createObjectURL(file);try{const info=await useVideo(temporary,async v=>{if(!Number.isFinite(v.duration)||v.duration<=0||v.duration>600)throw Error('Video cần có thời lượng từ 0 đến 10 phút.');if(Math.abs(v.videoWidth/v.videoHeight-9/16)>.025)throw Error('Chỉ nhận video dọc 9:16. Hãy đổi khung trước khi nhập.');await seekFrame(v,Math.min(.04,v.duration/2));return{name:file.name,duration:v.duration,width:v.videoWidth,height:v.videoHeight,poster:capture(v)};});if(project.source&&project.scenes.length){const accepted=confirm('Thay video sẽ tạo dự án mới. Dự án hiện tại được giữ trong danh sách Dự án.');if(!accepted)return;await storeProject();assets.clear();urls.forEach(u=>URL.revokeObjectURL(u));urls.clear();project=blankProject();}info.asset=putAsset(file);project.source=info;project.demo=false;project.name=file.name.replace(/\.[^.]+$/,'');project.scenes=[];project.script=[];project.analysis={status:'uploaded',cuts:[],method:null};closeDetails();save();render();fit(false);toast('Đã thêm video. Bấm Phân tích để dò cảnh và trích khung trên máy.');}catch(e){toast(e.message);}finally{URL.revokeObjectURL(temporary);$('#sourceFile').value='';}}
function groupCuts(cuts){const shots=cuts.slice(0,-1).map((start,i)=>({start,end:cuts[i+1],cutIds:[i]})),out=[];for(const shot of shots){const prev=out.at(-1);if(prev&&prev.end-prev.start<6&&shot.end-prev.start<=8){prev.end=shot.end;prev.cutIds.push(...shot.cutIds);}else out.push({...shot});}return out;}
async function analyzeSource(){if(busy)return;if(!project.source){$('#sourceFile').click();return;}if(project.scenes.length&&!confirm('Dò lại cảnh sẽ thay cấu trúc cảnh. Bản prompt hiện tại có thể lưu JSON trước. Tiếp tục?'))return;const url=mediaUrl(project.source.asset);if(!url){toast('Cần chọn lại tệp video nguồn.');return;}busy=true;cancelled=false;project.analysis.status='scanning';render();let result;try{result=await useVideo(url,async v=>{const cuts=[0],step=Math.max(.4,v.duration/600);let prev=null,prevTime=.01;for(let t=.01;t<v.duration-.01;t+=step){if(cancelled)throw Error('Đã dừng phân tích.');await seekFrame(v,t);const sig=signature(v);if(prev){const delta=distance(prev,sig);if(delta.pixels>35&&delta.hist>.23&&t-cuts.at(-1)>.5){let lo=prevTime,hi=t;for(let n=0;n<5;n++){const mid=(lo+hi)/2;await seekFrame(v,mid);const d=distance(prev,signature(v));if(d.pixels>25&&d.hist>.15)hi=mid;else lo=mid;}const cut=Number(hi.toFixed(3));if(cut>cuts.at(-1)+.2&&cut<v.duration-.2)cuts.push(cut);}}prev=sig;prevTime=t;if(Math.floor(t/step)%10===0){$('#saveStatus').textContent='Đang đọc khung '+Math.round(t/v.duration*100)+'%';await new Promise(r=>requestAnimationFrame(r));}}
cuts.push(v.duration);const groups=groupCuts(cuts),scenes=[];for(const [i,g]of groups.entries()){if(cancelled)throw Error('Đã dừng phân tích.');const margin=Math.min(.04,(g.end-g.start)/5),times=[g.start+margin,(g.start+g.end)/2,g.end-margin],thumbs=[];for(const t of times){await seekFrame(v,t);thumbs.push(capture(v));}const s=sceneRecord(g.start,g.end,i,thumbs);s.cutIds=g.cutIds;s.evidence=[];for(const cutId of g.cutIds){const at=(cuts[cutId]+cuts[cutId+1])/2;await seekFrame(v,at);s.evidence.push({at,image:capture(v,120)});}s.visual.vi.composition='Video dọc 9:16. Điền cỡ cảnh, vị trí nhân vật và sản phẩm sau khi đối chiếu các khung nguồn.';s.visual.en.composition='Portrait 9:16. Complete the observed shot size and subject/product positions after reviewing source evidence.';s.promptFrame.vi='Giữ bố cục và tư thế của khung gốc; chỉ thay các thành phần có tham chiếu được nối.';s.promptFrame.en='Preserve the original composition, pose, perspective, scale and lighting. Replace only elements explicitly connected to reference images.';scenes.push(s);}return{cuts,scenes};});project.scenes=result.scenes;project.analysis={status:'done',cuts:result.cuts,method:'Dò hình cục bộ · cần rà lại mốc'};project.merge.order=project.scenes.map(s=>s.id);selected=0;save();toast('Đã dò '+(result.cuts.length-1)+' đoạn → '+result.scenes.length+' cảnh. Chưa chạy AI mô tả hoặc chép lời.');}catch(e){project.analysis.status=project.scenes.length?'done':'uploaded';toast(e.message);}finally{busy=false;render();}}
function scriptDialog(){const voices=('speechSynthesis'in window)?speechSynthesis.getVoices().filter(v=>v.lang.toLowerCase().startsWith('vi')):[];modal('Kịch bản → Giọng đọc','<p>Lời theo mốc giây của video gốc · chỉ sửa lời mới. Nhập SRT/VTT để bắt đầu; chưa có AI chép lời, dịch hoặc viết lại.</p><div class="scriptToolbar"><button data-action="script-import">↥ Nhập SRT / VTT</button><button data-action="add-line">＋ Thêm câu</button><button data-action="voice-import">↥ Nhập giọng đọc</button><button data-action="listen">▸ Nghe thử trình duyệt</button><select id="browserVoice" aria-label="Giọng đọc trình duyệt"><option value="">'+(voices.length?'Chọn giọng tiếng Việt':'Chưa thấy giọng tiếng Việt')+'</option>'+voices.map(v=>'<option value="'+esc(v.name)+'" '+(project.voice.name===v.name?'selected':'')+'>'+esc(v.name)+'</option>').join('')+'</select><label>Tốc độ <select data-voice-speed>'+[.8,1,1.1,1.2,1.5].map(v=>'<option value="'+v+'" '+(project.voice.speed===v?'selected':'')+'>'+v+'×</option>').join('')+'</select></label></div><div style="overflow:auto"><table class="scriptGrid"><thead><tr><th>Mốc giây</th><th>Lời gốc</th><th>Dịch sát</th><th>Lời mới · sửa tại đây</th></tr></thead><tbody>'+project.script.map(l=>'<tr><td><b>'+stamp(l.start)+'–'+stamp(l.end)+'</b><small style="display:block;color:#9ca5b2">'+project.scenes.filter(s=>l.start<s.end&&l.end>s.start).map(s=>'Cảnh '+(s.index+1)).join(' → ')+'</small><button class="plain" data-remove-line="'+l.id+'" style="margin-top:8px">Xóa câu</button></td><td>'+esc(l.original||'Chưa có bản gốc')+'</td><td>'+esc(l.translation||'Chưa dịch')+'</td><td><textarea data-line="'+l.id+'">'+esc(l.newText)+'</textarea><div class="timing">Chỗ '+(l.end-l.start).toFixed(1)+'s · '+(l.measuredSec?'Tệp giọng: '+l.measuredSec.toFixed(1)+'s':'Chưa đo bằng giọng đã chọn')+'</div><label class="face"><input type="checkbox" data-line-face="'+l.id+'" '+(l.faceTalking?'checked':'')+'> Thấy mặt nói → dùng câu này cho hình miệng</label></td></tr>').join('')+'</tbody></table></div>'+(project.script.length?'':'<div class="detailNotice">Chưa có lời thoại. Không tự điền lời bán hàng khi chưa biết nội dung nguồn và sản phẩm.</div>')+'<div class="voiceLanes"><div class="voiceLane">'+project.script.map((l,i)=>'<span style="width:'+((l.end-l.start)/(project.source?.duration||1)*100)+'%">Câu '+(i+1)+'</span>').join('')+'</div><div class="voiceLane scenes">'+project.scenes.map(s=>'<span style="width:'+((s.end-s.start)/(project.source?.duration||1)*100)+'%">Cảnh '+(s.index+1)+'</span>').join('')+'</div></div><p>Nghe thử bằng giọng có trên thiết bị; chưa bảo đảm giọng nữ miền Nam hoặc khớp miệng. Không coi thời gian đếm chữ là thời gian giọng thật. Tệp giọng nhập được đặt vào timeline khi chuyển sang Dựng.</p>'+(project.voice.asset?'<audio controls style="width:100%" src="'+esc(mediaUrl(project.voice.asset))+'"></audio>':''),'<button data-action="ai-help">✨ AI viết lại cả bài</button><button class="primary" data-action="close-modal">Xong</button>');}
function scriptPartitionSnapshot(){return new Map(project.scenes.map(s=>[s.id,JSON.stringify(clipParts(s))]));}
function invalidateChangedPartitions(before){for(const s of project.scenes)if(before.get(s.id)!==JSON.stringify(clipParts(s))){s.chosen={};s.expanded=true;}}
function parseCaptions(text){const re=/(?:(\d{1,2}):)?(\d{2}):(\d{2})[,.](\d{1,3})\s*-->\s*(?:(\d{1,2}):)?(\d{2}):(\d{2})[,.](\d{1,3})[^\n]*\n([\s\S]*?)(?=\n\s*\n|$)/g;const out=[];for(const m of text.replace(/\r/g,'').matchAll(re)){const seconds=(a,b,c,d)=>Number(a||0)*3600+Number(b)*60+Number(c)+Number(d.padEnd(3,'0'))/1000;const start=seconds(...m.slice(1,5)),end=seconds(...m.slice(5,9)),content=m[9].replace(/<[^>]*>/g,'').trim();if(end>start&&content)out.push({id:uid(),start,end,original:content,translation:'',newText:content,faceTalking:false,measuredSec:null});}if(!out.length)throw Error('Không tìm thấy câu có mốc thời gian hợp lệ trong SRT/VTT.');return out;}
async function importCaptions(file){if(!file)return;try{const lines=parseCaptions(await file.text());if(project.source&&lines.some(l=>l.end>project.source.duration+.1))throw Error('Có mốc lời thoại vượt thời lượng video. Hãy sửa tệp trước khi nhập.');const before=scriptPartitionSnapshot();project.script=lines;invalidateChangedPartitions(before);save();render();scriptDialog();toast('Đã nhập '+lines.length+' câu; bản mới ban đầu giữ nguyên lời gốc.');}catch(e){toast(e.message);}$('#scriptFile').value='';}
function readImage(file){return new Promise((resolve,reject)=>{if(file.size>15*1024*1024){reject(Error('Ảnh tối đa 15 MB.'));return;}const r=new FileReader();r.onerror=()=>reject(Error('Không đọc được ảnh.'));r.onload=()=>{const img=new Image();img.onload=()=>{const scale=Math.min(1,1200/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(img.width*scale));c.height=Math.max(1,Math.round(img.height*scale));c.getContext('2d').drawImage(img,0,0,c.width,c.height);resolve({image:c.toDataURL('image/jpeg',.85),name:file.name});};img.onerror=()=>reject(Error('Ảnh không hợp lệ.'));img.src=r.result;};r.readAsDataURL(file);});}
function autoConnect(key){for(const s of project.scenes){const uses=key==='person'||key==='outfit'?s.hasPerson===true:key==='product'?!!s.hasProduct:key==='background';if(uses&&!s.refsUsed.includes(key)){s.refsUsed.push(key);s.approvedFrame=null;s.chosen={};}}}
function invalidateFrame(s){s.approvedFrame=null;s.chosen={};s.expanded=true;}
async function addReference(files,key){if(!key||!files.length)return;const projectId=project.id;try{const ref=project.refs[key],limit=key==='person'||key==='product'?3:2;if(ref.images.length+files.length>limit)throw Error('Tối đa '+limit+' ảnh cho '+refNames[key]+'.');for(const file of files){const image=await readImage(file);if(project.id!==projectId)throw Error('Dự án đã thay đổi; chưa nhập ảnh.');ref.images.push(image);}autoConnect(key);project.scenes.filter(s=>s.refsUsed.includes(key)).forEach(invalidateFrame);save();render();toast('Đã thêm ảnh '+refNames[key]+'. Mở Prompt khung để chọn cảnh được nối.');}catch(e){toast(e.message);}$('#referenceFile').value='';}
async function addFrame(file,id){if(!file)return;const projectId=project.id;try{const s=sceneBy(id),img=await readImage(file);if(project.id!==projectId)throw Error('Dự án đã thay đổi; chưa nhập khung.');s.frames.push({id:uid(),version:s.frames.length+1,image:img.image,status:'pending'});invalidateFrame(s);save();render();toast('Đã nhập khung mới. Hãy duyệt trước khi tạo clip.');}catch(e){toast(e.message);}$('#frameFile').value='';}
function approve(s){if(refsFor(s).length&&!s.frames.length){toast('Cảnh có tham chiếu thay đổi: cần nhập khung mới trước khi duyệt.');return;}if(!s.thumbs.length&&!s.frames.length){toast('Chưa có khung để duyệt.');return;}s.approvedFrame=s.frames.at(-1)?.id||'source';if(s.frames.length)s.frames.at(-1).status='approved';save();render();}
function prepareScene(s){openScene(s.id,'video');modal('Tạo clip · Cảnh '+(s.index+1),'<p>Flow chưa kết nối. Bạn có thể chép prompt và dùng khung đã duyệt trong Flow của chính bạn, sau đó nhập clip về đúng cảnh. Phần mềm chưa đăng nhập hoặc chạy credit của bạn.</p>'+(!frameApproved(s)?'<div class="detailNotice">Cần duyệt ảnh khung trước khi tạo clip.</div>':'')+'<p>Prompt tiếng Anh phải được kiểm tra đầy đủ. Chưa có dịch tự động; lời thoại giữ tiếng Việt. Kiểm tra thời lượng/mô hình mà Flow thực sự hỗ trợ trước khi tạo.</p>'+clipParts(s).map(p=>'<div class="versionCard"><b>Clip '+(s.index+1)+(clipParts(s).length>1?p.id:'')+' · '+p.duration.toFixed(1)+'s</b><textarea readonly rows="6">'+esc(makePrompt(s,p))+'</textarea><button data-copy-part="'+s.id+'" data-part="'+p.id+'">⧉ Chép prompt</button><button data-download-frame="'+s.id+'">↓ Tải khung</button><button data-clip-upload="'+s.id+'" data-part="'+p.id+'">↥ Nhập clip tải từ Flow</button></div>').join(''));}
async function addClip(file,target){if(!file||!target)return;const projectId=project.id,s=sceneBy(target.id);if(!frameApproved(s)){toast('Duyệt khung của cảnh trước khi nhập clip.');return;}const temp=URL.createObjectURL(file);try{const info=await useVideo(temp,async v=>{if(Math.abs(v.videoWidth/v.videoHeight-9/16)>.025)throw Error('Clip cần có khung dọc 9:16.');if(!Number.isFinite(v.duration)||v.duration<.2)throw Error('Clip không có thời lượng hợp lệ.');await seekFrame(v,Math.max(0,v.duration-.06));return{duration:v.duration,width:v.videoWidth,height:v.videoHeight,tail:capture(v)};});if(project.id!==projectId)throw Error('Dự án đã thay đổi; chưa nhập clip.');const part=target.part||clipParts(s)[0].id;if(!clipParts(s).some(p=>p.id===part))throw Error('Phần clip này không còn tồn tại sau khi sửa mốc.');const c={id:uid(),part,version:s.clips.filter(c=>c.part===part).length+1,asset:putAsset(file),name:file.name,model:s.model,prompt:makePrompt(s,clipParts(s).find(p=>p.id===part)),frameId:s.approvedFrame,createdAt:Date.now(),...info};s.clips.push(c);s.chosen[part]=c.id;if(clipParts(s).every(p=>chosenClip(s,p.id)))s.expanded=false;save();closeModal();render();toast('Đã nhập clip bản '+c.version+'. Các bản trước vẫn được giữ.');}catch(e){toast(e.message);}finally{URL.revokeObjectURL(temp);$('#clipFile').value='';}}
function runReview(){const approved=project.scenes.filter(frameApproved).length,total=project.scenes.length,credit=estimate();modal('Duyệt khung & chuẩn bị tạo clip','<ul class="checklist"><li class="'+(project.source?'ready':'')+'">'+(project.source?'✓':'○')+' Video tham khảo</li><li class="'+(approved===total&&total?'ready':'')+'">'+approved+'/'+total+' khung đã duyệt</li><li>'+project.scenes.reduce((n,s)=>n+clipParts(s).length,0)+' clip theo độ dài cảnh</li><li>Flow: chưa kết nối · chưa đọc được số credit còn lại</li><li>'+ (credit===null?'Ước tính: chưa có giá đã xác minh':credit+' credit theo mức bạn tự nhập; chưa bao gồm làm khung/giọng')+'</li></ul><div class="detailNotice">Không có lệnh tạo video hoặc khoản phí nào được gửi từ màn này. Kết nối Flow chạy ngầm, chi phí làm khung và TTS chưa được kiểm chứng.</div><button data-action="costs">Chỉnh mức credit tham khảo</button>', '<button data-action="close-modal">Đóng</button><button data-action="approve-source">Duyệt các khung không thay đổi</button><button class="primary" data-action="export-prompts">↓ Xuất prompt cho Flow</button>');}
function timingsDialog(){modal('Rà lại mốc cảnh','<p>Các cảnh giữ liên tục từ 0 đến hết video. Sửa điểm kết thúc của cảnh sẽ đổi điểm bắt đầu cảnh kế. Chia lại sẽ xóa các phê duyệt và lựa chọn clip bị ảnh hưởng.</p>'+project.scenes.map((s,i)=>'<div class="sceneTiming"><b>Cảnh '+(i+1)+'</b><span>'+s.start.toFixed(2)+'s →</span><input type="number" data-end-time="'+i+'" value="'+s.end.toFixed(3)+'" min="'+(s.start+.2)+'" max="'+project.source.duration+'" step="0.1" '+(i===project.scenes.length-1?'disabled':'')+' aria-label="Kết thúc cảnh '+(i+1)+'"></div>').join('')+'<div class="scriptToolbar"><button data-action="split-scene">＋ Tách cảnh đang chọn ở giữa</button><button data-action="merge-next">Nối cảnh đang chọn với cảnh kế</button></div>', '<button data-action="close-modal">Hủy</button><button class="primary" data-action="apply-timings">Lưu mốc & trích lại khung</button>');}
async function refreshSceneFrames(){const url=mediaUrl(project.source.asset);if(!url)throw Error('Cần chọn lại video nguồn trước khi trích khung.');await useVideo(url,async v=>{for(const s of project.scenes){s.thumbs=[];for(const t of [s.start+Math.min(.04,(s.end-s.start)/5),(s.start+s.end)/2,s.end-.01]){await seekFrame(v,t);s.thumbs.push(capture(v));}s.evidence=[];const boundaries=[s.start,...project.analysis.cuts.filter(t=>t>s.start&&t<s.end),s.end];for(let n=0;n<boundaries.length-1;n++){const at=(boundaries[n]+boundaries[n+1])/2;await seekFrame(v,at);s.evidence.push({at,image:capture(v,120)});}s.frames=[];invalidateFrame(s);s.clips=[];}});}

function importAnalysis(data){const rows=data.scenes;if(!Array.isArray(rows)||!rows.length||rows.length>200)throw Error('JSON cần mảng scenes từ 1 đến 200 cảnh.');if(!project.scenes.length)throw Error('Dò/chia cảnh trước rồi nhập kết quả khớp các mốc đó.');if(rows.length!==project.scenes.length)throw Error('Số cảnh AI không khớp số cảnh đã chia. Không nhập để tránh lệch nguồn.');const updated=clone(project.scenes);for(let n=0;n<rows.length;n++){const raw=rows[n],s=updated[n];if(!Number.isFinite(raw.start)||!Number.isFinite(raw.end)||Math.abs(raw.start-s.start)>.05||Math.abs(raw.end-s.end)>.05)throw Error('Mốc cảnh '+(n+1)+' không khớp nguồn.');s.description=typeof raw.description==='string'?raw.description.slice(0,3000):s.description;for(const k of ['hasPerson','faceTalking','hasProduct','competitorLogo'])if(typeof raw[k]==='boolean')s[k]=raw[k];for(const group of ['visual','motion'])for(const lang of ['vi','en'])for(const [k,v]of Object.entries(raw[group]?.[lang]||{}))if(Object.hasOwn(viNames,k)&&typeof v==='string')s[group][lang][k]=v.slice(0,10000);for(const lang of ['vi','en'])if(typeof raw.promptFrame?.[lang]==='string')s.promptFrame[lang]=raw.promptFrame[lang].slice(0,15000);s.aiImported=true;invalidateFrame(s);}let lines=project.script;if(data.script){if(!Array.isArray(data.script)||data.script.length>1000)throw Error('Bản thoại không hợp lệ.');lines=data.script.map(l=>{if(!Number.isFinite(l.start)||!Number.isFinite(l.end)||l.start<0||l.end<=l.start||l.end>project.source.duration+.1)throw Error('Mốc thoại vượt nguồn.');return{id:uid(),start:l.start,end:l.end,original:String(l.original||'').slice(0,5000),translation:String(l.translation||'').slice(0,5000),newText:String(l.newText||l.original||'').slice(0,5000),faceTalking:l.faceTalking===true,measuredSec:null};});}project.scenes=updated;project.script=lines;for(const k of Object.keys(refNames))autoConnect(k);save();render();toast('Đã nhập dữ liệu AI. Hãy đối chiếu trước khi duyệt.');}
function analysisTemplate(){return{scenes:project.scenes.map(s=>({start:s.start,end:s.end,description:s.description,hasPerson:s.hasPerson,faceTalking:false,hasProduct:false,competitorLogo:false,visual:{vi:Object.fromEntries(['person','product','scale','composition','background','lighting'].map(k=>[k,''])),en:Object.fromEntries(['person','product','scale','composition','background','lighting'].map(k=>[k,'']))},motion:{vi:Object.fromEntries(['camera','initial','action','final'].map(k=>[k,''])),en:Object.fromEntries(['camera','initial','action','final'].map(k=>[k,'']))},promptFrame:{vi:'',en:''}})),script:[]};}

document.addEventListener('click',async e=>{const button=e.target.closest('button,a[data-action]');if(!button)return;const action=button.dataset.action;if(action){e.preventDefault();try{await actions[action]?.();}catch(err){toast(err.message);}return;}if(button.dataset.scene)openScene(button.dataset.scene);if(button.dataset.detail)openScene(button.dataset.detail,button.dataset.tab);if(button.dataset.detailTab){detailTab=button.dataset.detailTab;renderDetails();}if(button.dataset.language){language=button.dataset.language;renderDetails();}if(button.dataset.refUpload){uploadTarget=button.dataset.refUpload;$('#referenceFile').click();}if(button.dataset.removeRef){project.refs[button.dataset.removeRef].images.splice(Number(button.dataset.index),1);project.scenes.filter(s=>s.refsUsed.includes(button.dataset.removeRef)).forEach(invalidateFrame);save();render();}if(button.dataset.frameUpload){uploadTarget=button.dataset.frameUpload;$('#frameFile').click();}if(button.dataset.approve)approve(sceneBy(button.dataset.approve));if(button.dataset.clipUpload){const s=sceneBy(button.dataset.clipUpload);if(!frameApproved(s)){toast('Hãy duyệt khung trước khi nhập clip.');return;}uploadTarget={id:s.id,part:button.dataset.part||clipParts(s)[0].id};$('#clipFile').click();}if(button.dataset.prepare)prepareScene(sceneBy(button.dataset.prepare));if(button.dataset.chooseClip){const s=activeScene(),c=s.clips.find(c=>c.id===button.dataset.chooseClip);if(c){s.chosen[c.part]=c.id;save();render();}}if(button.dataset.expand){sceneBy(button.dataset.expand).expanded=true;render();}if(button.dataset.copyPart){const s=sceneBy(button.dataset.copyPart);copyText(makePrompt(s,clipParts(s).find(p=>p.id===button.dataset.part)));}if(button.dataset.downloadFrame){const s=sceneBy(button.dataset.downloadFrame);if(!frameApproved(s)){toast('Chưa duyệt khung.');return;}const a=document.createElement('a');a.href=displayFrame(s);a.download='canh-'+(s.index+1)+'-khung.jpg';a.click();}if(button.dataset.loadProject){const row=(await readProjects()).find(p=>p.id===button.dataset.loadProject);if(row)loadSaved(row);}if(button.dataset.removeLine){const before=scriptPartitionSnapshot();project.script=project.script.filter(l=>l.id!==button.dataset.removeLine);invalidateChangedPartitions(before);save();render();scriptDialog();}if(button.dataset.orderUp){const n=Number(button.dataset.orderUp);[project.merge.order[n-1],project.merge.order[n]]=[project.merge.order[n],project.merge.order[n-1]];save();actions['merge-order']();}});
document.addEventListener('click',e=>{const box=e.target.closest('.promptExcerpt');if(box&&!e.target.closest('button'))openScene(box.dataset.detail,box.dataset.tab);});
document.addEventListener('input',e=>{const n=e.target,s=activeScene();if(n.id==='projectName'){project.name=n.value;save();}if(n.dataset.promptGroup&&s){if(n.dataset.promptGroup==='frame')s.promptFrame[n.dataset.promptKey]=n.value;else s[n.dataset.promptGroup][language][n.dataset.promptKey]=n.value;save();}if(n.dataset.extra){sceneBy(n.dataset.extra).extraRequest=n.value;save();const other=$$('[data-extra]').find(x=>x!==n&&x.dataset.extra===n.dataset.extra);if(other)other.value=n.value;}if(n.dataset.line){const line=project.script.find(l=>l.id===n.dataset.line);line.newText=n.value;line.measuredSec=null;save();$$('[data-line]').filter(x=>x!==n&&x.dataset.line===n.dataset.line).forEach(x=>x.value=n.value);}if(n.dataset.refDescription){const key=n.dataset.refDescription;project.refs[key].description=n.value;project.scenes.filter(s=>s.refsUsed.includes(key)).forEach(invalidateFrame);save();requestAnimationFrame(drawWires);}if(n.hasAttribute('data-scene-description')&&s){s.description=n.value;save();}});
document.addEventListener('change',e=>{const n=e.target,s=activeScene();if(n.dataset.linkRef&&s){if(n.checked&&!s.refsUsed.includes(n.dataset.linkRef))s.refsUsed.push(n.dataset.linkRef);else if(!n.checked)s.refsUsed=s.refsUsed.filter(k=>k!==n.dataset.linkRef);invalidateFrame(s);save();render();}if(n.dataset.sceneProp&&s){s[n.dataset.sceneProp]=n.type==='checkbox'?n.checked:n.value==='unknown'?null:n.value==='yes';save();}if(n.dataset.lineFace){project.script.find(l=>l.id===n.dataset.lineFace).faceTalking=n.checked;save();}if(n.dataset.model){sceneBy(n.dataset.model).model=n.value;save();updateChrome();}if(n.hasAttribute('data-voice-speed')){project.voice.speed=Number(n.value);save();}});
$('#sourceFile').onchange=e=>uploadSource(e.target.files[0]);$('#referenceFile').onchange=e=>addReference([...e.target.files],uploadTarget);$('#frameFile').onchange=e=>addFrame(e.target.files[0],uploadTarget);$('#clipFile').onchange=e=>addClip(e.target.files[0],uploadTarget);$('#scriptFile').onchange=e=>importCaptions(e.target.files[0]);
