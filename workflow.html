function speechForPart(s,p){const lines=dialogueFor(s).filter(l=>l.start<p.end-.001&&l.end>p.start+.001),overrides=s.dialogueParts||{},manual=Object.hasOwn(overrides,p.id);return{lines,manual,text:manual?overrides[p.id]:lines.filter(l=>l.start>=p.start-.01&&l.end<=p.end+.01).map(l=>l.newText).join(' '),cueStart:lines.length?Math.max(0,Math.min(...lines.map(l=>l.start))-p.start):0,cueEnd:lines.length?Math.min(p.duration,Math.max(...lines.map(l=>l.end))-p.start):p.duration,pending:!manual&&lines.some(l=>l.start<p.start-.01||l.end>p.end+.01),visible:s.hasPerson!==false&&(s.faceTalking===true||lines.some(l=>l.faceTalking))};}
function speechControls(s){return '<div class="promptGroup"><h3>LỜI FLOW SẼ TẠO TRONG CLIP</h3><p class="status">Flow tạo cả tiếng và hình miệng. Câu đi qua ranh giới clip cần chia lời để không bị đọc lặp.</p>'+clipParts(s).map(p=>{const speech=speechForPart(s,p);return '<label class="promptField"><span>Clip '+(s.index+1)+(clipParts(s).length>1?p.id:'')+' · '+stamp(p.start)+'–'+stamp(p.end)+'</span><textarea data-part-speech="'+p.id+'" placeholder="'+(speech.pending?'Chia phần câu được nói trong clip này…':'Không có lời thoại')+'">'+esc(speech.text)+'</textarea></label>'+(speech.pending?'<div class="detailNotice">Câu nguồn đi qua điểm cắt: '+speech.lines.map(l=>esc(l.newText)).join(' / ')+'. Cần xác định phần lời riêng cho clip này trước khi chép prompt.</div>':'')+(speech.manual?'<button class="plain" data-reset-speech="'+p.id+'">Dùng lại lời theo mốc</button>':'');}).join('')+'</div>';}

function demoProject(){const p=blankProject();p.name='Thử quy trình · Video thung lũng';p.demo=true;p.source={name:'binh-minh-tren-doi-9x16.mp4',duration:12,width:540,height:960,asset:'demo',poster:SAMPLE.frames[0]};p.analysis={status:'sample',method:'Dữ liệu minh họa có sẵn',cuts:[0,4,8,12]};

s.visual.en={person:i===1?'One small figure in a terracotta jacket and dark trousers stands beside the sandy trail. Age, facial features and gender are not established by the source samples.':'No people are visible in this illustrated source scene.',product:'No product is visible. Do not add objects without an explicit adaptation request.',scale:'Preserve the relative sizes of the trail, foreground hills and mountain ridges shown in the source frame. Do not enlarge a subject for emphasis.',composition:'Portrait 9:16 wide composition. A sandy trail enters from the lower edge and leads into the central valley. Preserve the depth ordering of the foreground hills and background ridges; the small pale sun stays in the upper right.',background:'A stylized geometric mountain valley: layered lavender ridges, sage-green hills and a dusty rose sky. Keep ridge silhouettes, trail geometry and spatial relationships consistent with the source.',lighting:'Soft pale-gold sunrise light with muted earth colors. Preserve the source lighting direction and restrained atmospheric depth.'};
s.motion.vi={camera:'Máy đứng yên, toàn cảnh; không có bằng chứng lia, zoom hoặc di chuyển máy.',initial:'Bắt đầu đúng bố cục của khung đầu cảnh.',action:i===1?'Giữ tư thế và vị trí người trong hình. Không suy ra chuyển động đi bộ từ khung minh họa.':'Giữ bố cục tĩnh. Không thêm mây chạy, vật đi ngang hoặc hoạt động không xuất hiện trong nguồn.',final:'Kết thúc với cùng hình khối, vị trí và bảng màu; không tự thêm cắt cảnh.'};
s.motion.en={camera:'Locked wide camera. No pan, zoom or traveling camera movement is supported by the source samples.',initial:'Start from the supplied opening composition, with all visible subjects in their observed positions.',action:i===1?'Maintain the figure’s visible posture and position beside the trail. Walking is not established by the reference frames; do not invent steps or gestures.':'Hold the illustrated composition without introducing passing objects, drifting clouds, weather changes or unobserved actions.',final:'Maintain the same ridge silhouettes, trail position, sun placement and palette through the closing frame. Do not introduce an unmotivated cut.'};
s.promptFrame.vi='Giữ bố cục, tư thế, kích thước và bảng màu của khung gốc. Chỉ thay những thành phần có ảnh tham chiếu được nối vào cảnh.';s.promptFrame.en='Preserve the original composition, pose, perspective, relative object scale and lighting. Replace only elements explicitly connected to approved reference images; preserve everything else.';return s;});p.merge.order=p.scenes.map(s=>s.id);return p;}
function mediaUrl(key){if(!key)return'';if(key==='demo')return SAMPLE.video;if(urls.has(key))return urls.get(key);const blob=assets.get(key);if(!blob)return'';const url=URL.createObjectURL(blob);urls.set(key,url);return url;}

function sceneBy(id){return project.scenes.find(s=>s.id===id)||project.scenes[selected];}

function clipParts(s){const duration=s.end-s.start,parts=[];let at=s.start,n=0;while(at<s.end-.01){let end=Math.min(at+8,s.end);if(end<s.end){const breaks=project.script.map(l=>l.end).filter(t=>t>at+4&&t<=end);if(breaks.length)end=Math.max(...breaks);}parts.push({id:String.fromCharCode(97+n++),start:at,end,duration:end-at});at=end;}return parts;}
function chosenClip(s,part){return s.clips.find(c=>c.id===s.chosen[part]);}
function readyCount(){return project.scenes.filter(s=>clipParts(s).every(p=>chosenClip(s,p.id)&&mediaUrl(chosenClip(s,p.id).asset))).length;}
function refsFor(s){return s.refsUsed.filter(k=>project.refs[k].images.length||project.refs[k].description);}
function displayFrame(s){return s.frames.find(f=>f.id===s.approvedFrame)?.image||s.frames.at(-1)?.image||s.thumbs[0]||project.source?.poster;}

function estimate(){if(!project.scenes.length)return null;let total=0,known=true;for(const s of project.scenes){const cost=project.settings.costs[s.model];if(cost===null||!Number.isFinite(cost)||cost<0)known=false;else total+=clipParts(s).length*cost;}return known?total:null;}

const value=estimate(),parts=project.scenes.reduce((n,s)=>n+clipParts(s).length,0);$('#runBar').innerHTML='<small>'+(project.demo?'Dữ liệu mẫu · ':count?count+' cảnh · '+parts+' clip · ':'Bắt đầu bằng một video dọc · ')+(value===null?'Credit Flow: chưa xác minh':value+' credit theo mức bạn nhập')+'</small><button class="primary" data-action="review-run">Duyệt khung & chuẩn bị chạy →</button>';}

function drawWires(){const paths=[];function add(from,to,type){const a=$('#'+from),b=$('#'+to);if(!a||!b)return;const x1=a.offsetLeft+a.offsetWidth,y1=a.offsetTop+a.offsetHeight/2,x2=b.offsetLeft,y2=b.offsetTop+b.offsetHeight/2;if(type==='voice'){const turn=24,lower=worldHeight-30,exit=x1+turn,entry=x2-turn;paths.push('<path class="wire voice" data-from="'+from+'" data-to="'+to+'" d="M '+x1+' '+y1+' Q '+exit+' '+y1+', '+exit+' '+(y1+turn)+' L '+exit+' '+(lower-turn)+' Q '+exit+' '+lower+', '+(exit+turn)+' '+lower+' L '+(entry-turn)+' '+lower+' Q '+entry+' '+lower+', '+entry+' '+(lower-turn)+' L '+entry+' '+(y2+turn)+' Q '+entry+' '+y2+', '+x2+' '+y2+'"/>');return;}if(x2<x1){paths.push('<path class="wire '+type+'" data-from="'+from+'" data-to="'+to+'" d="M '+(a.offsetLeft+a.offsetWidth/2)+' '+(a.offsetTop+a.offsetHeight)+' C '+(a.offsetLeft+a.offsetWidth/2)+' '+(a.offsetTop+a.offsetHeight+25)+', '+(b.offsetLeft+b.offsetWidth/2)+' '+(b.offsetTop-25)+', '+(b.offsetLeft+b.offsetWidth/2)+' '+b.offsetTop+'"/>');return;}const d=Math.max(50,(x2-x1)*.55);paths.push('<path class="wire '+type+'" data-from="'+from+'" data-to="'+to+'" d="M '+x1+' '+y1+' C '+(x1+d)+' '+y1+', '+(x2-d)+' '+y2+', '+x2+' '+y2+'"/>');}add('node-source','node-analysis','scene');add('node-analysis','node-scenes','scene');add('node-analysis','node-script','scene');for(const s of project.scenes){const id=$('#complete-'+s.id)?'complete-'+s.id:'frame-'+s.id;add('node-scenes',id,'scene');for(const k of refsFor(s))add('ref-'+k,id,'ref');if(id.startsWith('frame')){add(id,'clip-'+s.id,'ref');add('clip-'+s.id,'node-merge','video');}else add(id,'node-merge','video');}for(const scene of project.scenes){if(!$('#complete-'+scene.id))add('node-script','clip-'+scene.id,'voice');}$('#wires').innerHTML=paths.join('');}

function makePrompt(s,part=null){const p=part||clipParts(s)[0],visual=s.visual.en,motion=s.motion.en,speech=speechForPart(s,p);if(speech.pending)throw Error('Chia lời cho clip '+(s.index+1)+p.id+' trước khi xuất prompt.');const refs=refsFor(s).map(k=>refNames[k]+': '+(project.refs[k].description||project.refs[k].images.length+' supplied reference images')).join('\n');return 'SCENE '+(s.index+1)+(clipParts(s).length>1?p.id:'')+' · '+stamp(p.start)+'–'+stamp(p.end)+'\n\n1. VISUAL PROMPT\n'+Object.entries(visual).filter(([,v])=>v).map(([k,v])=>k.toUpperCase()+': '+v).join('\n\n')+(refs?'\n\nCONNECTED REFERENCES (adaptation instructions; not observed in original):\n'+refs:'')+'\n\n2. MOTION & SCRIPT\n'+Object.entries(motion).filter(([,v])=>v).map(([k,v])=>k.toUpperCase()+': '+v).join('\n\n')+'\n\n3. AUDIO GENERATED WITH THIS VIDEO IN FLOW\nGenerate picture and native audio together in this same clip. Preserve the same speaker identity and voice characteristics across adjacent clips.\nVOICE DIRECTION: '+voiceDescription()+(speech.text?'\nEXACT VIETNAMESE DIALOGUE: '+JSON.stringify(speech.text)+'\nTARGET SPEECH WINDOW WITHIN THIS CLIP: '+speech.cueStart.toFixed(2)+'–'+speech.cueEnd.toFixed(2)+' seconds (check the generated timing).\n'+(speech.visible?'The visible person speaks these exact Vietnamese words with synchronized natural mouth movement and audible speech.':'Generate these exact Vietnamese words as audible off-screen narration; do not add a visible speaking person.'):'\nNo dialogue has been supplied for this clip. Do not invent speech. Use only ambience supported by the source or explicitly requested.')+'\nFit the spoken words naturally within this clip; avoid abrupt syllable cuts or repeating adjacent dialogue.\n\nDURATION: '+p.duration.toFixed(2)+' seconds; portrait 9:16. Preserve start/end state and continuity with adjacent clips. Do not add subtitles, platform watermarks or competitor overlays. Preserve explicitly requested product branding; do not invent unsupported subjects.\n'+(s.extraRequest?'\nEXTRA REQUEST (user adaptation): '+s.extraRequest:'');}

function exportProject(){const out={format:'sceneforge-workflow',version:1,project:clone(project)};const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(out,null,2)],{type:'application/json'}));a.download=project.name.replace(/[^\p{L}\p{N} _-]/gu,'').slice(0,80)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);toast('Đã lưu JSON. Video/clip lưu trên trình duyệt, không được nhúng trong JSON.');}
function waitMedia(video,event,ms=15000){return new Promise((resolve,reject)=>{let timer;const done=()=>{cleanup();resolve();},fail=()=>{cleanup();reject(Error('Không đọc được video. Hãy thử MP4 H.264.'));};function cleanup(){clearTimeout(timer);video.removeEventListener(event,done);video.removeEventListener('error',fail);}timer=setTimeout(fail,ms);video.addEventListener(event,done,{once:true});video.addEventListener('error',fail,{once:true});});}
async function useVideo(url,fn){const v=document.createElement('video');v.muted=true;v.playsInline=true;v.preload='auto';try{const loaded=waitMedia(v,'loadedmetadata');v.src=url;await loaded;await Promise.race([v.readyState>=2?Promise.resolve():waitMedia(v,'loadeddata'),new Promise((_,r)=>setTimeout(()=>r(Error('Không giải mã được hình video.')),15000))]);return await fn(v);}finally{v.pause();v.removeAttribute('src');v.load();}}
async function seekFrame(v,t){const at=Math.max(0,Math.min(v.duration-.005,t));if(Math.abs(v.currentTime-at)>.0005){const done=waitMedia(v,'seeked');v.currentTime=at;await done;}if(v.readyState<2)await waitMedia(v,'loadeddata');}
function capture(v,width=180){const c=document.createElement('canvas');c.width=width;c.height=Math.round(width*16/9);c.getContext('2d').drawImage(v,0,0,c.width,c.height);return c.toDataURL('image/jpeg',.78);}
function signature(v){const c=document.createElement('canvas');c.width=32;c.height=56;const ctx=c.getContext('2d',{willReadFrequently:true});ctx.drawImage(v,0,0,c.width,c.height);const pixels=ctx.getImageData(0,0,c.width,c.height).data,hist=new Float32Array(48);for(let i=0;i<pixels.length;i+=4)for(let k=0;k<3;k++)hist[k*16+Math.min(15,pixels[i+k]>>4)]++;return{pixels,hist};}
function distance(a,b){let pixels=0,hist=0;for(let i=0;i<a.pixels.length;i+=4)for(let k=0;k<3;k++)pixels+=Math.abs(a.pixels[i+k]-b.pixels[i+k]);for(let i=0;i<48;i++)hist+=Math.abs(a.hist[i]-b.hist[i]);return{pixels:pixels/(a.pixels.length/4*3),hist:hist/(a.pixels.length/4*6)};}
async function uploadSource(file){if(!file)return;if(busy){toast('Dừng lượt phân tích hiện tại trước khi thay video.');return;}if(file.size>500*1024*1024){toast('Video tối đa 500 MB.');return;}const temporary=URL.createObjectURL(file);try{const info=await useVideo(temporary,async v=>{if(!Number.isFinite(v.duration)||v.duration<=0||v.duration>600)throw Error('Video cần có thời lượng từ 0 đến 10 phút.');if(Math.abs(v.videoWidth/v.videoHeight-9/16)>.025)throw Error('Chỉ nhận video dọc 9:16. Hãy đổi khung trước khi nhập.');await seekFrame(v,Math.min(.04,v.duration/2));return{name:file.name,duration:v.duration,width:v.videoWidth,height:v.videoHeight,poster:capture(v)};});if(project.source&&project.scenes.length){const accepted=confirm('Thay video sẽ tạo dự án mới. Dự án hiện tại được giữ trong danh sách Dự án.');if(!accepted)return;await storeProject();assets.clear();urls.forEach(u=>URL.revokeObjectURL(u));urls.clear();project=blankProject();}info.asset=putAsset(file);project.source=info;project.demo=false;project.name=file.name.replace(/\.[^.]+$/,'');project.scenes=[];project.script=[];project.analysis={status:'uploaded',cuts:[],method:null};closeDetails();save();render();fit(false);toast('Đã thêm video. Bấm Phân tích để dò cảnh và trích khung trên máy.');}catch(e){toast(e.message);}finally{URL.revokeObjectURL(temporary);$('#sourceFile').value='';}}
function groupCuts(cuts){const shots=cuts.slice(0,-1).map((start,i)=>({start,end:cuts[i+1],cutIds:[i]})),out=[];for(const shot of shots){const prev=out.at(-1);if(prev&&prev.end-prev.start<6&&shot.end-prev.start<=8){prev.end=shot.end;prev.cutIds.push(...shot.cutIds);}else out.push({...shot});}return out;}
async function analyzeSource(){if(busy)return;if(!project.source){$('#sourceFile').click();return;}if(project.scenes.length&&!confirm('Dò lại cảnh sẽ thay cấu trúc cảnh. Bản prompt hiện tại có thể lưu JSON trước. Tiếp tục?'))return;const url=mediaUrl(project.source.asset);if(!url){toast('Cần chọn lại tệp video nguồn.');return;}busy=true;cancelled=false;project.analysis.status='scanning';render();let result;try{result=await useVideo(url,async v=>{const cuts=[0],step=Math.max(.4,v.duration/600);let prev=null,prevTime=.01;for(let t=.01;t<v.duration-.01;t+=step){if(cancelled)throw Error('Đã dừng phân tích.');await seekFrame(v,t);const sig=signature(v);if(prev){const delta=distance(prev,sig);if(delta.pixels>35&&delta.hist>.23&&t-cuts.at(-1)>.5){let lo=prevTime,hi=t;for(let n=0;n<5;n++){const mid=(lo+hi)/2;await seekFrame(v,mid);const d=distance(prev,signature(v));if(d.pixels>25&&d.hist>.15)hi=mid;else lo=mid;}const cut=Number(hi.toFixed(3));if(cut>cuts.at(-1)+.2&&cut<v.duration-.2)cuts.push(cut);}}prev=sig;prevTime=t;if(Math.floor(t/step)%10===0){$('#saveStatus').textContent='Đang đọc khung '+Math.round(t/v.duration*100)+'%';await new Promise(r=>requestAnimationFrame(r));}}
cuts.push(v.duration);const groups=groupCuts(cuts),scenes=[];for(const [i,g]of groups.entries()){if(cancelled)throw Error('Đã dừng phân tích.');const margin=Math.min(.04,(g.end-g.start)/5),times=[g.start+margin,(g.start+g.end)/2,g.end-margin],thumbs=[];for(const t of times){await seekFrame(v,t);thumbs.push(capture(v));}const s=sceneRecord(g.start,g.end,i,thumbs);s.cutIds=g.cutIds;s.evidence=[];for(const cutId of g.cutIds){const at=(cuts[cutId]+cuts[cutId+1])/2;await seekFrame(v,at);s.evidence.push({at,image:capture(v,120)});}s.visual.vi.composition='Video dọc 9:16. Điền cỡ cảnh, vị trí nhân vật và sản phẩm sau khi đối chiếu các khung nguồn.';s.visual.en.composition='Portrait 9:16. Complete the observed shot size and subject/product positions after reviewing source evidence.';s.promptFrame.vi='Giữ bố cục và tư thế của khung gốc; chỉ thay các thành phần có tham chiếu được nối.';s.promptFrame.en='Preserve the original composition, pose, perspective, scale and lighting. Replace only elements explicitly connected to reference images.';scenes.push(s);}return{cuts,scenes};});project.scenes=result.scenes;project.analysis={status:'done',cuts:result.cuts,method:'Dò hình cục bộ · cần rà lại mốc'};project.merge.order=project.scenes.map(s=>s.id);selected=0;save();toast('Đã dò '+(result.cuts.length-1)+' đoạn → '+result.scenes.length+' cảnh. Chưa chạy AI mô tả hoặc chép lời.');}catch(e){project.analysis.status=project.scenes.length?'done':'uploaded';toast(e.message);}finally{busy=false;render();}}

.id+'" '+(l.faceTalking?'checked':'')+'> Người trong hình nói câu này</label></td></tr>').join('')+'</tbody></table></div>'+(project.script.length?'':'<div class="detailNotice">Chưa có lời thoại từ phân tích. Bạn không bắt buộc tự chuẩn bị SRT; đây chỉ là đường nhập dự phòng khi đã có bản chữ.</div>')+'<div class="voiceLanes"><div class="voiceLane speech">'+project.script.map((l,i)=>'<span style="left:'+(l.start/projectDuration()*100)+'%;width:'+((l.end-l.start)/projectDuration()*100)+'%">Câu '+(i+1)+'</span>').join('')+'</div><div class="voiceLane scenes">'+project.scenes.map(s=>'<span style="width:'+((s.end-s.start)/projectDuration()*100)+'%">Cảnh '+(s.index+1)+'</span>').join('')+'</div></div><p>Câu vắt qua ranh giới clip cần chia thành từng phần lời trong bảng chi tiết cảnh. Không gửi lại nguyên câu ở cả hai clip. Khi ghép sẽ giữ tiếng Flow trong từng clip.</p>','<button class="primary" data-action="close-modal">Xong</button>');}

function scriptPartitionSnapshot(){return new Map(project.scenes.map(s=>[s.id,JSON.stringify(clipParts(s))]));}
function invalidateChangedPartitions(before){for(const s of project.scenes)if(before.get(s.id)!==JSON.stringify(clipParts(s))){s.chosen={};s.expanded=true;}}
function parseCaptions(text){const re=/(?:(\d{1,2}):)?(\d{2}):(\d{2})[,.](\d{1,3})\s*-->\s*(?:(\d{1,2}):)?(\d{2}):(\d{2})[,.](\d{1,3})[^\n]*\n([\s\S]*?)(?=\n\s*\n|$)/g;const out=[];for(const m of text.replace(/\r/g,'').matchAll(re)){const seconds=(a,b,c,d)=>Number(a||0)*3600+Number(b)*60+Number(c)+Number(d.padEnd(3,'0'))/1000;const start=seconds(...m.slice(1,5)),end=seconds(...m.slice(5,9)),content=m[9].replace(/<[^>]*>/g,'').trim();if(end>start&&content)out.push({id:uid(),start,end,original:content,translation:'',newText:content,faceTalking:false,measuredSec:null});}if(!out.length)throw Error('Không tìm thấy câu có mốc thời gian hợp lệ trong SRT/VTT.');return out;}
async function importCaptions(file){if(!file)return;try{const lines=parseCaptions(await file.text());if(projectDuration()>0&&lines.some(l=>l.end>projectDuration()+.1))throw Error('Có mốc lời thoại vượt thời lượng video. Hãy sửa tệp trước khi nhập.');const before=scriptPartitionSnapshot();project.script=lines;for(const scene of project.scenes)scene.dialogueParts={};invalidateChangedPartitions(before);save();render();scriptDialog();toast('Đã nhập '+lines.length+' câu; bản mới ban đầu giữ nguyên lời gốc.');}catch(e){toast(e.message);}$('#scriptFile').value='';}
function readImage(file){return new Promise((resolve,reject)=>{if(file.size>15*1024*1024){reject(Error('Ảnh tối đa 15 MB.'));return;}const r=new FileReader();r.onerror=()=>reject(Error('Không đọc được ảnh.'));r.onload=()=>{const img=new Image();img.onload=()=>{const scale=Math.min(1,1200/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(img.width*scale));c.height=Math.max(1,Math.round(img.height*scale));c.getContext('2d').drawImage(img,0,0,c.width,c.height);resolve({image:c.toDataURL('image/jpeg',.85),name:file.name});};img.onerror=()=>reject(Error('Ảnh không hợp lệ.'));img.src=r.result;};r.readAsDataURL(file);});}
function autoConnect(key){for(const s of project.scenes){const uses=key==='person'||key==='outfit'?s.hasPerson===true:key==='product'?!!s.hasProduct:key==='background';if(uses&&!s.refsUsed.includes(key)){s.refsUsed.push(key);s.approvedFrame=null;s.chosen={};}}}
function invalidateFrame(s){s.approvedFrame=null;s.chosen={};s.expanded=true;}
async function addReference(files,key){if(!key||!files.length)return;const projectId=project.id;try{const ref=project.refs[key],limit=key==='person'||key==='product'?3:2;if(ref.images.length+files.length>limit)throw Error('Tối đa '+limit+' ảnh cho '+refNames[key]+'.');for(const file of files){const image=await readImage(file);if(project.id!==projectId)throw Error('Dự án đã thay đổi; chưa nhập ảnh.');ref.images.push(image);}autoConnect(key);project.scenes.filter(s=>s.refsUsed.includes(key)).forEach(invalidateFrame);save();render();toast('Đã thêm ảnh '+refNames[key]+'. Mở Prompt khung để chọn cảnh được nối.');}catch(e){toast(e.message);}$('#referenceFile').value='';}
async function addFrame(file,id){if(!file)return;const projectId=project.id;try{const s=sceneBy(id),img=await readImage(file);if(project.id!==projectId)throw Error('Dự án đã thay đổi; chưa nhập khung.');s.frames.push({id:uid(),version:s.frames.length+1,image:img.image,status:'pending'});invalidateFrame(s);save();render();toast('Đã nhập khung mới. Hãy duyệt trước khi tạo clip.');}catch(e){toast(e.message);}$('#frameFile').value='';}
function approve(s){if(refsFor(s).length&&!s.frames.length){toast('Cảnh có tham chiếu thay đổi: cần nhập khung mới trước khi duyệt.');return;}if(!s.thumbs.length&&!s.frames.length){toast('Chưa có khung để duyệt.');return;}s.approvedFrame=s.frames.at(-1)?.id||'source';if(s.frames.length)s.frames.at(-1).status='approved';save();render();}
function prepareScene(s){if(!requireSpeechParts(s))return;openScene(s.id,'video');modal('Tạo clip · Cảnh '+(s.index+1),'<p>Flow chưa kết nối. Bạn có thể chép prompt và dùng khung đã duyệt trong Flow của chính bạn, sau đó nhập clip về đúng cảnh. Phần mềm chưa đăng nhập hoặc chạy credit của bạn.</p>'+(!frameApproved(s)?'<div class="detailNotice">Cần duyệt ảnh khung trước khi tạo clip.</div>':'')+'<p>Prompt tiếng Anh phải được kiểm tra đầy đủ. Chưa có dịch tự động; lời thoại giữ tiếng Việt. Kiểm tra thời lượng/mô hình mà Flow thực sự hỗ trợ trước khi tạo.</p>'+clipParts(s).map(p=>'<div class="versionCard"><b>Clip '+(s.index+1)+(clipParts(s).length>1?p.id:'')+' · '+p.duration.toFixed(1)+'s</b><textarea readonly rows="6">'+esc(makePrompt(s,p))+'</textarea><button data-copy-part="'+s.id+'" data-part="'+p.id+'">⧉ Chép prompt</button><button data-download-frame="'+s.id+'">↓ Tải khung</button><button data-clip-upload="'+s.id+'" data-part="'+p.id+'">↥ Nhập clip tải từ Flow</button></div>').join(''));}
async function addClip(file,target){if(!file||!target)return;const projectId=project.id,s=sceneBy(target.id);if(!frameApproved(s)){toast('Duyệt khung của cảnh trước khi nhập clip.');return;}const temp=URL.createObjectURL(file);try{const info=await useVideo(temp,async v=>{if(Math.abs(v.videoWidth/v.videoHeight-9/16)>.025)throw Error('Clip cần có khung dọc 9:16.');if(!Number.isFinite(v.duration)||v.duration<.2)throw Error('Clip không có thời lượng hợp lệ.');await seekFrame(v,Math.max(0,v.duration-.06));return{duration:v.duration,width:v.videoWidth,height:v.videoHeight,tail:capture(v)};});if(project.id!==projectId)throw Error('Dự án đã thay đổi; chưa nhập clip.');const part=target.part||clipParts(s)[0].id;if(!clipParts(s).some(p=>p.id===part))throw Error('Phần clip này không còn tồn tại sau khi sửa mốc.');const c={id:uid(),part,version:s.clips.filter(c=>c.part===part).length+1,asset:putAsset(file),name:file.name,model:s.model,prompt:speechForPart(s,clipParts(s).find(p=>p.id===part)).pending?null:makePrompt(s,clipParts(s).find(p=>p.id===part)),frameId:s.approvedFrame,createdAt:Date.now(),...info};s.clips.push(c);s.chosen[part]=c.id;if(clipParts(s).every(p=>chosenClip(s,p.id)))s.expanded=false;save();closeModal();render();toast('Đã nhập clip bản '+c.version+'. Các bản trước vẫn được giữ.');}catch(e){toast(e.message);}finally{URL.revokeObjectURL(temp);$('#clipFile').value='';}}
function runReview(){const approved=project.scenes.filter(frameApproved).length,total=project.scenes.length,credit=estimate();modal('Duyệt khung & chuẩn bị tạo clip','<ul class="checklist"><li class="'+(project.source?'ready':'')+'">'+(project.source?'✓':'○')+' Video tham khảo</li><li class="'+(approved===total&&total?'ready':'')+'">'+approved+'/'+total+' khung đã duyệt</li><li>'+project.scenes.reduce((n,s)=>n+clipParts(s).length,0)+' clip theo độ dài cảnh</li><li>Flow: chưa kết nối · chưa đọc được số credit còn lại</li><li>'+ (credit===null?'Ước tính: chưa có giá đã xác minh':credit+' credit theo mức bạn tự nhập; chưa bao gồm làm khung/giọng')+'</li></ul><div class="detailNotice">Flow tạo cả hình và tiếng trong mỗi clip. Không có lệnh tạo video hoặc khoản phí nào được gửi từ màn này. Kết nối Flow chạy ngầm, chi phí làm khung và TTS chưa được kiểm chứng.</div><button data-action="costs">Chỉnh mức credit tham khảo</button>', '<button data-action="close-modal">Đóng</button><button data-action="approve-source">Duyệt các khung không thay đổi</button><button class="primary" data-action="export-prompts">↓ Xuất prompt cho Flow</button>');}
function timingsDialog(){modal('Rà lại mốc cảnh','<p>Các cảnh giữ liên tục từ 0 đến hết video. Sửa điểm kết thúc của cảnh sẽ đổi điểm bắt đầu cảnh kế. Chia lại sẽ xóa các phê duyệt và lựa chọn clip bị ảnh hưởng.</p>'+project.scenes.map((s,i)=>'<div class="sceneTiming"><b>Cảnh '+(i+1)+'</b><span>'+s.start.toFixed(2)+'s →</span><input type="number" data-end-time="'+i+'" value="'+s.end.toFixed(3)+'" min="'+(s.start+.2)+'" max="'+project.source.duration+'" step="0.1" '+(i===project.scenes.length-1?'disabled':'')+' aria-label="Kết thúc cảnh '+(i+1)+'"></div>').join('')+'<div class="scriptToolbar"><button data-action="split-scene">＋ Tách cảnh đang chọn ở giữa</button><button data-action="merge-next">Nối cảnh đang chọn với cảnh kế</button></div>', '<button data-action="close-modal">Hủy</button><button class="primary" data-action="apply-timings">Lưu mốc & trích lại khung</button>');}
async function refreshSceneFrames(){const url=mediaUrl(project.source.asset);if(!url)throw Error('Cần chọn lại video nguồn trước khi trích khung.');await useVideo(url,async v=>{for(const s of project.scenes){s.thumbs=[];for(const t of [s.start+Math.min(.04,(s.end-s.start)/5),(s.start+s.end)/2,s.end-.01]){await seekFrame(v,t);s.thumbs.push(capture(v));}s.evidence=[];const boundaries=[s.start,...project.analysis.cuts.filter(t=>t>s.start&&t<s.end),s.end];for(let n=0;n<boundaries.length-1;n++){const at=(boundaries[n]+boundaries[n+1])/2;await seekFrame(v,at);s.evidence.push({at,image:capture(v,120)});}s.frames=[];invalidateFrame(s);s.clips=[];}});}
function exportAllPrompts(){for(const scene of project.scenes)if(!requireSpeechParts(scene))return;const text=project.scenes.flatMap(s=>clipParts(s).map(p=>makePrompt(s,p))).join('\n\n'+ '='.repeat(70)+'\n\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:'text/plain;charset=utf-8'}));a.download='SceneForge-prompts.txt';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);toast('Đã xuất các prompt hiện có. Kiểm tra ô dữ kiện còn trống trước khi dùng Flow.');}

function importAnalysis(data){const rows=data.scenes;if(!Array.isArray(rows)||!rows.length||rows.length>200)throw Error('JSON cần mảng scenes từ 1 đến 200 cảnh.');if(!project.scenes.length)throw Error('Dò/chia cảnh trước rồi nhập kết quả khớp các mốc đó.');if(rows.length!==project.scenes.length)throw Error('Số cảnh AI không khớp số cảnh đã chia. Không nhập để tránh lệch nguồn.');const updated=clone(project.scenes);for(let n=0;n<rows.length;n++){const raw=rows[n],s=updated[n];if(!Number.isFinite(raw.start)||!Number.isFinite(raw.end)||Math.abs(raw.start-s.start)>.05||Math.abs(raw.end-s.end)>.05)throw Error('Mốc cảnh '+(n+1)+' không khớp nguồn.');s.description=typeof raw.description==='string'?raw.description.slice(0,3000):s.description;for(const k of ['hasPerson','faceTalking','hasProduct','competitorLogo'])if(typeof raw[k]==='boolean')s[k]=raw[k];for(const group of ['visual','motion'])for(const lang of ['vi','en'])for(const [k,v]of Object.entries(raw[group]?.[lang]||{}))if(Object.hasOwn(viNames,k)&&typeof v==='string')s[group][lang][k]=v.slice(0,10000);for(const lang of ['vi','en'])if(typeof raw.promptFrame?.[lang]==='string')s.promptFrame[lang]=raw.promptFrame[lang].slice(0,15000);s.aiImported=true;invalidateFrame(s);}let lines=project.script;if(data.script){if(!Array.isArray(data.script)||data.script.length>1000)throw Error('Bản thoại không hợp lệ.');lines=data.script.map(l=>{if(!Number.isFinite(l.start)||!Number.isFinite(l.end)||l.start<0||l.end<=l.start||l.end>project.source.duration+.1)throw Error('Mốc thoại vượt nguồn.');return{id:uid(),start:l.start,end:l.end,original:String(l.original||'').slice(0,5000),translation:String(l.translation||'').slice(0,5000),newText:String(l.newText||l.original||'').slice(0,5000),faceTalking:l.faceTalking===true,measuredSec:null};});}project.scenes=updated;project.script=lines;if(data.script)for(const scene of project.scenes)scene.dialogueParts={};for(const k of Object.keys(refNames))autoConnect(k);save();render();toast('Đã nhập dữ liệu AI. Hãy đối chiếu trước khi duyệt.');}

urn;}const a=document.createElement('a');a.href=displayFrame(s);a.download='canh-'+(s.index+1)+'-khung.jpg';a.click();}if(button.dataset.loadProject){const row=(await readProjects()).find(p=>p.id===button.dataset.loadProject);if(row)loadSaved(row);}if(button.dataset.removeLine){const before=scriptPartitionSnapshot();project.script=project.script.filter(l=>l.id!==button.dataset.removeLine);invalidateChangedPartitions(before);save();render();scriptDialog();}if(button.dataset.orderUp){const n=Number(button.dataset.orderUp);[project.merge.order[n-1],project.merge.order[n]]=[project.merge.order[n],project.merge.order[n-1]];save();actions['merge-order']();}});

renderDetails=function(){if(!isPhotoProject()){referenceDetails();return;}const s=activeScene();if(!s){closeDetails();return;}if(detailTab==='frame'){$('#details').innerHTML='<header><div><h2>Khung mới · Cảnh '+(selected+1)+'</h2><p>'+esc(s.description)+'</p></div><button data-action="close-details">×</button></header><div class="detailNotice">Đây là cảnh được sáng tạo từ ảnh và ý tưởng; không có khung video gốc để đối chiếu. AI tạo ảnh chưa kết nối.</div><div class="refToggles">'+Object.entries(refNames).map(([key,name])=>'<label><input type="checkbox" data-link-ref="'+key+'" '+(s.refsUsed.includes(key)?'checked':'')+'> '+name+'</label>').join('')+'</div>'+fieldArea('frame','vi',s.promptFrame.vi,'Prompt tạo khung · Việt')+fieldArea('frame','en',s.promptFrame.en,'Prompt tạo khung · English')+'<button data-frame-upload="'+s.id+'">↥ Nhập khung ngoài</button><footer class="detailBottom"><button data-detail="'+s.id+'" data-tab="video">Prompt video</button><button class="primary" data-action="save-details">Lưu</button></footer>';return;}referenceDetails();const notice=$('#details .detailNotice');if(notice&&detailTab==='video')notice.textContent=(project.demo?'Kịch bản và prompt minh họa có sẵn.':'Nội dung mới từ ý tưởng/kịch bản được nhập; không phải quan sát video gốc.')+' AI tự viết và dịch chưa kết nối.';};
function invalidatePhotoStory(){if(!isPhotoProject())return;project.storyboard.approved=false;project.storyboard.revision++;for(const scene of project.scenes)invalidateFrame(scene);}
function photoBriefRequest(){return{mode:'photos',aspectRatio:'9:16',brief:clone(project.brief),references:clone(project.refs),voice:clone(project.flowVoice),instruction:'Create a new Vietnamese video storyboard from these user references and brief, not from a source video. Do not invent product performance or facts. Supply contiguous scene timings totaling the target duration. Each scene needs description, dialogue in Vietnamese, hasPerson, hasProduct, visual{vi,en}, motion{vi,en}, promptFrame{vi,en}. English visual/motion prompts must preserve person/product identity, exact product label, realistic scale, lighting and continuity. Flow will create both audible Vietnamese dialogue and picture. JSON format: sceneforge-photo-storyboard, version 1, scenes[].'};}
function photoStoryTemplate(){return{format:'sceneforge-photo-storyboard',version:1,scenes:[{start:0,end:Number(project.brief.duration),description:'Mô tả cảnh đề xuất',hasPerson:true,hasProduct:true,faceTalking:true,dialogue:'',visual:{vi:{person:'',product:'',scale:'',composition:'Dọc 9:16',background:'',lighting:''},en:{person:'',product:'',scale:'',composition:'Portrait 9:16',background:'',lighting:''}},motion:{vi:{camera:'',initial:'',action:'',final:''},en:{camera:'',initial:'',action:'',final:''}},promptFrame:{vi:'',en:''}}]};}
function importPhotoStory(data){if(data.format!=='sceneforge-photo-storyboard'||!Array.isArray(data.scenes)||!data.scenes.length||data.scenes.length>100)throw Error('Cần JSON kịch bản từ ảnh đúng định dạng sceneforge-photo-storyboard. Không nhập bản phân tích video vào không gian này.');let at=0;const scenes=[],script=[];for(const [index,raw]of data.scenes.entries()){if(!Number.isFinite(raw.start)||!Number.isFinite(raw.end)||Math.abs(raw.start-at)>.01||raw.end-raw.start<.2||raw.end>600)throw Error('Mốc cảnh phải liên tục, bắt đầu từ 0 và dài ít nhất 0,2 giây.');at=raw.end;const scene=sceneRecord(raw.start,raw.end,index,[]);scene.description=String(raw.description||'Cảnh '+(index+1)).slice(0,3000);scene.hasPerson=raw.hasPerson===true;scene.hasProduct=raw.hasProduct!==false;scene.faceTalking=raw.faceTalking===true;scene.refsUsed=[...(scene.hasPerson?['person']:[]),...(scene.hasProduct?['product']:[])];for(const key of ['outfit','background'])if(project.refs[key].images.length||project.refs[key].description)scene.refsUsed.push(key);for(const group of ['visual','motion'])for(const lang of ['vi','en'])for(const[key,value]of Object.entries(raw[group]?.[lang]||{}))if(Object.hasOwn(viNames,key)&&typeof value==='string')scene[group][lang][key]=value.slice(0,10000);for(const lang of ['vi','en'])scene.promptFrame[lang]=typeof raw.promptFrame?.[lang]==='string'?raw.promptFrame[lang].slice(0,15000):'';scenes.push(scene);const text=String(raw.dialogue||'').slice(0,5000);if(text)script.push({id:uid(),start:raw.start,end:raw.end,original:'',translation:'',newText:text,faceTalking:scene.faceTalking});}if(Math.abs(at-Number(project.brief.duration))>.05)throw Error('Tổng kịch bản phải khớp '+project.brief.duration+' giây đã chọn.');project.scenes=scenes;project.script=script;project.storyboard={approved:false,revision:(project.storyboard.revision||0)+1};project.merge.order=scenes.map(s=>s.id);project.layout={nodes:{}};selected=0;save();closeModal();render();fit(false);toast('Đã nhập kịch bản mới từ ảnh. Xem và duyệt trước khi tạo khung.');}
function reviewPhotoStory(){modal('Duyệt kịch bản từ ảnh & ý tưởng','<p>'+project.scenes.length+' cảnh · '+projectDuration()+' giây · '+(project.demo?'Mẫu minh họa có sẵn, không phải kết quả AI.':'Kịch bản đề xuất từ dữ liệu đã nhập.')+'</p><div class="storyReview">'+project.scenes.map((s,i)=>'<section><header><b>Cảnh '+(i+1)+'</b><span>'+stamp(s.start)+'–'+stamp(s.end)+'</span></header><label class="compactField">Mục đích / nội dung cảnh<textarea data-story-description="'+s.id+'">'+esc(s.description)+'</textarea></label>'+project.script.filter(l=>l.start<s.end&&l.end>s.start).map(l=>'<label class="compactField">Lời người nói / lời ngoài hình<textarea data-line="'+l.id+'">'+esc(l.newText)+'</textarea></label>').join('')+'<p class="status">'+(s.hasPerson?'Có nhân vật':'Không có mặt người')+' · '+(s.faceTalking?'Người trong hình nói':'Lời ngoài hình')+'</p></section>').join('')+'</div><div class="detailNotice">Duyệt bước này xác nhận nội dung, không tạo ảnh hoặc tiêu credit Flow. Thiếu ảnh người/sản phẩm sẽ được nhắc trước khi duyệt.</div>','<button data-action="close-modal">Để sau</button><button class="primary" data-action="approve-story">✓ Duyệt kịch bản</button>');}

// Original canvas interactions. Node coordinates use world space, independent of zoom.
let nodeGesture=null,nodeDragFrame=0,canvasLayoutFrame=0,suppressNodeClickUntil=0;

function nearestFree(node,x,y,obstacles){
 const origin={x:Math.max(24,Math.min(30000,x)),y:Math.max(34,Math.min(50000,y))},pending=[origin],seen=new Set();let count=0;
 while(pending.length&&count++<1500){pending.sort((a,b)=>((a.x-origin.x)**2+(a.y-origin.y)**2)-((b.x-origin.x)**2+(b.y-origin.y)**2));const p=pending.shift(),key=Math.round(p.x)+','+Math.round(p.y);if(seen.has(key))continue;seen.add(key);const rect=nodeRect(node,p.x,p.y),hits=obstacles.filter(o=>rectsTouch(rect,o));if(!hits.length)return p;
  for(const o of hits){for(const candidate of [{x:o.x-node.offsetWidth-24,y:p.y},{x:o.x+o.width+24,y:p.y},{x:p.x,y:o.y-node.offsetHeight-24},{x:p.x,y:o.y+o.height+24}])if(candidate.x>=24&&candidate.y>=34&&candidate.x<=30000&&candidate.y<=50000)pending.push(candidate);}
 }
 return{x:origin.x,y:Math.max(34,...obstacles.map(o=>o.y+o.height+28))};
}
function updateWorldBounds(){const list=$$('.node');worldWidth=Math.max(1720,...list.map(n=>n.offsetLeft+n.offsetWidth+60));worldHeight=Math.max(1360,...list.map(n=>n.offsetTop+n.offsetHeight+90));$('#world').style.width=worldWidth+'px';$('#world').style.height=worldHeight+'px';$('#wires').style.height=worldHeight+'px';$('#wires').setAttribute('height',worldHeight);}
const autoRowsBeforeMove=layoutRows;
layoutRows=function(){
 if(nodeGesture)return;
 for(const n of $$('.node')){if(n.dataset.autoX)n.style.left=n.dataset.autoX;if(n.dataset.autoY)n.style.top=n.dataset.autoY;}
 autoRowsBeforeMove();
 const saved=savedNodePositions(),nodes=$$('.node'),placed=[];
 // Respect manually placed cards first; automatic cards move aside when content grows.
 const order=[...nodes.filter(n=>saved[n.id]),...nodes.filter(n=>!saved[n.id])];
 for(const n of order){const p=saved[n.id],x=Number.isFinite(p?.x)?p.x:n.offsetLeft,y=Number.isFinite(p?.y)?p.y:n.offsetTop,point=nearestFree(n,x,y,placed);n.style.left=Math.round(point.x)+'px';n.style.top=Math.round(point.y)+'px';if(p&&(Math.abs(point.x-x)>.5||Math.abs(point.y-y)>.5))saved[n.id]={x:point.x,y:point.y};placed.push(nodeRect(n));}
 updateWorldBounds();
};
function requestCanvasLayout(){if(nodeGesture||canvasLayoutFrame)return;canvasLayoutFrame=requestAnimationFrame(()=>{canvasLayoutFrame=0;layoutRows();drawWires();paintMinimap();});}
const nodeResizeObserver=new ResizeObserver(()=>requestCanvasLayout());
function observeNodeSizes(){nodeResizeObserver.disconnect();for(const n of $$('.node')){n.dataset.autoX=n.style.left;n.dataset.autoY=n.style.top;nodeResizeObserver.observe(n);}}
const renderBeforeMoving=render;
render=function(){if(nodeGesture)finishNodeGesture(true);renderBeforeMoving();observeNodeSizes();};
function paintNodeGesture(){nodeDragFrame=0;const g=nodeGesture;if(!g||!g.moved)return;g.node.style.left=Math.round(g.target.x)+'px';g.node.style.top=Math.round(g.target.y)+'px';const obstacles=$$('.node').filter(n=>n!==g.node).map(n=>nodeRect(n));g.node.classList.toggle('nodeCollision',obstacles.some(r=>rectsTouch(nodeRect(g.node),r)));updateWorldBounds();drawWires();paintMinimap();}
function finishNodeGesture(cancel=false){
 const g=nodeGesture;if(!g)return;cancelAnimationFrame(nodeDragFrame);nodeDragFrame=0;
 if(!cancel&&g.moved)paintNodeGesture();
 nodeGesture=null;g.node.classList.remove('nodeMoving','nodeCollision');document.body.classList.remove('moving-node');
 if(cancel||!g.moved){g.node.style.left=g.left+'px';g.node.style.top=g.top+'px';}
 else{const obstacles=$$('.node').filter(n=>n!==g.node).map(n=>nodeRect(n)),p=nearestFree(g.node,g.target.x,g.target.y,obstacles);g.node.style.left=Math.round(p.x)+'px';g.node.style.top=Math.round(p.y)+'px';savedNodePositions()[g.node.id]={x:Math.round(p.x),y:Math.round(p.y)};save();if(Math.hypot(p.x-g.target.x,p.y-g.target.y)>4)toast('Đã đặt node vào vùng trống cạnh điểm thả để tránh đè nhau.');}
 if(g.moved)suppressNodeClickUntil=performance.now()+200;
 try{$('#viewport').releasePointerCapture(g.pointer);}catch{}
 updateWorldBounds();drawWires();paintMinimap();
}
$('#viewport').addEventListener('pointerdown',e=>{
 const handle=e.target.closest('.node>header,.nodeLabel,.completedRow');if(!handle||e.target.closest('button,input,textarea,select,a,video,audio')||space||e.button!==0)return;
 const node=handle.closest('.node');if(!node)return;e.preventDefault();e.stopImmediatePropagation();
 nodeGesture={node,pointer:e.pointerId,x:e.clientX,y:e.clientY,left:node.offsetLeft,top:node.offsetTop,z:view.z,moved:false,target:{x:node.offsetLeft,y:node.offsetTop}};
 $('#viewport').setPointerCapture(e.pointerId);
},true);
$('#viewport').addEventListener('pointermove',e=>{const g=nodeGesture;if(!g||g.pointer!==e.pointerId)return;e.preventDefault();e.stopImmediatePropagation();const dx=e.clientX-g.x,dy=e.clientY-g.y;if(!g.moved&&Math.hypot(dx,dy)<4)return;g.moved=true;g.node.classList.add('nodeMoving');document.body.classList.add('moving-node');g.target={x:Math.max(24,Math.min(30000,g.left+dx/g.z)),y:Math.max(34,Math.min(50000,g.top+dy/g.z))};if(!nodeDragFrame)nodeDragFrame=requestAnimationFrame(paintNodeGesture);},true);
$('#viewport').addEventListener('pointerup',e=>{if(!nodeGesture)return;e.stopImmediatePropagation();finishNodeGesture(false);},true);
$('#viewport').addEventListener('pointercancel',e=>{if(!nodeGesture)return;e.stopImmediatePropagation();finishNodeGesture(true);},true);
$('#viewport').addEventListener('lostpointercapture',()=>{if(nodeGesture)finishNodeGesture(true);});
window.addEventListener('keydown',e=>{if(e.key==='Escape'&&nodeGesture){e.preventDefault();e.stopImmediatePropagation();finishNodeGesture(true);}},true);
window.addEventListener('blur',()=>finishNodeGesture(true));
document.addEventListener('click',e=>{if(performance.now()<suppressNodeClickUntil&&e.target.closest('#viewport')){e.preventDefault();e.stopImmediatePropagation();}},true);
$('#viewport').addEventListener('wheel',e=>{if(nodeGesture){e.preventDefault();e.stopImmediatePropagation();}},{capture:true,passive:false});
window.addEventListener('resize',requestCanvasLayout);
actions['arrange-nodes']=()=>{if(nodeGesture)finishNodeGesture(true);project.layout={nodes:{}};layoutRows();drawWires();paintMinimap();fit();save();toast('Đã xếp lại các node; không thay prompt, clip hay lời thoại.');};

init();
</script></body></html>
