name: SceneForge complete Windows installer
on:
  push:
    branches: [sceneforge-win-full-build]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-test:
    runs-on: windows-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Extract editable source and parse installer scripts
        shell: powershell
        run: |
          Expand-Archive -LiteralPath build-source.zip -DestinationPath work
          Get-ChildItem work/source/scripts/windows-installer/*.ps1 | ForEach-Object {
            $tokens=$null; $errors=$null
            [void][Management.Automation.Language.Parser]::ParseFile($_.FullName,[ref]$tokens,[ref]$errors)
            if($errors){@{passed=$false;phase='PowerShell parsing';file=$_.FullName;error=($errors|Out-String)}|ConvertTo-Json|Set-Content work/source/full-windows-check-report.json -Encoding UTF8;throw ($errors | Out-String)}
          }
      - name: Probe native Windows shortcut and registration steps
        shell: powershell
        run: |
          Set-Location work/source
          & scripts/windows-installer/check_registration.ps1
      - uses: actions/cache/restore@v4
        id: resource-cache
        with:
          path: |
            work/source/build-resources
            work/source/build-wheels
          key: sf-win-full-resources-20261028-flow1bcb-gemini1ad0-v1
      - name: Prepare build tools and real offline components
        shell: powershell
        run: |
          Set-Location work/source
          python -m pip install -r local_engine/requirements.txt -r local_engine/requirements-cpu.txt ziglang packaging
          if($LASTEXITCODE -ne 0){throw 'Build dependencies failed'}
          if('${{ steps.resource-cache.outputs.cache-hit }}' -ne 'true'){
          $ErrorActionPreference='Continue'
          python scripts/windows-installer/fetch_resources.py --output build-resources --core-wheels build-wheels *> fetch-resources.log
          $result=$LASTEXITCODE
          $ErrorActionPreference='Stop'
          if($result -ne 0){$tail=(Get-Content fetch-resources.log -Tail 100|Out-String);@{passed=$false;phase='resources';error=$tail}|ConvertTo-Json|Set-Content full-windows-check-report.json -Encoding UTF8;throw $tail}
          }
          python scripts/windows-installer/fetch_resources.py --output build-resources --crt-only
          if($LASTEXITCODE -ne 0){throw 'App-local VC runtime preparation failed'}
          Invoke-WebRequest -UseBasicParsing -Uri 'https://github.com/astral-sh/python-build-standalone/releases/download/20261026/cpython-3.12.16+20261026-x86_64-pc-windows-msvc-install_only_stripped.tar.gz' -OutFile python.tar.gz
      - uses: actions/cache/save@v4
        if: steps.resource-cache.outputs.cache-hit != 'true'
        with:
          path: |
            work/source/build-resources
            work/source/build-wheels
          key: sf-win-full-resources-20261028-flow1bcb-gemini1ad0-v1
      - uses: actions/cache/restore@v4
        id: installer-cache
        with:
          path: |
            work/source/artifacts/windows/SceneForge-Setup-Windows-x64-v2.exe
            work/source/artifacts/windows/SceneForge-Setup-Windows-x64-v2.exe.sha256
            work/source/artifacts/windows/build-report.json
          key: sf-full-exe-v2-${{ hashFiles('work/source/scripts/windows-installer/*.c', 'work/source/scripts/windows-installer/*.cs', 'work/source/scripts/windows-installer/build.py', 'work/source/scripts/windows-installer/install.ps1', 'work/source/scripts/windows-installer/uninstall.ps1', 'work/source/scripts/windows-installer/components.ps1', 'work/source/scripts/windows-installer/paths.py', 'work/source/scripts/windows-installer/provision.py', 'work/source/scripts/windows-installer/windows_bootstrap.py', 'work/source/local_engine/**', 'work/source/dist/**') }}
      - name: Build native full installer
        if: steps.installer-cache.outputs.cache-hit != 'true'
        shell: powershell
        run: |
          Set-Location work/source
          $python=(Get-Command python).Source
          $ErrorActionPreference='Continue'
          python scripts/windows-installer/build.py --python-tar python.tar.gz --wheels build-wheels --resources build-resources --zig-python $python *> build-installer.log
          $result=$LASTEXITCODE
          $ErrorActionPreference='Stop'
          if($result -ne 0){$tail=(Get-Content build-installer.log -Tail 100|Out-String);@{passed=$false;phase='build';error=$tail}|ConvertTo-Json|Set-Content full-windows-check-report.json -Encoding UTF8;throw $tail}
      - uses: actions/cache/save@v4
        if: steps.installer-cache.outputs.cache-hit != 'true'
        with:
          path: |
            work/source/artifacts/windows/SceneForge-Setup-Windows-x64-v2.exe
            work/source/artifacts/windows/SceneForge-Setup-Windows-x64-v2.exe.sha256
            work/source/artifacts/windows/build-report.json
          key: sf-full-exe-v2-${{ hashFiles('work/source/scripts/windows-installer/*.c', 'work/source/scripts/windows-installer/*.cs', 'work/source/scripts/windows-installer/build.py', 'work/source/scripts/windows-installer/install.ps1', 'work/source/scripts/windows-installer/uninstall.ps1', 'work/source/scripts/windows-installer/components.ps1', 'work/source/scripts/windows-installer/paths.py', 'work/source/scripts/windows-installer/provision.py', 'work/source/scripts/windows-installer/windows_bootstrap.py', 'work/source/local_engine/**', 'work/source/dist/**') }}
      - name: Test folder GUI, real transcription/export, reinstall and uninstall
        shell: powershell
        run: |
          Set-Location work/source
          $report=Get-Content artifacts/windows/build-report.json -Raw | ConvertFrom-Json
          & scripts/windows-installer/check_full_windows.ps1 -InstallerPath (Resolve-Path ('artifacts/windows/'+$report.file)) -Version $report.version
      - name: Publish verified installer as Release asset
        env:
          GH_TOKEN: ${{ github.token }}
        shell: powershell
        run: |
          Set-Location work/source
          $test=Get-Content full-windows-check-report.json -Raw | ConvertFrom-Json
          if(!$test.passed){throw 'Windows runtime test not passed'}
          $build=Get-Content artifacts/windows/build-report.json -Raw | ConvertFrom-Json
          $tag='sceneforge-windows-full-20261028'
          $ErrorActionPreference='Continue'
          gh release view $tag --repo $env:GITHUB_REPOSITORY
          if($LASTEXITCODE -ne 0){gh release create $tag --repo $env:GITHUB_REPOSITORY --title 'SceneForge Windows - full local tools and folder selection' --notes 'Verified Windows installer: chosen folders, offline CPU video tools/Whisper, SDK preparation, native uninstall preserving projects. Accounts remain user-owned. VieNeu voice is optional.'}
          if($LASTEXITCODE -ne 0){throw 'Could not create release'}
          gh release upload $tag ('artifacts/windows/'+$build.file) ('artifacts/windows/'+$build.file+'.sha256') artifacts/windows/build-report.json full-windows-check-report.json --repo $env:GITHUB_REPOSITORY --clobber
          if($LASTEXITCODE -ne 0){throw 'Release upload failed'}
          $release=@{url=('https://github.com/'+$env:GITHUB_REPOSITORY+'/releases/download/'+$tag+'/'+$build.file);sha256=$build.sha256;bytes=$build.bytes;version=$build.version;file=$build.file;windows_verified=$true;run_id=$env:GITHUB_RUN_ID}
          $release|ConvertTo-Json|Set-Content full-release.json -Encoding UTF8
      - name: Save build and verification report
        if: always()
        shell: python
        run: |
          from pathlib import Path
          import subprocess,json,os
          def git(*args,data=None,check=True):
              return subprocess.run(['git',*args],input=data,capture_output=True,check=check).stdout.decode().strip()
          git('config','user.name','SceneForge Windows checks');git('config','user.email','windows-checks@users.noreply.github.com')
          root=Path('work/source');wanted={'windows-check-report.json':root/'full-windows-check-report.json','release.json':root/'full-release.json','build-report.json':root/'artifacts/windows/build-report.json'}
          if not wanted['windows-check-report.json'].exists():
              wanted['windows-check-report.json'].parent.mkdir(parents=True,exist_ok=True);wanted['windows-check-report.json'].write_text(json.dumps({'passed':False,'error':'Build/preparation failed before runtime check','run_id':os.environ['GITHUB_RUN_ID']}))
          lines=[]
          for name,path in wanted.items():
              if path.exists():lines.append('100644 blob '+git('hash-object','-w','--stdin',data=path.read_bytes())+'\t'+name+'\n')
          tree=git('mktree',data=''.join(lines).encode());commit=git('commit-tree',tree,data=b'Complete Windows installer build/runtime report\n')
          git('push','origin',commit+':refs/heads/sceneforge-full-report-'+os.environ['GITHUB_RUN_ID'])
